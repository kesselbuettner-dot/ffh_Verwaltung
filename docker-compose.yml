services:
  postgres:
    image: postgres:16-alpine
    container_name: ffh_verwaltung-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ffh_verwaltung}
      POSTGRES_USER: ${POSTGRES_USER:-ffh_verwaltung}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ffh_verwaltung} -d ${POSTGRES_DB:-ffh_verwaltung}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ffh_verwaltung-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: ffh_verwaltung-app
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ffh_verwaltung}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ffh_verwaltung}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: docker
      MARKTGURU_ENDPOINT: ${MARKTGURU_ENDPOINT}
      MARKTGURU_API_KEY: ${MARKTGURU_API_KEY}
      MARKTGURU_CLIENT_KEY: ${MARKTGURU_CLIENT_KEY}
      MARKTGURU_ZIP: ${MARKTGURU_ZIP:-04109}
      MARKTGURU_LIMIT: ${MARKTGURU_LIMIT:-24}
      APP_VERSION: ${APP_VERSION:-0.1.1}
    volumes:
      - app_data:/app/data
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ffh_verwaltung-cloudflared
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-${TUNNEL_TOKEN:-}}
    command: ["tunnel", "--no-autoupdate", "run"]
    network_mode: host
    depends_on:
      app:
        condition: service_started

  updater:
    build:
      context: ./updater
    container_name: ffh_verwaltung-updater
    restart: unless-stopped
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN}
      REPOSITORY_DIR: /opt/ffh_verwaltung
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-kesselbuettner-dot/ffh_Verwaltung}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/opt/ffh_verwaltung
    ports:
      - "127.0.0.1:8091:8091"

  worker:
    build: .
    container_name: ffh_verwaltung-worker
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ffh_verwaltung}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ffh_verwaltung}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: docker,worker
      MARKTGURU_ENDPOINT: ${MARKTGURU_ENDPOINT}
      MARKTGURU_API_KEY: ${MARKTGURU_API_KEY}
      MARKTGURU_CLIENT_KEY: ${MARKTGURU_CLIENT_KEY}
      MARKTGURU_ZIP: ${MARKTGURU_ZIP:-04109}
      MARKTGURU_LIMIT: ${MARKTGURU_LIMIT:-24}
      APP_VERSION: ${APP_VERSION:-0.1.1}
    volumes:
      - app_data:/app/data
    command: ["java", "-jar", "/app/app.jar", "--worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  app_data:
  postgres_data:
  redis_data:
