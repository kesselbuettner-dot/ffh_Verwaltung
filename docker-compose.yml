services:
  postgres:
    image: postgres:16-alpine
    container_name: ffh_verwaltung-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ffh_verwaltung}
      POSTGRES_USER: ${POSTGRES_USER:-ffh_verwaltung}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ffh_verwaltung} -d ${POSTGRES_DB:-ffh_verwaltung}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: ffh_verwaltung-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    image: ${FFH_IMAGE:-ffh-verwaltung:local}
    container_name: ffh_verwaltung-app
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ffh_verwaltung}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ffh_verwaltung}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: docker
      APP_VERSION: ${APP_VERSION:-1.0.0}
      GITHUB_OWNER: ${GITHUB_OWNER:-kesselbuettner-dot}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-ffh_Verwaltung}
      UPDATER_URL: ${UPDATER_URL:-http://updater:8090}
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      MARKTGURU_ENDPOINT: ${MARKTGURU_ENDPOINT}
      MARKTGURU_API_KEY: ${MARKTGURU_API_KEY}
      MARKTGURU_CLIENT_KEY: ${MARKTGURU_CLIENT_KEY}
      MARKTGURU_ZIP: ${MARKTGURU_ZIP:-04109}
      MARKTGURU_LIMIT: ${MARKTGURU_LIMIT:-24}
    ports:
      - "8080:8080"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      updater: {condition: service_healthy}
  worker:
    build: .
    image: ${FFH_IMAGE:-ffh-verwaltung:local}
    container_name: ffh_verwaltung-worker
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ffh_verwaltung}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ffh_verwaltung}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: docker,worker
      APP_VERSION: ${APP_VERSION:-1.0.0}
      GITHUB_OWNER: ${GITHUB_OWNER:-kesselbuettner-dot}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-ffh_Verwaltung}
      MARKTGURU_ENDPOINT: ${MARKTGURU_ENDPOINT}
      MARKTGURU_API_KEY: ${MARKTGURU_API_KEY}
      MARKTGURU_CLIENT_KEY: ${MARKTGURU_CLIENT_KEY}
      MARKTGURU_ZIP: ${MARKTGURU_ZIP:-04109}
      MARKTGURU_LIMIT: ${MARKTGURU_LIMIT:-24}
    command: ["java", "-jar", "/app/app.jar", "--worker"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  updater:
    build: ./updater
    image: ${FFH_UPDATER_IMAGE:-ffh-verwaltung-updater:local}
    container_name: ffh_verwaltung-updater
    restart: unless-stopped
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      UPDATER_WORKSPACE: /workspace
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-kesselbuettner-dot/ffh_Verwaltung}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${FFH_DEPLOY_PATH:-/opt/ffh_verwaltung}:/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  redis_data:
