name: Inspection sessions regression
on:
  push:
    branches:
      - feature/unified-inspections-account-delete-20260922
  workflow_dispatch:
jobs:
  inspection-sessions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run appointment regression unit tests
        run: mvn -B -ntp -Dtest=DeviceInspectionPlanningControllerTest,DrivingYearReportControllerTest,DevicePrintReportControllerTest test
      - name: Test HTTP endpoint against disposable PostgreSQL
        run: |
          set -euo pipefail
          trap 'docker logs --tail 160 fw-cockpit-cycle-app 2>/dev/null || true' ERR
          docker network create fw-cockpit-cycle-ci
          docker run -d --name fw-cockpit-cycle-db --network fw-cockpit-cycle-ci \
            -e POSTGRES_USER=ci -e POSTGRES_DB=ci -e POSTGRES_PASSWORD=ci_only \
            postgres:16-alpine
          docker run -d --name fw-cockpit-cycle-redis --network fw-cockpit-cycle-ci redis:7-alpine
          docker build --progress=plain -t fw-cockpit-inspection-smoke .
          for i in $(seq 1 45); do
            if docker exec fw-cockpit-cycle-db pg_isready -U ci -d ci >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker run -d --name fw-cockpit-cycle-app --network fw-cockpit-cycle-ci \
            -p 127.0.0.1:18080:8080 \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://fw-cockpit-cycle-db:5432/ci \
            -e SPRING_DATASOURCE_USERNAME=ci -e SPRING_DATASOURCE_PASSWORD=ci_only \
            -e SPRING_DATA_REDIS_HOST=fw-cockpit-cycle-redis \
            -e JWT_SECRET=ci_only_long_test_secret_never_use_in_production_123456 \
            fw-cockpit-inspection-smoke
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18080/index.html >/dev/null; then ready=1; break; fi
            if ! docker inspect --format='{{.State.Running}}' fw-cockpit-cycle-app | grep -qx true; then break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then docker logs --tail 120 fw-cockpit-cycle-app; exit 1; fi
          python3 src/test/python/inspection_sessions_smoke.py
