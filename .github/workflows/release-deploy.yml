name: Release and Deploy

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.2.0"
        required: true
        type: string
      notes:
        description: "Optional release notes"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Test and create release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Version must use SemVer, e.g. 1.2.0"
              exit 1
            }
            TAG="v$VERSION"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: mvn -B test package

      - name: Create tag and release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          if [[ -n "$NOTES" ]]; then
            gh release create "$TAG" --title "FFH Verwaltung $VERSION" --notes "$NOTES"
          else
            gh release create "$TAG" --title "FFH Verwaltung $VERSION" --generate-notes
          fi

      - name: Verify release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Build Docker image
        run: docker build -t ffh-verwaltung:release .

  deploy:
    name: Deploy to FFH server
    needs: release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST"             "DEPLOY_PATH='$DEPLOY_PATH' VERSION='$VERSION' TAG='$TAG' bash -s" <<'REMOTE'
          set -euo pipefail

          if [[ -z "$DEPLOY_PATH" ]]; then
            echo "DEPLOY_PATH is required"
            exit 1
          fi

          if [[ ! -d "$DEPLOY_PATH/.git" ]]; then
            mkdir -p "$(dirname "$DEPLOY_PATH")"
            git clone "https://github.com/kesselbuettner-dot/ffh_Verwaltung.git" "$DEPLOY_PATH"
          fi

          cd "$DEPLOY_PATH"
          git fetch --prune --tags origin
          git checkout --force "$TAG"
          git reset --hard "$TAG"

          if [[ ! -f .env ]]; then
            echo "Missing $DEPLOY_PATH/.env"
            exit 1
          fi

          export APP_VERSION="$VERSION"
          export GITHUB_OWNER="kesselbuettner-dot"
          export GITHUB_REPOSITORY="ffh_Verwaltung"

          docker compose config >/dev/null
          docker compose up -d --build --remove-orphans

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/api/version >/dev/null; then
              break
            fi
            if [[ "$i" == "30" ]]; then
              docker compose ps
              docker compose logs --tail=120 app
              exit 1
            fi
            sleep 5
          done

          curl -fsS http://127.0.0.1:8080/api/version
          docker image prune -f
          REMOTE

      - name: Deployment summary
        run: |
          echo "Released: ${{ needs.release.outputs.tag }}"
          echo "Version:  ${{ needs.release.outputs.version }}"
          echo "Deployment completed successfully."
