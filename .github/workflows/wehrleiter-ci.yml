name: Wehrleiter Qualifications V1 CI
on:
  push:
    branches: [feature/wehrleiter-qualifications-v1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript
        run: |
          node --check src/main/resources/static/wehrleiter.js
          node src/test/js/menu-designer-smoke.cjs
          node src/test/js/admin-layout-smoke.cjs
      - name: Build and test Java
        run: mvn -B -ntp test
