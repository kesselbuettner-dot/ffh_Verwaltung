name: Menu Designer 577 CI
on:
  push:
    branches:
      - feature/menu-designer-on-577e741
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check external JavaScript
        run: |
          node --check src/main/resources/static/menu-designer.js
          node --check src/main/resources/static/sw.js
      - name: Check all inline scripts and designer bindings
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const html=fs.readFileSync('src/main/resources/static/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          for(let i=0;i<scripts.length;i++)new vm.Script(scripts[i][1],{filename:'index-inline-'+i+'.js'});
          if(!html.includes('function renderOriginalNavigation()')||!html.includes('function renderNavigation()')||!html.includes('menu-designer.js'))throw Error('Fallback missing');
          console.log('PASS inline JS and navigation fallback:',scripts.length,'script blocks');
          NODE
      - name: Compile and run permission tests
        run: mvn -B -ntp test
