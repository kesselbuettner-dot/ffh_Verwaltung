name: Shared Icon Library CI
on:
  push:
    branches: [feature/shared-icon-library-qualifications-20260923, feature/shared-icons-on-server-8405775-20260923, feature/icon-only-picker-in-settings-20260923, feature/qualification-icon-picker-plain-type-names-20260923, feature/devices-wehrleiter-design-20260923, feature/devices-unified-filter-dropdowns-20260923]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate icon database and JavaScript
        run: |
          node src/test/js/icon-library-smoke.cjs
          node src/test/js/print-pdf-layout-smoke.cjs
          node src/test/js/device-wehr-design-smoke.cjs
          node --check src/main/resources/static/menu-designer.js
          node --check src/main/resources/static/wehrleiter.js
          node --check src/main/resources/static/tabler-icons.js
          node --check src/main/resources/static/sw.js
      - name: Build and run Java tests
        run: mvn -B -ntp test
