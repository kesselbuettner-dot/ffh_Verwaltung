name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -q -DskipTests package
      - name: Test
        run: mvn -q test
      - name: PostgreSQL dashboard migration smoke test
        run: bash src/test/scripts/dashboard-schema-smoke.sh
      - name: Document center and TV JavaScript smoke tests
        run: node src/test/js/document-center-wallboard-smoke.cjs
