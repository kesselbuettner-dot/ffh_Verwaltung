<script>let token=localStorage.getItem('token')||null;

let memberId=localStorage.getItem('memberId')||null;

let members=[];

// Kassenkategorie bewusst vor allen Funktionen initialisieren.
// Verhindert TDZ-Fehler bei PWA/Browser-Wiederherstellung.
let activeCategory='Alle';
const roles=['ADMIN','VORSTAND','KASSENWART','FEUERWEHRWART','GERATEWART','GETRAENKEWART','THEKE','MEMBER'];

function headers(){return {'Authorization':'Bearer '+token,'Content-Type':'application/json'}}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...headers()};const r=await fetch(url,opt);if(r.status===401){logout();throw Error('Nicht angemeldet');}if(!r.ok){let t='Fehler';try{const j=await r.json();t=j.message||j.detail||(typeof j.error==='string'&&j.error!=='Conflict'?j.error:null)||t}catch{}throw Error(t)}return r.status===204?null:r.json()}
function openRegistration(){modalTitle.textContent='Mitglied registrieren';modalBody.innerHTML=`<div id="regMsg"></div><p class="sub">Die Registrierung wird erst nach Prüfung durch einen Administrator freigeschaltet.</p><div class="form-grid"><div class="field"><label>Vorname *</label><input id="regFirst" autocomplete="given-name"></div><div class="field"><label>Nachname *</label><input id="regLast" autocomplete="family-name"></div><div class="field full"><label>E-Mail *</label><input id="regEmail" type="email" autocomplete="email"></div><div class="field full"><label>Passwort *</label><input id="regPass" type="password" minlength="8" autocomplete="new-password"><small class="sub">Mindestens 8 Zeichen</small></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px"><button class="btn secondary" onclick="closeModal()">Abbrechen</button><button class="btn primary" onclick="registerMember()">Registrieren</button></div>`;modal.classList.remove('hidden')}
async function registerMember(){const first=regFirst.value.trim(),last=regLast.value.trim(),email=regEmail.value.trim(),password=regPass.value;if(!first||!last||!email||password.length<8){regMsg.innerHTML='<div class="message error">Bitte Vorname, Nachname, E-Mail und ein Passwort mit mindestens 8 Zeichen eingeben.</div>';return}try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({firstName:first,lastName:last,email,password})});if(!r.ok){let t='Registrierung fehlgeschlagen';try{const j=await r.json();t=j.message||j.error||t}catch{}throw Error(t)}const x=await r.json();closeModal();loginMsg.innerHTML='<div class="message success">✓ '+esc(x.message)+'</div>'}catch(e){regMsg.innerHTML='<div class="message error">'+esc(e.message)+'</div>'}}
async function login(){const u=loginUser.value.trim(),p=loginPass.value;loginMsg.innerHTML='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});if(!r.ok){let t='Ungültige Zugangsdaten';try{const j=await r.json();t=j.message||j.error||t}catch{}throw Error(t)}const x=await r.json();token=x.token;role=x.role;username=x.username;memberId=x.memberId;memberName=x.memberName||'';localStorage.setItem('token',token);localStorage.setItem('role',role);localStorage.setItem('username',username);if(memberId)localStorage.setItem('memberId',memberId);else localStorage.removeItem('memberId');localStorage.setItem('memberName',memberName);showApp()}catch(e){loginMsg.innerHTML=`<div class="message error">${esc(e.message)}</div>`}}
function showApp(){loginView.classList.add('hidden');appView.classList.remove('hidden');currentUser.textContent=username;currentRole.textContent=roleLabels[role]||role;document.getElementById('inventoryNav')?.classList.toggle('hidden',!['ADMIN','GETRAENKEWART'].includes(role));document.getElementById('deviceNav')?.classList.toggle('hidden',!['ADMIN','GERATEWART'].includes(role));navigate(role==='THEKE'?'theke':'dashboard')}
function logout(){localStorage.clear();location.reload()}
function toggleMenu(){sidebar.classList.toggle('open')}
function closeMobileMenu(){sidebar.classList.remove('open')}
function toggleNavSection(button){const opening=button.getAttribute('aria-expanded')!=='true';sidebar.querySelectorAll('.nav-section-toggle').forEach(section=>section.setAttribute('aria-expanded','false'));button.setAttribute('aria-expanded',String(opening))}
function activateNavSection(item){const section=item?.closest('.nav-section-items')?.previousElementSibling;if(section?.classList.contains('nav-section-toggle')){sidebar.querySelectorAll('.nav-section-toggle').forEach(button=>button.setAttribute('aria-expanded',String(button===section)))}}
function setActive(page){document.querySelectorAll('.nav-item[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));activateNavSection(sidebar.querySelector('.nav-item[data-page="'+page+'"]'))}
function navigate(page){setActive(page);closeMobileMenu();if(page==='dashboard')dashboard();else if(page==='members')membersPage();else if(page==='theke')thekePage();else if(page==='admin')adminPage();else if(page==='devices')devicePage();else if(['shopping','purchase','articles','inventory'].includes(page))inventoryPage(page)}
function module(name){closeMobileMenu();activateNavSection([...sidebar.querySelectorAll('.nav-item')].find(item=>item.getAttribute('onclick')==="module('"+name+"')"));if(name==='Schulung / Dienst'){trainingPage();return}content.innerHTML=`<div class="title-row"><h1>${esc(name)}</h1></div><div class="panel"><h3>Modul vorbereitet</h3><p>Die Navigation steht. Dieses Modul wird in einer nächsten Ausbaustufe fachlich verbunden.</p></div>`}
sidebar.addEventListener('click',event=>{if(event.target.closest('.nav-item'))closeMobileMenu()});
function money(v){return Number(v||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function dashboard(){content.innerHTML=`
<div class="dashboard-hero"><img class="hero-logo" src="/icons/wache48-logo.svg" alt="FFH 48 Logo"><div class="hero-content"><div class="hero-kicker">🔥 FFH VERWALTUNG · ÜBERSICHT</div><div class="hero-title">Willkommen zurück, <span>${esc(username||'Admin')}!</span></div><div class="hero-sub">Alles rund um Getränke, Mitglieder, Lager und Finanzen – klar strukturiert und für Desktop, Tablet und Smartphone optimiert.</div></div></div>

 <div class="stat"><div class="label">Kassenstand</div><div class="value" id="sBalance">–</div><div class="sub">Mitgliederguthaben</div></div>
 <div class="stat"><div class="label">Monatssaldo</div><div class="value" id="sFinanceBalance">–</div><div class="sub">Einnahmen minus Ausgaben</div></div>
</div>
<div class="dashboard-grid">
 <div class="panel"><div class="panel-head"><h3><span class="head-icon">📦</span> Lagerbestand</h3><button class="btn small secondary" onclick="navigate('theke')">Kasse →</button></div><div class="stock-table"><div class="stock-row head"><span>Artikel</span><span>Bestand</span><span>Min.</span><span>Status</span></div><div id="dashboardStock"></div></div></div>
 <div class="panel"><div class="panel-head"><h3><span class="head-icon">💶</span> Finanzen</h3><span class="badge" id="financePeriod">–</span></div><div class="finance-big"><div id="financePie" class="pie"><div class="pie-center"><span id="pieBalance">0,00 €</span><small>Saldo</small></div></div><div class="finance-legend"><div class="legend-row"><span><span class="legend-dot dot-income"></span>Einnahmen</span><strong id="pieIncome">0,00 €</strong></div><div class="legend-row"><span><span class="legend-dot dot-expense"></span>Ausgaben</span><strong id="pieExpenses">0,00 €</strong></div></div></div></div>
 <div class="panel"><div class="panel-head"><h3><span class="head-icon">⚡</span> Schnellzugriff</h3></div><div class="quick-grid"><button class="quick-action" onclick="navigate('theke')">🍺<br>Kasse öffnen</button><button class="quick-action" onclick="navigate('members')">👥<br>Mitglieder</button><button class="quick-action" onclick="navigate('theke')">📋<br>Bestellungen</button>${role==='ADMIN'?'<button class="quick-action" onclick="navigate(\'inventory\')">📦<br>Inventur</button>':''}<button class="quick-action" onclick="module('Finanzen')">💶<br>Finanzen</button><button class="quick-action" onclick="module('Marktguru')">🏷️<br>Angebote</button></div></div>
 <div class="panel"><div class="panel-head"><h3><span class="head-icon">🏷️</span> Aktuelle Marktguru-Angebote</h3><button class="btn small secondary" onclick="navigate('shopping')">Alle →</button></div><div id="dashboardOffers" class="offer-list"><div class="empty">Angebote werden geladen …</div></div></div>
 <div class="panel"><div class="panel-head"><h3><span class="head-icon">📊</span> Bestandsstatus</h3></div><div class="metric-card"><div class="metric-icon">⚠️</div><div class="metric-copy"><small>Unter Warnschwelle</small><strong id="lowStockCount">–</strong></div></div><div class="metric-card" style="margin-top:10px"><div class="metric-icon">🍺</div><div class="metric-copy"><small>Aktive Getränke</small><strong id="activeDrinkCount">–</strong></div></div><div class="metric-card" style="margin-top:10px"><div class="metric-icon">👥</div><div class="metric-copy"><small>Aktive Mitglieder</small><strong id="activeMemberCount">–</strong></div></div></div>
 <div class="panel"><div class="panel-head"><h3><span class="head-icon">ℹ️</span> System & PWA</h3></div><div class="metric-card"><div class="metric-icon">📱</div><div class="metric-copy"><small>Geräteoptimiert</small><strong>Desktop · Tablet · Handy</strong></div></div><div class="metric-card" style="margin-top:10px"><div class="metric-icon">🚒</div><div class="metric-copy"><small>FFH 48 Design</small><strong>Feuerwehr · Verein · Verwaltung</strong></div></div><p class="sub" style="margin:12px 2px 0">Die Anwendung läuft als installierbare PWA und kann direkt vom Startbildschirm geöffnet werden.</p></div>
</div>`;try{
 if(['ADMIN','VORSTAND','KASSENWART','THEKE'].includes(role)){members=await api('/api/members');sMembers.textContent=members.length;sActive.textContent=members.filter(m=>m.active).length+' aktiv';activeMemberCount.textContent=members.filter(m=>m.active).length;sBalance.textContent=money(members.reduce((a,m)=>a+Number(m.balance||0),0))}
 else{sMembers.textContent='–';sActive.textContent='– aktiv';sBalance.textContent='–';activeMemberCount.textContent='–'}
 drinks=await api('/api/drinks');const activeDrinks=drinks.filter(d=>d.active);sDrinks.textContent=activeDrinks.length;activeDrinkCount.textContent=activeDrinks.length;
 const low=activeDrinks.filter(d=>Number(d.stock||0)<Number(d.warningThreshold||0));lowStockCount.textContent=low.length;
 dashboardStock.innerHTML=activeDrinks.slice(0,6).map(d=>{const stock=Number(d.stock||0),min=Number(d.warningThreshold||0),low=stock<min;return `<div class="stock-row"><span><strong>${esc(d.name)}</strong><br><small class="sub">${d.sizeVolume!=null&&d.sizeUnitShortName?esc(String(d.sizeVolume))+' '+esc(d.sizeUnitShortName):''}</small></span><span>${stock}</span><span>${min}</span><span><span class="badge ${low?'':'ok'}">${low?'⚠ Niedrig':'✓ OK'}</span></span></div>`}).join('')||'<div class="empty">Keine aktiven Getränke.</div>';
 if(role==='ADMIN'){const shopping=await api('/api/inventory/shopping-list');const offers=shopping.filter(x=>x.marktguruOffer!=null);sOffers.textContent=offers.length;dashboardOffers.innerHTML=offers.slice(0,4).map(x=>{const o=x.marktguruOffer;return `<div class="offer"><span>🏷️</span><div><strong>${esc(x.name)}</strong><small>${esc(o.retailer||'Angebot')} · gültig ${esc((o.validTo||'').slice(0,10)||'–')}</small></div><strong class="balance pos">${money(o.price)}</strong></div>`}).join('')||'<div class="empty">Keine aktuellen Angebote.</div>'}else{sOffers.textContent='–';dashboardOffers.innerHTML='<div class="empty">Marktguru-Angebote sind nur für Administratoren sichtbar.</div>'}
 if(['ADMIN','VORSTAND','KASSENWART'].includes(role)){const f=await api('/api/dashboard/finance');sFinanceBalance.textContent=money(f.balance);pieIncome.textContent=money(f.income);pieExpenses.textContent=money(f.expenses);pieBalance.textContent=money(f.balance);financePeriod.textContent=f.from+' – '+f.to;const income=Math.max(0,Number(f.income||0)),expenses=Math.max(0,Number(f.expenses||0)),total=income+expenses;financePie.style.background=total?`conic-gradient(#159447 0deg ${(income/total)*360}deg,#c51f2d ${(income/total)*360}deg 360deg)`:'conic-gradient(#dfe4e8 0deg 360deg)'}else{sFinanceBalance.textContent='–'}
}catch(e){content.insertAdjacentHTML('afterbegin',`<div class="message error">${esc(e.message)}</div>`)}}
async function membersPage(){if(!['ADMIN','VORSTAND','KASSENWART','THEKE'].includes(role)){content.innerHTML='<div class="panel"><h2>Keine Berechtigung</h2></div>';return}const canEdit=['ADMIN','VORSTAND'].includes(role);const canBalance=['ADMIN','VORSTAND','KASSENWART'].includes(role);content.innerHTML=`<div class="title-row"><div><h1>Mitglieder</h1><span class="sub">Mitgliederdaten, persönlicher Login und Kontostand</span></div>${canEdit?'<button class="btn primary big" onclick="openMemberForm()">＋ Mitglied anlegen</button>':''}</div><div class="panel"><div class="toolbar"><input id="memberSearch" placeholder="🔎 Name, E-Mail oder Telefon suchen…" oninput="renderMembers()"><select id="memberFilter" onchange="renderMembers()"><option value="all">Alle Status</option><option value="active">Aktiv</option><option value="inactive">Inaktiv</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Mitglied</th><th>Login</th><th>Rolle</th><th>Status</th><th>Kontostand</th><th>Aktionen</th></tr></thead><tbody id="memberRows"></tbody></table></div></div>`;try{members=await api('/api/members');renderMembers()}catch(e){memberRows.innerHTML=`<tr><td colspan="6" class="empty">${esc(e.message)}</td></tr>`}}
function renderMembers(){const q=(memberSearch?.value||'').toLowerCase(),f=memberFilter?.value||'all';const list=members.filter(m=>(!q||[m.name,m.email,m.phone].some(v=>(v||'').toLowerCase().includes(q)))&&(f==='all'||(f==='active'?m.active:!m.active)));memberRows.innerHTML=list.map(m=>{const actions=(['ADMIN','VORSTAND'].includes(role)?`<button class="btn small secondary" onclick="openMemberForm(${m.id})">Bearbeiten</button> <button class="btn small danger" onclick="deleteMember(${m.id})">Löschen</button> `:'')+(['ADMIN','VORSTAND','KASSENWART'].includes(role)?`<button class="btn small secondary" onclick="openBalance(${m.id})">Kontostand</button>`:'');return `<tr><td><strong>${esc(m.name)}</strong><br><span class="sub">${esc(m.email||m.phone||'')}</span></td><td>${m.loginEnabled?`<span class="badge ok">● aktiv</span><br><span class="sub">${esc(m.username||'')}</span>`:'<span class="badge">– kein Login</span>'}</td><td>${esc(m.role?roleLabels[m.role]||m.role:'–')}</td><td><span class="badge ${m.active?'ok':'off'}">${m.active?'Aktiv':'Inaktiv'}</span></td><td class="balance ${Number(m.balance)>0?'pos':Number(m.balance)<0?'neg':'zero'}">${money(m.balance)}</td><td>${actions}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">Keine Mitglieder gefunden.</td></tr>'}
function availableRoles(){return role==='ADMIN'?roles:roles.filter(r=>r!=='ADMIN')}
function openMemberForm(id){if(!['ADMIN','VORSTAND'].includes(role)){alert('Keine Berechtigung.');return}const m=id?members.find(x=>x.id===id):null;if(m?.role==='ADMIN'&&role!=='ADMIN'){alert('Administratorkonten dürfen nur von einem Administrator bearbeitet werden.');return}const login=!!m?.loginEnabled;const selectedRole=m?.role||'MEMBER';modalTitle.textContent=m?'Mitglied bearbeiten':'Mitglied anlegen';modalBody.innerHTML=`<div id="formMsg"></div><div class="form-grid"><div class="field"><label>Name *</label><input id="fName" value="${esc(m?.name||'')}" autocomplete="off"></div><div class="field"><label>E-Mail</label><input id="fEmail" type="email" value="${esc(m?.email||'')}"></div><div class="field"><label>Telefon</label><input id="fPhone" value="${esc(m?.phone||'')}"></div><div class="field"><label>Status</label><select id="fActive"><option value="true" ${m?.active!==false?'selected':''}>Aktiv</option><option value="false" ${m?.active===false?'selected':''}>Inaktiv</option></select></div><div class="field full"><label>Anschrift</label><input id="fAddress" value="${esc(m?.address||'')}"></div></div><div class="panel" style="margin-top:14px;background:#f8fafb"><h3 style="margin-top:0">🔐 Persönlicher Login</h3><div class="field"><label><input id="fLogin" type="checkbox" ${login?'checked':''} onchange="toggleLoginFields()" style="width:auto;margin-right:8px"> Login aktivieren</label></div><div id="loginFields" class="form-grid ${login?'':'hidden'}"><div class="field"><label>Benutzername *</label><input id="fUsername" value="${esc(m?.username||'')}" autocomplete="off"></div><div class="field"><label>Rolle *</label><select id="fRole">${availableRoles().map(r=>`<option value="${r}" ${r===selectedRole?'selected':''}>${esc(roleLabels[r]||r)}</option>`).join('')}</select></div><div class="field full"><label>Passwort ${m?'(leer lassen = unverändert)':'*'}</label><input id="fPassword" type="password" autocomplete="new-password"></div></div></div><div style="display:flex;j }

      cache:'no-store',

<script>
window.login = async function () {
  const userEl = document.getElementById('loginUser');
  const passEl = document.getElementById('loginPass');
  const msgEl = document.getElementById('loginMsg');
  const button = document.querySelector('#loginView button.btn.primary');
  const username = (userEl?.value || '').trim();
  const password = passEl?.value || '';

  msgEl.textContent = '';
  if (!username || !password) {
    msgEl.innerHTML = '<div class="message error">Bitte Benutzername und Passwort eingeben.</div>';
    return;
  }

  if (button) { button.disabled = true; button.textContent = 'Anmelden …'; }

  try {
    const response = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });

    let data = {};
    try { data = await response.json(); } catch (_) {}

    if (!response.ok) {
      throw new Error(data.message || data.detail || data.error || 'Ungültige Zugangsdaten');
    }

    localStorage.setItem('token', data.token || '');
    localStorage.setItem('role', data.role || '');
    localStorage.setItem('username', data.username || username);
    localStorage.setItem('memberName', data.memberName || '');
    if (data.memberId != null) localStorage.setItem('memberId', data.memberId);
    else localStorage.removeItem('memberId');

    window.location.reload();
  } catch (e) {
    msgEl.innerHTML = '<div class="message error"></div>';
    msgEl.firstElementChild.textContent = e.message || 'Anmeldung fehlgeschlagen';
    if (button) { button.disabled = false; button.textContent = 'Anmelden'; }
  }
};

async function devicePage(){
 setActive('devices'); sidebar.classList.remove('open');
 content.innerHTML='<div class="title-row"><div><h1>Geräteprüfung</h1><span class="sub">Prüfungen, Fristen und Verantwortlichkeiten</span></div><div class="quick"><button class="btn primary" onclick="openDeviceScan()">📷 Gerät scannen</button><button class="btn secondary" onclick="deviceForm()">＋ Gerät</button></div></div><div class="panel"><div class="toolbar"><input id="deviceSearch" placeholder="Gerät, Inventarnummer, Barcode oder Seriennummer suchen" oninput="loadDevices()"><button class="btn secondary" onclick="loadDevices()">↻ Aktualisieren</button></div><div id="deviceMsg"></div><div class="table-wrap"><table class="table"><thead><tr><th>Gerät</th><th>Inventar</th><th>Standort</th><th>Letzte Prüfung</th><th>Nächste Prüfung</th><th>Verantwortlich</th><th>Status</th></tr></thead><tbody id="deviceRows"></tbody></table></div></div>';
 await loadDevices();
}
async function loadDevices(){
 const q=document.getElementById('deviceSearch')?.value||'';
 try{const list=await api('/api/devices?q='+encodeURIComponent(q));deviceRows.innerHTML=list.map(d=>'<tr onclick="openDevice('+d.id+')" style="cursor:pointer"><td><strong>'+esc(d.name)+'</strong><br><small class="sub">'+esc([d.manufacturer,d.model].filter(Boolean).join(' '))+'</small></td><td>'+esc(d.inventoryNumber||'–')+'</td><td>'+esc(d.location||'–')+'</td><td>'+esc(d.lastInspectionDate||'–')+'</td><td>'+esc(d.nextInspectionDate||'–')+'</td><td>'+esc(d.responsibleUsername||'–')+'</td><td>'+deviceBadge(d.status)+'</td></tr>').join('')||'<tr><td colspan="7" class="empty">Keine Geräte gefunden.</td></tr>'}catch(e){deviceRows.innerHTML='<tr><td colspan="7" class="empty">'+esc(e.message)+'</td></tr>'}
}
function deviceBadge(s){return s==='UEBERFAELLIG'?'<span class="badge off">Überfällig</span>':s==='BALD'?'<span class="badge" style="background:#fff1cf;color:#8a5a00">Bald fällig</span>':s==='GUELTIG'?'<span class="badge ok">Gültig</span>':'<span class="badge">Unbekannt</span>'}
async function openDevice(id){
 try{const x=await api('/api/devices/'+id),d=x.device;modalTitle.textContent=d.name;modalBody.innerHTML='<div class="form-grid"><div class="field"><label>Inventarnummer</label><input value="'+esc(d.inventoryNumber||'')+'" readonly></div><div class="field"><label>Barcode</label><input value="'+esc(d.barcode||'')+'" readonly></div><div class="field"><label>Seriennummer</label><input value="'+esc(d.serialNumber||'')+'" readonly></div><div class="field"><label>Standort</label><input value="'+esc(d.location||'')+'" readonly></div><div class="field"><label>Letzte Prüfung</label><input value="'+esc(d.lastInspectionDate||'')+'" readonly></div><div class="field"><label>Nächste Prüfung</label><input value="'+esc(d.nextInspectionDate||'')+'" readonly></div><div class="field full"><label>Bemerkungen</label><textarea readonly>'+esc(d.notes||'')+'</textarea></div></div><hr><h3>Prüfung erfassen</h3><div class="form-grid"><div class="field"><label>Prüfdatum *</label><input id="inspDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Nächste Prüfung</label><input id="inspNext" type="date" value="'+esc(d.nextInspectionDate||'')+'"></div><div class="field"><label>Prüfart</label><input id="inspType" placeholder="z. B. wiederkehrende Prüfung"></div><div class="field"><label>Ergebnis</label><select id="inspResult"><option>BESTANDEN</option><option>MIT_MANGEL</option><option>NICHT_BESTANDEN</option></select></div><div class="field"><label>Prüfer</label><input id="inspInspector" value="'+esc(username)+'"></div><div class="field full"><label>Festgestellte Mängel</label><textarea id="inspDefects"></textarea></div><div class="field full"><label>Maßnahmen</label><textarea id="inspMeasures"></textarea></div><div class="field full"><label>Notizen</label><textarea id="inspNotes"></textarea></div></div><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn secondary" onclick="closeModal()">Abbrechen</button><button class="btn primary" onclick="saveInspection('+id+')">Prüfung speichern</button></div><hr><h3>Prüfhistorie</h3><div class="table-wrap"><table class="table"><thead><tr><th>Datum</th><th>Prüfart</th><th>Ergebnis</th><th>Prüfer</th><th>Nächste Prüfung</th></tr></thead><tbody>'+x.inspections.map(i=>'<tr><td>'+esc(i.inspectionDate)+'</td><td>'+esc(i.inspectionType||'–')+'</td><td>'+esc(i.result||'–')+'</td><td>'+esc(i.inspector||'–')+'</td><td>'+esc(i.nextInspectionDate||'–')+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">Noch keine Prüfungen.</td></tr>'+'</tbody></table></div>';modal.classList.remove('hidden')}catch(e){alert(e.message)}
}
async function saveInspection(id){
 const body={inspectionDate:inspDate.value,nextInspectionDate:inspNext.value||null,inspectionType:inspType.value,result:inspResult.value,inspector:inspInspector.value,defects:inspDefects.value,measures:inspMeasures.value,notes:inspNotes.value};
 try{await api('/api/devices/'+id+'/inspections',{method:'POST',body:JSON.stringify(body)});closeModal();loadDevices()}catch(e){alert(e.message)}
}
function deviceForm(){
 modalTitle.textContent='Gerät anlegen';modalBody.innerHTML='<div class="form-grid"><div class="field full"><label>Bezeichnung *</label><input id="devName"></div><div class="field"><label>Inventarnummer</label><input id="devInv"></div><div class="field"><label>Barcode</label><input id="devBarcode"><button class="btn secondary small" onclick="openDeviceScanForInput(\'devBarcode\')">📷 scannen</button></div><div class="field"><label>Seriennummer</label><input id="devSerial"></div><div class="field"><label>Hersteller</label><input id="devManufacturer"></div><div class="field"><label>Modell</label><input id="devModel"></div><div class="field"><label>Kategorie</label><input id="devCategory"></div><div class="field"><label>Standort</label><input id="devLocation"></div><div class="field"><label>Nächste Prüfung</label><input id="devNext" type="date"></div><div class="field"><label>Intervall (Monate)</label><input id="devInterval" type="number" min="1"></div><div class="field"><label>Verantwortlicher Kamerad</label><input id="devResponsible"></div><div class="field full"><label>Bemerkungen</label><textarea id="devNotes"></textarea></div></div><div style="display:flex;justify-content:flex-end"><button class="btn primary" onclick="saveDevice()">Speichern</button></div>';modal.classList.remove('hidden')
}
async function saveDevice(){const body={name:devName.value,inventoryNumber:devInv.value,barcode:devBarcode.value,serialNumber:devSerial.value,manufacturer:devManufacturer.value,model:devModel.value,category:devCategory.value,location:devLocation.value,purchaseDate:null,nextInspectionDate:devNext.value||null,inspectionIntervalMonths:devInterval.value?Number(devInterval.value):null,responsibleUsername:devResponsible.value,notes:devNotes.value,active:true};try{await api('/api/devices',{method:'POST',body:JSON.stringify(body)});closeModal();loadDevices()}catch(e){alert(e.message)}}
async function openDeviceScanForInput(target){openDeviceScan(target)}
async function openDeviceScan(target){
 modalTitle.textContent='Gerät scannen';modalBody.innerHTML='<p class="sub">Barcode/QR-Code scannen. Für eine aufgedruckte Seriennummer kann der erkannte Text anschließend manuell übernommen werden.</p><video id="deviceScanVideo" playsinline autoplay style="width:100%;max-height:48vh;background:#111;border-radius:12px"></video><div class="field"><label>Scanwert / Seriennummer</label><input id="deviceScanValue" autocomplete="off"><div style="display:flex;gap:8px;margin-top:8px"><button class="btn primary" onclick="useDeviceScan(\''+esc(target||'')+'\')">Übernehmen</button><button class="btn secondary" onclick="findDeviceByScan()">Gerät suchen</button></div></div><div id="deviceScanStatus" class="message">Kamera wird gestartet …</div>';modal.classList.remove('hidden');
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw Error('Kamera wird von diesem Browser nicht unterstützt.');
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});deviceScannerStream=stream;deviceScanVideo.srcObject=stream;
  if('BarcodeDetector' in window){deviceScannerDetector=new BarcodeDetector();const loop=async()=>{if(!deviceScannerStream)return;try{const codes=await deviceScannerDetector.detect(deviceScanVideo);if(codes.length){deviceScanValue.value=codes[0].rawValue;deviceScanStatus.textContent='Barcode erkannt: '+codes[0].rawValue;return}}catch(e){}deviceScannerTimer=setTimeout(loop,250)};loop();deviceScanStatus.textContent='Barcode-Erkennung aktiv. Für reine Seriennummern bitte den Text unten eingeben.'}else deviceScanStatus.textContent='Barcode-Erkennung in diesem Browser nicht verfügbar. Wert unten eingeben.';
 }catch(e){deviceScanStatus.textContent=e.message+' Bitte Wert unten eingeben.'}
}
async function findDeviceByScan(){const v=deviceScanValue.value.trim();if(!v)return;try{const d=await api('/api/devices/scan?value='+encodeURIComponent(v));stopDeviceScanner();closeModal();openDevice(d.id)}catch(e){deviceScanStatus.textContent=e.message}}
function useDeviceScan(target){const v=deviceScanValue.value.trim();if(!v)return;if(target){document.getElementById(target).value=v;stopDeviceScanner();closeModal()}else findDeviceByScan()}
function stopDeviceScanner(){if(deviceScannerTimer){clearTimeout(deviceScannerTimer);deviceScannerTimer=null}if(deviceScannerStream){deviceScannerStream.getTracks().forEach(t=>t.stop());deviceScannerStream=null}deviceScannerDetector=null}
</script></body></html>
