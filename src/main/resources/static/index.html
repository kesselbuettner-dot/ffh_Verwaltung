<script>let token=localStorage.getItem('token')||null;

function endLoading(){loaderCount=Math.max(0,loaderCount-1);if(loaderCount===0){clearTimeout(loaderTimer);document.getElementById('pageLoader')?.classList.remove('visible')}}
async function api(url,opt={}){beginLoading();try{opt.headers={...(opt.headers||{}),...headers()};const r=await fetch(url,opt);if(r.status===401){logout();throw Error('Nicht angemeldet');}if(!r.ok){let t='Fehler';try{const j=await r.json();t=j.detail||j.message||(typeof j.error==='string'&&j.error!=='Conflict'?j.error:null)||t}catch{}throw Error(t)}if(r.status===204)return null;const text=await r.text();return text?JSON.parse(text):null}finally{endLoading()}}

function installPwa(){if(isStandalone()){alert('Die FFH-Verwaltung ist bereits als App installiert.');updateInstallUI();return}modalTitle.textContent='FFH-App installieren?';modalBody.innerHTML='<div style="text-align:center"><img src="/icons/icon-192.png" alt="FFH-App" style="width:86px;height:86px;border-radius:20px;box-shadow:var(--shadow)"><h3>FFH Verwaltung als App installieren</h3><p>Die App wird auf deinem Startbildschirm abgelegt und kann anschließend wie eine normale App geöffnet werden.</p><div style="display:flex;justify-content:center;gap:10px;margin-top:18px"><button class="btn secondary" onclick="closeModal()">Nein</button><button class="btn primary" onclick="confirmInstallPwa()">Ja, installieren</button></div></div>';modal.classList.remove('hidden')}
async function confirmInstallPwa(){closeModal();if(!deferredInstallPrompt){showInstallHelp();return}const prompt=deferredInstallPrompt;deferredInstallPrompt=null;await prompt.prompt();const choice=await prompt.userChoice;if(choice.outcome==='accepted')updateInstallUI()}

function renderNavigation(){
 const host=document.getElementById('navContainer');
 try{
  if(window.MenuDesigner){
   window.MenuDesigner.renderNavigation();
   if(host?.querySelector('.nav-item'))return;
   console.error('MenuDesigner rendered no available menu items; restoring baseline navigation.');
  }

function renderOriginalNavigation(){
 const host=document.getElementById('navContainer');if(!host)return;
 const hidden=new Set((appSettings?.hiddenMenuItems||[]));
 let order=appSettings?.menuOrder?.length?appSettings.menuOrder:[...menuDefinitions.map(x=>x.id)];
 const rank=new Map(order.map((id,i)=>[id,i]));
 const items=menuDefinitions.filter(x=>x.implemented!==false).filter(menuAllowed).filter(x=>!hidden.has(x.id)).sort((a,b)=>(rank.get(a.id)??999)-(rank.get(b.id)??999));
 const groups=[];
 items.forEach(item=>{let group=groups[groups.length-1];if(!group||group.name!==item.section){group={name:item.section,items:[]};groups.push(group)}group.items.push(item)});
 let collapsedGroups=[];try{collapsedGroups=JSON.parse(localStorage.getItem('collapsedNavGroups')||'[]')}catch{}const collapsed=new Set(Array.isArray(collapsedGroups)?collapsedGroups:[]);

async function thekePage(){if(!['ADMIN','THEKE','MEMBER','GETRAENKEWART'].includes(role)){content.innerHTML='<div class="panel"><h2>Keine Berechtigung</h2><p>Die Kasse ist für diese Rolle nicht freigeschaltet.</p></div>';return}const canHistory=role==='ADMIN'||role==='THEKE';content.innerHTML=`<div class="title-row"><div><h1>🍺 Kasse / Theke</h1><span class="sub">Touch-Kasse · zentrale Order-API</span></div><button class="btn secondary" onclick="loadTheke()">↻ Aktualisieren</button></div><div id="thekeError"></div><div class="pos-layout"><div class="pos-products"><div class="member-bar"><div class="member-selected" id="selectedMember">${role==='MEMBER'?(esc(memberName)||'Mein Konto'):'Kein Mitglied ausgewählt'}</div>${role!=='MEMBER'?'<button class="btn primary big" onclick="chooseMember()">👤 Mitglied auswählen</button>':''}<div class="balance-pill">Guthaben: <strong id="memberBalance">–</strong></div></div><div class="category-tabs" id="catTabs"></div><div class="drink-grid" id="drinkGrid"></div></div><aside class="cart"><div class="cart-head"><h2>Warenkorb</h2><button class="btn small secondary" onclick="clearCart()">Leeren</button></div><div id="cartItems" class="cart-items"></div><div class="cart-total"><span>Summe</span><strong id="cartTotal">0,00 €</strong></div><button id="orderBtn" class="btn primary checkout" onclick="submitOrder()">✓ Bestellung buchen</button><div id="cartHint" class="sub center">Mitglied auswählen und Getränke antippen.</div></aside></div><div class="panel" id="topupPanel">Guthaben wird geladen …</div>${canHistory?'<div class="panel history-panel"><div class="title-row" style="margin-bottom:12px"><div><h2 style="margin:0">📋 Bestellhistorie</h2><span class="sub">Bestellungen des gewählten Tages · Storno bucht das Guthaben exakt zurück.</span></div></div><div class="history-toolbar"><input id="historyDate" type="date" onchange="loadOrderHistory()"><button class="btn secondary" onclick="setHistoryToday()">Heute</button><button class="btn secondary" onclick="shiftHistoryDate(-1)">← Vorheriger Tag</button><button class="btn secondary" onclick="shiftHistoryDate(1)">Nächster Tag →</button></div><div id="orderHistory" class="order-history"><div class="empty">Bestellungen werden geladen …</div></div></div>':''}`;await loadTheke();await topupPanel();if(canHistory)setHistoryToday()}
async function loadTheke(){try{drinks=await api('/api/theke/drinks');renderCategories();renderDrinks();if(role==='MEMBER'){const m=await api('/api/members/me');selectedMember.textContent=m.name;memberBalance.textContent=money(m.balance);window.selectedMemberId=m.id;window.selectedMemberBalance=Number(m.balance);if(!document.getElementById('memberPaypalButton'))document.querySelector('.member-bar')?.insertAdjacentHTML('beforeend','<button id="memberPaypalButton" class="btn primary big" onclick="openMemberTopup()">PayPal-Guthaben buchen</button>')}else if(window.selectedMemberId)await refreshSelectedMember();renderCart()}catch(e){thekeError.innerHTML=`<div class="message error">${esc(e.message)}</div>`}}
function openMemberTopup(){const panel=document.getElementById('topupPanel');if(!panel)return;panel.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>document.getElementById('topupAmount')?.focus(),350)}
function categories(){return ['Alle',...new Set(drinks.map(d=>d.category).filter(Boolean))]}
function renderCategories(){catTabs.innerHTML=categories().map(c=>`<button class="cat ${c===activeCategory?'active':''}" onclick='activeCategory=${JSON.stringify(c)};renderCategories();renderDrinks()'>${esc(c)}</button>`).join('')}
function renderDrinks(){const list=activeCategory==='Alle'?drinks:drinks.filter(d=>d.category===activeCategory);drinkGrid.innerHTML=list.map(d=>{const inCart=cart.find(x=>x.drinkId===d.id);const stock=Math.max(0,Number(d.stock)||0);const soldOut=stock<=0;const reachedStock=!!inCart&&inCart.quantity>=stock;const disabled=soldOut||reachedStock;const visual=d.imageUrl?`<img class="drink-image" src="${esc(d.imageUrl)}" alt="" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="drink-icon" hidden>${iconFor(d.category)}</span>`:`<span class="drink-icon">${iconFor(d.category)}</span>`;return `<button class="drink-tile ${disabled?'sold-out':''}" ${disabled?'disabled':''} onclick="addToCart(${d.id})" title="${soldOut?'Alle – nicht mehr auf Lager':reachedStock?'Bestand ausgeschöpft':''}">${visual}<strong>${esc(d.name)}</strong>${d.sizeVolume!=null&&d.sizeUnitShortName?`<small class="drink-size">${esc(String(d.sizeVolume))} ${esc(d.sizeUnitShortName)}</small>`:''}<span class="drink-price">${money(d.price)}</span>${inCart?`<span class="tile-count">${inCart.quantity}×</span>`:''}${soldOut?`<span class="sold-out-label">Alle</span>`:reachedStock?`<span class="sold-out-label">Bestand ausgeschöpft</span>`:''}</button>`}).join('')||'<div class="empty">Keine aktiven Getränke vorhanden.</div>'}
function iconFor(c){c=(c||'').toLowerCase();if(c.includes('bier'))return'🍺';if(c.includes('wein'))return'🍷';if(c.includes('spirit'))return'🥃';if(c.includes('wasser'))return'💧';if(c.includes('cola')||c.includes('limo'))return'🥤';return'🍹'}
function addToCart(id){const d=drinks.find(x=>x.id===id);if(!d)return;const stock=Math.max(0,Number(d.stock)||0);let x=cart.find(x=>x.drinkId===id);if(stock<=0||(x&&x.quantity>=stock))return;if(x)x.quantity++;else cart.push({drinkId:id,name:d.name,sizeVolume:d.sizeVolume,sizeUnitShortName:d.sizeUnitShortName,price:Number(d.price),quantity:1});renderCart();renderDrinks()}
function changeQty(id,delta){const x=cart.find(x=>x.drinkId===id);if(!x)return;const d=drinks.find(d=>d.id===id);const stock=Math.max(0,Number(d?.stock)||0);if(delta>0&&x.quantity>=stock)return;x.quantity+=delta;if(x.quantity<=0)cart=cart.filter(y=>y!==x);renderCart();renderDrinks()}
function clearCart(){cart=[];renderCart();renderDrinks()}
function renderCart(){cartItems.innerHTML=cart.map(x=>`<div class="cart-row"><div><strong>${esc(x.name)}</strong>${x.sizeVolume!=null&&x.sizeUnitShortName?`<small>${esc(String(x.sizeVolume))} ${esc(x.sizeUnitShortName)}</small>`:''}<small>${money(x.price)} / Stück</small></div><div class="qty"><button onclick="changeQty(${x.drinkId},-1)">−</button><strong>${x.quantity}</strong><button onclick="changeQty(${x.drinkId},1)">+</button></div><strong>${money(x.price*x.quantity)}</strong></div>`).join('')||'<div class="empty">Noch keine Getränke im Warenkorb.</div>';const total=cart.reduce((a,x)=>a+x.price*x.quantity,0);cartTotal.textContent=money(total);orderBtn.disabled=!cart.length||!window.selectedMemberId;cartHint.textContent=!window.selectedMemberId?'Mitglied auswählen und Getränke antippen.':('Guthaben: '+money(window.selectedMemberBalance||0))}
async function chooseMember(){const all=await api('/api/theke/members?q=');modalTitle.textContent='Mitglied auswählen';modalBody.innerHTML='<div class="field"><label>Suche</label><input id="memberLookup" autofocus placeholder="Name oder E-Mail" oninput="filterMemberChoices()"></div><div id="memberChoices" class="member-choices"></div>';window.allMemberChoices=all;filterMemberChoices();modal.classList.remove('hidden')}
function filterMemberChoices(){const q=(memberLookup?.value||'').toLowerCase();const base=window.allMemberChoices||[];memberChoices.innerHTML=base.filter(m=>m.name.toLowerCase().includes(q)||(m.email||'').toLowerCase().includes(q)).map(m=>`<button class="member-choice" onclick="selectMember(${m.id})"><span>👤 ${esc(m.name)}</span><strong>${money(m.balance)}</strong></button>`).join('')||'<div class="empty">Kein Mitglied gefunden.</div>'}
async function selectMember(id){window.selectedMemberId=id;await refreshSelectedMember();closeModal();renderCart()}
async function refreshSelectedMember(){const m=role==='MEMBER'?await api('/api/members/me'):await api(`/api/members/${window.selectedMemberId}`);selectedMember.textContent=m.name;window.selectedMemberBalance=Number(m.balance);if(memberBalance)memberBalance.textContent=money(m.balance)}
async function submitOrder(){if(!cart.length||!window.selectedMemberId)return;const total=cart.reduce((a,x)=>a+x.price*x.quantity,0);if(Number(window.selectedMemberBalance)<total){thekeError.innerHTML=`<div class="message error">Guthaben reicht nicht aus. Verfügbar: ${money(window.selectedMemberBalance)}</div>`;return}orderBtn.disabled=true;try{const r=await api('/api/theke/orders',{method:'POST',body:JSON.stringify({memberId:window.selectedMemberId,items:cart.map(x=>({drinkId:x.drinkId,quantity:x.quantity}))})});cart=[];await refreshSelectedMember();renderCart();renderDrinks();thekeError.innerHTML=`<div class="message success">✓ Bestellung #${r.id} über ${money(r.total)} wurde gebucht.</div>`;if(role==='ADMIN'||role==='THEKE')loadOrderHistory()}catch(e){thekeError.innerHTML=`<div class="message error">${esc(e.message)}</div>`}finally{orderBtn.disabled=!cart.length||!window.selectedMemberId}}
function setHistoryToday(){if(!historyDate)return;const d=new Date();historyDate.value=d.toLocaleDateString('en-CA');loadOrderHistory()}
function shiftHistoryDate(delta){if(!historyDate?.value)return;const d=new Date(historyDate.value+'T12:00:00');d.setDate(d.getDate()+delta);historyDate.value=d.toLocaleDateString('en-CA');loadOrderHistory()}
async function loadOrderHistory(){if(!orderHistory)return;const date=historyDate.value;orderHistory.innerHTML='<div class="empty">Lade Bestellungen …</div>';try{const list=await api('/api/theke/orders?date='+encodeURIComponent(date));renderOrderHistory(list)}catch(e){orderHistory.innerHTML=`<div class="message error">${esc(e.message)}</div>`}}
function renderOrderHistory(list){orderHistory.innerHTML=list.map(o=>{const time=new Date(o.createdAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});const items=o.items.map(i=>`${i.quantity}× ${esc(i.drinkName)}`).join(' · ');const cancelled=o.status==='CANCELLED';return `<div class="order-card ${cancelled?'cancelled':''}"><div class="order-main"><div class="meta"><strong>#${o.id} · ${esc(o.memberName)}</strong><div class="sub">${time} · ${esc(o.createdBy)}</div><div class="order-items">${items}</div>${cancelled?`<div class="order-items">Storniert von ${esc(o.cancelledBy||'–')} · ${o.cancelledAt?new Date(o.cancelledAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'–'} · Grund: ${esc(o.cancellationReason||'–')}</div>`:''}</div><div style="display:flex;align-items:center;gap:10px"><div><div class="history-total">${money(o.total)}</div><span class="badge ${cancelled?'status-cancelled':'status-completed'}">${cancelled?'Storniert':'Gebucht'}</span></div>${cancelled?'':`<button class="btn danger storno-btn" onclick='requestCancel(${o.id},${JSON.stringify(o.memberName)},${JSON.stringify(o.total)})'>↩ Storno</button>`}</div></div></div>`}).join('')||'<div class="empty">Keine Bestellungen für diesen Tag.</div>'}
function requestCancel(id,name,total){modalTitle.textContent=`Bestellung #${id} stornieren`;modalBody.innerHTML=`<div class="message error"><strong>${esc(name)}</strong><br>Das Guthaben wird um <strong>${money(total)}</strong> zurückgebucht.</div><div class="field"><label>Stornogrund *</label><textarea id="cancelReason" rows="4" maxlength="500" placeholder="z. B. Falschbuchung, Bestellung nicht ausgegeben …"></textarea></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn secondary" onclick="closeModal()">Abbrechen</button><button class="btn danger" onclick="confirmCancel(${id})">↩ Verbindlich stornieren</button></div>`;modal.classList.remove('hidden')}
async function confirmCancel(id){const reason=(cancelReason?.value||'').trim();if(reason.length<3){cancelReason.focus();return}const buttons=modalBody.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);try{const r=await api(`/api/theke/orders/${id}/cancel`,{method:'POST',body:JSON.stringify({reason})});closeModal();await loadOrderHistory();if(window.selectedMemberId===r.memberId)await refreshSelectedMember();thekeError.innerHTML=`<div class="message success">✓ Bestellung #${r.id} wurde storniert. ${money(r.total)} wurden dem Mitglied zurückgebucht.</div>`}catch(e){modalBody.insertAdjacentHTML('afterbegin',`<div class="message error">${esc(e.message)}</div>`);buttons.forEach(b=>b.disabled=false)}}
function closeModal(){if(typeof stopDeviceScanner==='function')stopDeviceScanner();modal.classList.add('hidden')}
window.addEventListener('load',()=>{applyDarkMode();updateInstallUI();if(token&&role)showApp();fetch('/version.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{if(v?.version&&document.getElementById('sidebarVersion'))sidebarVersion.textContent='Version '+v.version}).catch(()=>{})});

  if(a.imageUrl) afImagePreview.innerHTML='<img src="'+esc(a.imageUrl)+'" style="width:90px;height:90px;object-fit:cover;border-radius:12px;border:1px solid var(--line)">';

async function prepareArticleImage(file){
 if(!file)return null; if(file.size<=1900000)return file;
 return await new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(b=>{URL.revokeObjectURL(url);b?resolve(new File([b],'artikel.jpg',{type:'image/jpeg'})):reject(new Error('Bild konnte nicht verarbeitet werden'))},'image/jpeg',.82)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Bild konnte nicht gelesen werden'))};img.src=url;});
}

 const body={name:afName.value.trim(),category:afCategory.value.trim(),ean:afEan.value.trim(),price:Number(afPrice.value),warningThreshold:Number(afThreshold.value),active:afActive.value==='true',packageQuantity:afPackQty.value?Number(afPackQty.value):null,sizeVolume:afSizeVolume.value?Number(afSizeVolume.value):null,sizeUnitShortName:afSizeUnit.value.trim()||null};
 try{const saved=await api(id?'/api/inventory/articles/'+id:'/api/inventory/articles',{method:id?'PUT':'POST',body:JSON.stringify(body)});const image=await prepareArticleImage(afImage?.files?.[0]);if(image){const fd=new FormData();fd.append('file',image);const r=await fetch('/api/inventory/articles/'+saved.id+'/image',{method:'POST',headers:{'Authorization':'Bearer '+token},body:fd});if(!r.ok){let j={};try{j=await r.json()}catch{}throw new Error(j.message||j.detail||'Bild konnte nicht gespeichert werden')}}closeModal();articlesPage();}catch(e){articleMsg.innerHTML=`<div class="message error">${esc(e.message)}</div>`}
}

async function purchasePage(){

window.login = async function () {
  const userEl = document.getElementById('loginUser');
  const passEl = document.getElementById('loginPass');
  const msgEl = document.getElementById('loginMsg');
  const button = document.querySelector('#loginView button.btn.primary');
  const username = (userEl?.value || '').trim();
  const password = passEl?.value || '';

  msgEl.textContent = '';

    msgEl.innerHTML = '<div class="message error">Bitte Benutzername und Passwort eingeben.</div>';

      body: JSON.stringify({username, password})

    let data = {};
    try { data = await response.json(); } catch (_) {}

    if (!response.ok) {
      throw new Error(data.message || data.detail || data.error || 'Ungültige Zugangsdaten');
    }

    localStorage.setItem('token', data.token || '');
    localStorage.setItem('role', data.role || '');
    localStorage.setItem('username', data.username || username);
    localStorage.setItem('memberName', data.memberName || '');
    if (data.memberId != null) localStorage.setItem('memberId', data.memberId);
    else localStorage.removeItem('memberId');

    window.location.reload();
  } catch (e) {
    msgEl.innerHTML = '<div class="message error"></div>';
    msgEl.firstElementChild.textContent = e.message || 'Anmeldung fehlgeschlagen';
    if (button) { button.disabled = false; button.textContent = 'Anmelden'; }
  }
};

window.checkForUpdate = async function(autoInstall = false) {
  const el = document.getElementById('updateStatus');
  if (!el) return;
  el.className = 'update-status';
  el.innerHTML = '<span class="update-icon">⏳</span><div><strong>Update wird geprüft …</strong><small>GitHub-Release wird geprüft.</small></div>';
  try {
    const x = await api('/api/admin/update-check');
    if (x.updateAvailable) {
      el.className = 'update-status available';
      el.innerHTML = '<span class="update-icon">⬆️</span><div><strong>Update verfügbar</strong><small>Installiert: ' + esc(x.currentVersion) + ' · GitHub: ' + esc(x.remoteVersion) + '</small></div>';
      if (autoInstall) {
        await installServerUpdate(true);
      } else {
        const button = document.createElement('button');
        button.className = 'btn small primary';
        button.textContent = 'Update installieren';
        button.onclick = () => installServerUpdate(false);
        el.appendChild(button);
      }
    } else {
      el.className = 'update-status current';
      el.innerHTML = '<span class="update-icon">✓</span><div><strong>System ist aktuell</strong><small>Version ' + esc(x.currentVersion) + ' · GitHub ' + esc(x.remoteVersion) + '</small></div>';
      const button = document.createElement('button');
      button.className = 'btn small secondary';
      button.textContent = 'Erneut prüfen';
      button.onclick = () => checkForUpdate(false);
      el.appendChild(button);
    }
  } catch (e) {
    el.className = 'update-status error';
    el.innerHTML = '<span class="update-icon">⚠️</span><div><strong>Updateprüfung fehlgeschlagen</strong><small></small></div>';
    el.querySelector('small').textContent = e.message || 'GitHub konnte nicht erreicht werden';
    const button = document.createElement('button');
    button.className = 'btn small secondary';
    button.textContent = 'Erneut prüfen';
    button.onclick = () => checkForUpdate(false);
    el.appendChild(button);
  }
};
window.installServerUpdate = async function(autoInstall = false) {
  const el = document.getElementById('updateStatus');
  if (!el) return;
  if (!autoInstall && !confirm('Neues Release jetzt auf dem Server installieren? Die Anwendung wird dabei kurz neu gestartet.')) return;
  el.className = 'update-status';
  el.innerHTML = '<span class="update-icon">⏳</span><div><strong>Server-Update wird gestartet …</strong><small>Das neue GitHub-Release wird auf dem Server installiert.</small></div>';
  try {
    const response = await fetch('/api/admin/update-check/install', {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}
    });
    let data = {};
    try { data = await response.json(); } catch (_) {}
    if (!response.ok) throw new Error(data.message || data.detail || data.error || ('HTTP ' + response.status));
    el.className = 'update-status current';
    el.innerHTML = '<span class="update-icon">✓</span><div><strong>Update gestartet</strong><small>' + esc(data.message || 'Der Server wird aktualisiert.') + '</small></div>';
    setTimeout(() => window.location.reload(), 12000);
  } catch (e) {
    el.className = 'update-status error';
    el.innerHTML = '<span class="update-icon">⚠️</span><div><strong>Server-Update konnte nicht gestartet werden</strong><small></small></div>';
    el.querySelector('small').textContent = e.message || 'Update fehlgeschlagen';
    const button = document.createElement('button');
    button.className = 'btn small secondary';
    button.textContent = 'Erneut prüfen';
    button.onclick = () => checkForUpdate(false);
    el.appendChild(button);
  }
};

openDevice=async function(id){try{const x=await api('/api/devices/'+id),d=x.device;modalTitle.textContent=d.name;modalBody.innerHTML='<div class="form-grid"><div class="field"><label>Inventarnummer</label><input value="'+esc(d.inventoryNumber||'')+'" readonly></div><div class="field"><label>Kategorie</label><input value="'+esc(d.category||'')+'" readonly></div><div class="field"><label>Hersteller / Modell</label><input value="'+esc([d.manufacturer,d.model].filter(Boolean).join(' '))+'" readonly></div><div class="field"><label>Seriennummer</label><input value="'+esc(d.serialNumber||'')+'" readonly></div><div class="field"><label>Fahrzeug</label><input value="'+esc(d.vehicleName||'–')+'" readonly></div><div class="field"><label>Fach / Standort</label><input value="'+esc(d.compartmentName||d.location||'–')+'" readonly></div><div class="field full"><label>Bemerkungen</label><textarea readonly>'+esc(d.notes||'')+'</textarea></div></div><div class="quick">'+(d.vehicleId?'<button class="btn primary" onclick="closeModal();vehiclesPage('+d.id+')">🚒 Im Fahrzeug anzeigen</button>':'')+(hasPermission('fire.devices.write')&&hasPermission('fire.vehicles.write')?'<button class="btn secondary" onclick="assignExistingDevice('+d.id+')">📍 Fahrzeug/Fach zuordnen</button>':'')+(d.operationalStatus==='DEFECTIVE'&&hasPermission('fire.devices.write')?'<button class="btn secondary" onclick="markDeviceRepaired('+d.id+');closeModal()">✓ Repariert</button>':'')+'<button class="btn secondary" onclick="closeModal()">Schließen</button></div>';modal.classList.remove('hidden')}catch(e){alert(e.message)}};
async function assignExistingDevice(deviceId){try{const vehicles=await api('/api/vehicles');modalTitle.textContent='Fahrzeug und Fach auswählen';modalBody.innerHTML='<div class="select-tiles">'+vehicles.flatMap(v=>v.compartments.map(c=>'<button class="select-tile" onclick="saveDeviceAssignment('+c.id+','+deviceId+')">'+esc(v.name)+' – '+esc(c.name)+'</button>')).join('')+'</div>';modal.classList.remove('hidden')}catch(e){alert(e.message)}}
deviceForm=async function(id){let d=null,vehicles=[];try{if(id)d=(await api('/api/devices/'+id)).device;vehicles=hasPermission('fire.vehicles.read')?await api('/api/vehicles'):[]}catch(e){alert(e.message);return}const choices=vehicles.flatMap(v=>v.compartments.map(c=>({id:c.id,label:v.name+' – '+c.name})));modalTitle.textContent=d?'Gerät bearbeiten':'Gerät anlegen';modalBody.innerHTML='<div class="form-grid"><div class="field full"><label>Bezeichnung *</label><input id="devName" value="'+esc(d?.name||'')+'"></div><div class="field"><label>Inventarnummer</label><input id="devInv" value="'+esc(d?.inventoryNumber||'')+'"></div><div class="field"><label>Barcode</label><input id="devBarcode" value="'+esc(d?.barcode||'')+'"></div><div class="field"><label>Seriennummer</label><input id="devSerial" value="'+esc(d?.serialNumber||'')+'"></div><div class="field"><label>Hersteller</label><input id="devManufacturer" value="'+esc(d?.manufacturer||'')+'"></div><div class="field"><label>Modell</label><input id="devModel" value="'+esc(d?.model||'')+'"></div><div class="field"><label>Gerätekategorie</label><input id="devCategory" value="'+esc(d?.category||'')+'"></div><div class="field"><label>Fahrzeug und Fach</label><select id="devCompartment"><option value="">Noch nicht zugeordnet</option>'+choices.map(x=>'<option value="'+x.id+'" '+(x.id===d?.compartmentId?'selected':'')+'>'+esc(x.label)+'</option>').join('')+'</select></div><div class="field"><label>Standort (ohne Fahrzeug)</label><input id="devLocation" value="'+esc(d?.location||'')+'"></div><div class="field"><label>Verantwortlich</label><input id="devResponsible" value="'+esc(d?.responsibleUsername||'')+'"></div><div class="field"><label>Kaufdatum</label><input id="devPurchase" type="date" value="'+esc(d?.purchaseDate||'')+'"></div><div class="field"><label>Nächster Prüftermin</label><input id="devNext" type="date" value="'+esc(d?.nextInspectionDate||'')+'"></div><div class="field"><label>Prüfintervall (Monate)</label><input id="devInterval" type="number" min="1" value="'+esc(d?.inspectionIntervalMonths||'')+'"></div><div class="field"><label><input id="devInspectionRequired" type="checkbox" style="width:auto" '+(d?.inspectionRequired?'checked':'')+'> Gerät muss regelmäßig geprüft werden</label></div><div class="field full"><label>Bemerkungen</label><textarea id="devNotes">'+esc(d?.notes||'')+'</textarea></div></div><button class="btn primary" onclick="saveDevice('+(d?.id||'null')+')">Speichern</button>';modal.classList.remove('hidden')};
saveDevice=async function(id){const selected=devCompartment.value?Number(devCompartment.value):null;const body={name:devName.value,inventoryNumber:devInv.value,barcode:devBarcode.value,serialNumber:devSerial.value,manufacturer:devManufacturer.value,model:devModel.value,category:devCategory.value,location:devLocation.value,purchaseDate:devPurchase.value||null,nextInspectionDate:devNext.value||null,inspectionIntervalMonths:devInterval.value?Number(devInterval.value):null,responsibleUsername:devResponsible.value,notes:devNotes.value,active:true,compartmentId:selected,inspectionRequired:devInspectionRequired.checked};try{await api('/api/devices'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(body)});closeModal();await loadDevices()}catch(e){alert(e.message)}};

deviceInspectionPlansPage=async function(){setActive('device-inspection-plans');content.innerHTML='<div class="title-row"><div><h1>✅ Prüftermine</h1><span class="sub">Geräteprüfungen aus Diensten oder direkt angelegten Prüfterminen</span></div>'+(hasPermission('training.services.write')?'<button class="btn primary" onclick="openServiceForm(true)">＋ Prüftermin anlegen</button>':'')+'</div><div class="panel" id="inspectionSessions"><div class="empty">Prüftermine werden geladen …</div></div>';try{const list=await api('/api/device-planning/sessions');inspectionSessions.innerHTML=list.map(x=>'<div class="notice-item"><strong>'+new Date(x.date+'T12:00:00').toLocaleDateString('de-DE',{dateStyle:'full'})+' · '+esc(x.title)+'</strong><div class="sub">'+esc(x.locations.join(', '))+' · '+esc(x.categories.join(', '))+(x.total?' · '+x.completed+'/'+x.total+' bearbeitet':'')+'</div><button class="btn small primary" onclick="openInspectionSession('+x.eventId+',\''+x.date+'\')">Prüfliste öffnen</button></div>').join('')||'<div class="empty">Noch keine Geräteprüftermine angelegt.</div>'}catch(e){inspectionSessions.innerHTML='<div class="message error">'+esc(e.message)+'</div>'}};

async function vehiclesPage(focusDeviceId){setActive('vehicles');content.innerHTML='<div class="title-row"><div><h1>🚒 Fahrzeuge</h1><span class="sub">Schematische Beladungspläne mit frei angeordneten Fachkacheln</span></div>'+(hasPermission('fire.vehicles.write')?'<button class="btn primary" onclick="openVehicleForm()">＋ Fahrzeug</button>':'')+'</div><div class="panel"><div class="toolbar"><input id="vehicleDeviceSearch" placeholder="Gerät im Fahrzeug suchen …" oninput="renderVehicleDeviceSearch()"><div id="vehicleDeviceResults" class="select-tiles"></div></div><div id="vehicleHost"><div class="empty">Fahrzeuge werden geladen …</div></div></div>';try{window.vehicleData=await api('/api/vehicles');window.vehicleDevices=await api('/api/devices');let selected=window.vehicleData[0]?.id;if(focusDeviceId){const d=window.vehicleDevices.find(x=>x.id===Number(focusDeviceId));selected=d?.vehicleId||selected;window.vehicleFocusDevice=Number(focusDeviceId)}renderVehicles(selected)}catch(e){vehicleHost.innerHTML='<div class="message error">'+esc(e.message)+'</div>'}}
function renderVehicleDeviceSearch(){const q=vehicleDeviceSearch.value.toLowerCase().trim(),list=(window.vehicleDevices||[]).filter(x=>q&&x.vehicleId&&(x.name.toLowerCase().includes(q)||String(x.inventoryNumber||'').toLowerCase().includes(q))).slice(0,10);vehicleDeviceResults.innerHTML=list.map(x=>'<button class="select-tile" onclick="window.vehicleFocusDevice='+x.id+';renderVehicles('+x.vehicleId+')">'+esc(x.name)+' · '+esc(x.vehicleName)+' / '+esc(x.compartmentName)+'</button>').join('')}
function renderVehicles(selectedId){const list=window.vehicleData||[],vehicle=list.find(x=>x.id===Number(selectedId))||list[0];if(!vehicle){vehicleHost.innerHTML='<div class="empty">Noch kein Fahrzeug angelegt.</div>';return}const area={DRIVER:'Fahrerseite',PASSENGER:'Beifahrerseite',CREW:'Mannschaftsraum',ROOF:'Dach',REAR:'Heck'};vehicleHost.innerHTML='<div class="vehicle-tabs">'+list.map(v=>'<button class="btn '+(v.id===vehicle.id?'primary':'secondary')+'" onclick="renderVehicles('+v.id+')">'+esc(v.name)+'</button>').join('')+'</div><div class="title-row"><div><h2>'+esc(vehicle.name)+'</h2><span class="sub">'+esc(vehicle.callSign||'')+'</span></div>'+(hasPermission('fire.vehicles.write')?'<button class="btn secondary" onclick="openCompartmentForm('+vehicle.id+')">＋ Fach</button>':'')+'</div><div id="vehiclePlan" class="vehicle-plan" ondragover="event.preventDefault()" ondrop="dropVehicleCompartment(event,'+vehicle.id+')">'+vehicle.compartments.map(c=>'<div draggable="'+hasPermission('fire.vehicles.write')+'" ondragstart="event.dataTransfer.setData(\'text/plain\',\''+c.id+'\')" class="vehicle-compartment '+(c.devices.some(d=>d.id===window.vehicleFocusDevice)?'highlighted':'')+'" style="grid-column:'+c.gridX+' / span '+c.gridWidth+';grid-row:'+c.gridY+' / span '+c.gridHeight+'"><span class="area-label">'+esc(area[c.area]||c.area)+'</span><strong>'+esc(c.name)+'</strong>'+c.devices.map(d=>'<div class="vehicle-device '+(d.id===window.vehicleFocusDevice?'highlighted':'')+'" onclick="openDevice('+d.id+')">'+esc(d.name)+'</div>').join('')+(hasPermission('fire.vehicles.write')?'<button class="btn small secondary" onclick="event.stopPropagation();assignDeviceToCompartment('+c.id+')">＋ Gerät</button>':'')+'</div>').join('')+'</div>'}
function openVehicleForm(){modalTitle.textContent='Fahrzeug anlegen';modalBody.innerHTML='<div class="field"><label>Name *</label><input id="vfName" placeholder="z. B. LF 20"></div><div class="field"><label>Funkrufname</label><input id="vfCall"></div><div class="field"><label>Bemerkung</label><textarea id="vfNotes"></textarea></div><button class="btn primary" onclick="saveVehicle()">Speichern</button>';modal.classList.remove('hidden')}
async function saveVehicle(){try{await api('/api/vehicles',{method:'POST',body:JSON.stringify({name:vfName.value,callSign:vfCall.value,notes:vfNotes.value})});closeModal();await vehiclesPage()}catch(e){alert(e.message)}}
function openCompartmentForm(vehicleId){modalTitle.textContent='Fach anlegen';modalBody.innerHTML='<div class="form-grid"><div class="field"><label>Bezeichnung *</label><input id="vcName" placeholder="z. B. G1"></div><div class="field"><label>Bereich</label><select id="vcArea"><option value="DRIVER">Fahrerseite</option><option value="PASSENGER">Beifahrerseite</option><option value="CREW">Mannschaftsraum</option><option value="ROOF">Dach</option><option value="REAR">Heck</option></select></div><div class="field"><label>Breite (Rasterfelder)</label><input id="vcWidth" type="number" min="1" max="6" value="2"></div><div class="field"><label>Höhe</label><input id="vcHeight" type="number" min="1" max="4" value="1"></div></div><button class="btn primary" onclick="saveCompartment('+vehicleId+')">Speichern</button>';modal.classList.remove('hidden')}
async function saveCompartment(vehicleId){const vehicle=(window.vehicleData||[]).find(v=>v.id===vehicleId),nextRow=(vehicle?.compartments?.length||0)+1;try{await api('/api/vehicles/'+vehicleId+'/compartments',{method:'POST',body:JSON.stringify({name:vcName.value,area:vcArea.value,gridX:1,gridY:nextRow,gridWidth:Number(vcWidth.value),gridHeight:Number(vcHeight.value)})});closeModal();await vehiclesPage()}catch(e){alert(e.message)}}
async function dropVehicleCompartment(event,vehicleId){event.preventDefault();const id=Number(event.dataTransfer.getData('text/plain')),vehicle=(window.vehicleData||[]).find(v=>v.id===vehicleId),c=vehicle?.compartments.find(x=>x.id===id);if(!c)return;const rect=vehiclePlan.getBoundingClientRect(),x=Math.max(1,Math.min(6,Math.floor((event.clientX-rect.left)/(rect.width/6))+1)),y=Math.max(1,Math.floor((event.clientY-rect.top)/84)+1);try{await api('/api/vehicles/compartments/'+id,{method:'PUT',body:JSON.stringify({name:c.name,area:c.area,gridX:x,gridY:y,gridWidth:c.gridWidth,gridHeight:c.gridHeight})});await vehiclesPage(window.vehicleFocusDevice)}catch(e){alert(e.message)}}
async function assignDeviceToCompartment(compartmentId){const devices=window.vehicleDevices||[];modalTitle.textContent='Gerät einem Fach zuordnen';modalBody.innerHTML='<div class="field"><input id="assignDeviceSearch" placeholder="Gerät suchen …" oninput="filterAssignDevices()"></div><div id="assignDeviceRows" class="select-tiles">'+devices.map(d=>'<button class="select-tile" data-assign-name="'+esc(d.name.toLowerCase())+'" onclick="saveDeviceAssignment('+compartmentId+','+d.id+')">'+esc(d.name)+' · '+esc(d.inventoryNumber||'ohne Inventarnummer')+(d.vehicleName?' · bisher '+esc(d.vehicleName)+'/'+esc(d.compartmentName):'')+'</button>').join('')+'</div>';modal.classList.remove('hidden')}
function filterAssignDevices(){const q=assignDeviceSearch.value.toLowerCase();document.querySelectorAll('[data-assign-name]').forEach(x=>x.hidden=!x.dataset.assignName.includes(q))}
async function saveDeviceAssignment(compartmentId,deviceId){try{await api('/api/vehicles/compartments/'+compartmentId+'/device/'+deviceId,{method:'PUT'});closeModal();await vehiclesPage(deviceId)}catch(e){alert(e.message)}}
const vehicleViews=['DRIVER','REAR','PASSENGER','FRONT','CREW'];
const vehicleViewNames={DRIVER:'Fahrerseite',PASSENGER:'Beifahrerseite',CREW:'Mannschaftsraum',ROOF:'Dach',REAR:'Heck',FRONT:'Front'};
window.vehicleView=window.vehicleView||'DRIVER';window.vehicleLastView=window.vehicleLastView||'DRIVER';
function setVehicleView(view,vehicleId){if(view!=='ROOF')window.vehicleLastView=view;window.vehicleView=view;renderVehicles(vehicleId)}
function changeVehicleView(step,vehicleId){const current=window.vehicleView==='ROOF'?window.vehicleLastView:window.vehicleView,i=vehicleViews.indexOf(current);setVehicleView(vehicleViews[(i+step+vehicleViews.length)%vehicleViews.length],vehicleId)}
function vehicleDrawing(view){
 const side='<svg class="vehicle-drawing" viewBox="0 0 900 390" aria-hidden="true"><path d="M85 290V145q0-32 32-32h480l90 22 90 80h48v75z" fill="#c91d2c" stroke="#65121a" stroke-width="9"/><path d="M610 139l65 16 73 66H610z" fill="#bde7fa" stroke="#65121a" stroke-width="7"/><rect x="115" y="150" width="455" height="120" rx="8" fill="#df2938" stroke="#8b1520" stroke-width="6"/><path d="M115 212h455" stroke="#f6d229" stroke-width="15"/><rect x="640" y="244" width="120" height="24" rx="4" fill="#f6d229"/><circle cx="230" cy="292" r="51" fill="#26333d" stroke="#111" stroke-width="8"/><circle cx="230" cy="292" r="22" fill="#9aa7b0"/><circle cx="690" cy="292" r="51" fill="#26333d" stroke="#111" stroke-width="8"/><circle cx="690" cy="292" r="22" fill="#9aa7b0"/><rect x="160" y="92" width="50" height="22" rx="8" fill="#1689ff"/><rect x="655" y="113" width="48" height="20" rx="8" fill="#1689ff"/><text x="330" y="205" fill="#fff" font-size="34" font-weight="900">FEUERWEHR</text></svg>';
 const end='<svg class="vehicle-drawing" viewBox="0 0 900 390" aria-hidden="true"><rect x="270" y="65" width="360" height="250" rx="38" fill="#c91d2c" stroke="#65121a" stroke-width="10"/><rect x="315" y="105" width="270" height="90" rx="16" fill="#bde7fa" stroke="#65121a" stroke-width="7"/><path d="M315 232h270" stroke="#f6d229" stroke-width="18"/><rect x="300" y="50" width="62" height="22" rx="8" fill="#1689ff"/><rect x="538" y="50" width="62" height="22" rx="8" fill="#1689ff"/><circle cx="330" cy="316" r="42" fill="#26333d"/><circle cx="570" cy="316" r="42" fill="#26333d"/><text x="354" y="285" fill="#fff" font-size="29" font-weight="900">112</text></svg>';
 const roof='<svg class="vehicle-drawing" viewBox="0 0 900 390" aria-hidden="true"><rect x="150" y="38" width="600" height="310" rx="72" fill="#c91d2c" stroke="#65121a" stroke-width="10"/><rect x="218" y="84" width="464" height="220" rx="25" fill="#df2938" stroke="#8b1520" stroke-width="7"/><rect x="270" y="105" width="360" height="55" rx="12" fill="#eef4f7" stroke="#8b1520" stroke-width="7"/><rect x="270" y="182" width="360" height="98" rx="12" fill="#eef4f7" stroke="#8b1520" stroke-width="7"/><rect x="220" y="22" width="58" height="22" rx="8" fill="#1689ff"/><rect x="622" y="22" width="58" height="22" rx="8" fill="#1689ff"/></svg>';
 return view==='ROOF'?roof:(view==='FRONT'||view==='REAR'?end:side)
}
function deviceStackData(devices){const counts={},seen={};devices.forEach(d=>{const key=Math.round(d.placementX/10)+':'+Math.round(d.placementY/10);counts[key]=(counts[key]||0)+1});return devices.map(d=>{const key=Math.round(d.placementX/10)+':'+Math.round(d.placementY/10),index=seen[key]||0;seen[key]=index+1;return{device:d,index,stacked:counts[key]>1}})}
function vehicleDeviceTile(item,compartmentId){const d=item.device,write=hasPermission('fire.vehicles.write')&&hasPermission('fire.devices.write');return '<div class="device-placement '+(d.status==='DEFECTIVE'?'defective ':'')+(d.id===window.vehicleFocusDevice?'focused ':'')+(item.stacked?'stacked':'')+'" '+(write?'draggable="true" ondragstart="startVehicleDrag(event,\'device:'+d.id+'\')"':'')+' style="--stack:'+item.index+';left:'+d.placementX+'%;top:'+d.placementY+'%;width:'+d.placementWidth+'%;height:'+d.placementHeight+'%" onclick="event.stopPropagation();openDevice('+d.id+')">'+esc(d.name)+(d.inspectionRequired?' ✓':'')+(write?'<span class="device-scale"><button title="Kleiner" onclick="event.stopPropagation();resizeVehicleDevice('+compartmentId+','+d.id+',-.15)">−</button><button title="Größer" onclick="event.stopPropagation();resizeVehicleDevice('+compartmentId+','+d.id+',.15)">＋</button></span>':'')+'</div>'}
function vehicleCompartment(c){const write=hasPermission('fire.vehicles.write'),items=deviceStackData(c.devices||[]);return '<div class="vehicle-compartment-map '+(c.devices.some(d=>d.id===window.vehicleFocusDevice)?'highlighted':'')+'" style="grid-column:'+c.gridX+' / span '+c.gridWidth+';grid-row:'+c.gridY+' / span '+c.gridHeight+'" '+(write?'draggable="true" ondragstart="startVehicleDrag(event,\'compartment:'+c.id+'\')"':'')+' onclick="this.classList.toggle(\'expanded\')" ondragover="event.preventDefault();event.stopPropagation()" ondrop="dropVehicleItem(event,'+c.id+')"><div class="vehicle-compartment-head"><strong>'+esc(c.name)+'</strong>'+(write?'<span>⋮</span>':'')+'</div><div class="compartment-device-canvas" data-compartment-canvas="'+c.id+'">'+items.map(x=>vehicleDeviceTile(x,c.id)).join('')+'</div>'+(write?'<button class="btn small secondary" style="position:absolute;left:4px;bottom:3px;z-index:8" onclick="event.stopPropagation();assignDeviceToCompartment('+c.id+')">＋</button>':'')+'</div>'}
function renderVehicles(selectedId){const list=window.vehicleData||[],vehicle=list.find(x=>x.id===Number(selectedId))||list[0];if(!vehicle){vehicleHost.innerHTML='<div class="empty">Noch kein Fahrzeug angelegt.</div>';return}window.selectedVehicleId=vehicle.id;const view=window.vehicleView||'DRIVER',compartments=vehicle.compartments.filter(c=>c.area===view),unassigned=(window.vehicleDevices||[]).filter(d=>!d.vehicleId),write=hasPermission('fire.vehicles.write')&&hasPermission('fire.devices.write');vehicleHost.innerHTML='<div class="vehicle-tabs">'+list.map(v=>'<button class="btn '+(v.id===vehicle.id?'primary':'secondary')+'" onclick="renderVehicles('+v.id+')">'+esc(v.name)+'</button>').join('')+'</div><div class="title-row"><div><h2>'+esc(vehicle.name)+(vehicle.fireRelevant?'<span class="vehicle-fire-tag">Feuerwehrrelevant</span>':'')+'</h2><span class="sub">'+esc(vehicle.callSign||'')+'</span></div>'+(hasPermission('fire.vehicles.write')?'<button class="btn secondary" onclick="openCompartmentForm('+vehicle.id+')">＋ Fach</button>':'')+'</div><div class="vehicle-view-nav"><button class="btn secondary vehicle-view-arrow" title="Vorherige Seite" onclick="changeVehicleView(-1,'+vehicle.id+')">←</button><span class="view-name">'+vehicleViewNames[view]+'</span><button class="btn secondary vehicle-view-arrow" title="Nächste Seite" onclick="changeVehicleView(1,'+vehicle.id+')">→</button></div><div class="vehicle-stage">'+vehicleDrawing(view)+'<button class="btn secondary vehicle-view-up" onclick="setVehicleView(\''+(view==='ROOF'?window.vehicleLastView:'ROOF')+'\','+vehicle.id+')">'+(view==='ROOF'?'↓ Zurück':'↑ Dach')+'</button><div id="vehiclePlan" class="vehicle-overlay" ondragover="event.preventDefault()" ondrop="dropVehicleCompartment(event,'+vehicle.id+')">'+compartments.map(vehicleCompartment).join('')+'</div>'+(!compartments.length?'<div class="vehicle-empty-view">Für diese Ansicht sind noch keine Fächer angelegt.</div>':'')+(write?'<div class="vehicle-palette"><strong>Nicht zugeordnet:</strong>'+unassigned.map(d=>'<div class="palette-device" draggable="true" ondragstart="startVehicleDrag(event,\'device:'+d.id+'\')">'+esc(d.name)+'</div>').join('')+(unassigned.length?'':'<span>Alle Geräte sind zugeordnet.</span>')+'</div>':'')+'</div>'}
function startVehicleDrag(event,value){event.stopPropagation();event.dataTransfer.setData('text/plain',value);event.dataTransfer.effectAllowed='move'}
async function refreshVehicles(vehicleId,focusId){window.vehicleData=await api('/api/vehicles');window.vehicleDevices=await api('/api/devices');if(focusId)window.vehicleFocusDevice=Number(focusId);renderVehicles(vehicleId||window.selectedVehicleId)}
async function dropVehicleItem(event,compartmentId){event.preventDefault();event.stopPropagation();const value=event.dataTransfer.getData('text/plain');if(!value.startsWith('device:'))return;const deviceId=Number(value.split(':')[1]),canvas=event.currentTarget.querySelector('[data-compartment-canvas]'),rect=canvas.getBoundingClientRect(),d=(window.vehicleDevices||[]).find(x=>x.id===deviceId),x=Math.max(0,Math.min(88,Math.round((event.clientX-rect.left)/rect.width*100))),y=Math.max(0,Math.min(82,Math.round((event.clientY-rect.top)/rect.height*100)));try{await api('/api/vehicles/compartments/'+compartmentId+'/device/'+deviceId+'/placement',{method:'PUT',body:JSON.stringify({x,y,width:d?.placementWidth||38,height:d?.placementHeight||24})});await refreshVehicles(window.selectedVehicleId,deviceId)}catch(e){alert(e.message)}}
async function resizeVehicleDevice(compartmentId,deviceId,amount){const d=(window.vehicleDevices||[]).find(x=>x.id===deviceId);if(!d)return;const width=Math.max(12,Math.min(100,Math.round(d.placementWidth*(1+amount)))),height=Math.max(12,Math.min(100,Math.round(d.placementHeight*(1+amount))));try{await api('/api/vehicles/compartments/'+compartmentId+'/device/'+deviceId+'/placement',{method:'PUT',body:JSON.stringify({x:d.placementX,y:d.placementY,width,height})});await refreshVehicles(window.selectedVehicleId,deviceId)}catch(e){alert(e.message)}}
dropVehicleCompartment=async function(event,vehicleId){event.preventDefault();const value=event.dataTransfer.getData('text/plain');if(!value.startsWith('compartment:'))return;const id=Number(value.split(':')[1]),vehicle=(window.vehicleData||[]).find(v=>v.id===vehicleId),c=vehicle?.compartments.find(x=>x.id===id);if(!c)return;const rect=vehiclePlan.getBoundingClientRect(),x=Math.max(1,Math.min(6,Math.floor((event.clientX-rect.left)/(rect.width/6))+1)),y=Math.max(1,Math.min(5,Math.floor((event.clientY-rect.top)/(rect.height/5))+1));try{await api('/api/vehicles/compartments/'+id,{method:'PUT',body:JSON.stringify({name:c.name,area:window.vehicleView,gridX:x,gridY:y,gridWidth:c.gridWidth,gridHeight:c.gridHeight})});await refreshVehicles(vehicleId,window.vehicleFocusDevice)}catch(e){alert(e.message)}};
openVehicleForm=function(id){const v=(window.vehicleData||[]).find(x=>x.id===id);modalTitle.textContent=v?'Fahrzeug bearbeiten':'Fahrzeug anlegen';modalBody.innerHTML='<div class="field"><label>Name *</label><input id="vfName" value="'+esc(v?.name||'')+'" placeholder="z. B. LF 20"></div><div class="field"><label>Funkrufname</label><input id="vfCall" value="'+esc(v?.callSign||'')+'"></div><div class="field"><label><input id="vfFireRelevant" type="checkbox" style="width:auto" '+(!v||v.fireRelevant?'checked':'')+'> Feuerwehrrelevant</label><small class="sub">Defekte Geräte dieses Fahrzeugs erzeugen eine Dashboard-Meldung.</small></div><div class="field"><label>Bemerkung</label><textarea id="vfNotes">'+esc(v?.notes||'')+'</textarea></div><button class="btn primary" onclick="saveVehicle('+(v?.id||'null')+')">Speichern</button>';modal.classList.remove('hidden')};

openCompartmentForm=function(vehicleId){modalTitle.textContent='Fach anlegen';modalBody.innerHTML='<div class="form-grid"><div class="field"><label>Bezeichnung *</label><input id="vcName" placeholder="z. B. G1"></div><div class="field"><label>Ansicht</label><select id="vcArea">'+Object.entries(vehicleViewNames).map(x=>'<option value="'+x[0]+'" '+(x[0]===window.vehicleView?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></div><div class="field"><label>Breite (Rasterfelder)</label><input id="vcWidth" type="number" min="1" max="6" value="2"></div><div class="field"><label>Höhe</label><input id="vcHeight" type="number" min="1" max="4" value="1"></div></div><button class="btn primary" onclick="saveCompartment('+vehicleId+')">Speichern</button>';modal.classList.remove('hidden')};
saveCompartment=async function(vehicleId){const vehicle=(window.vehicleData||[]).find(v=>v.id===vehicleId),same=vehicle?.compartments?.filter(c=>c.area===vcArea.value)||[],nextRow=Math.min(5,same.length+1);try{await api('/api/vehicles/'+vehicleId+'/compartments',{method:'POST',body:JSON.stringify({name:vcName.value,area:vcArea.value,gridX:1,gridY:nextRow,gridWidth:Number(vcWidth.value),gridHeight:Number(vcHeight.value)})});window.vehicleView=vcArea.value;closeModal();await refreshVehicles(vehicleId)}catch(e){alert(e.message)}};

openDevice=async function(id){try{const x=await api('/api/devices/'+id),d=x.device,write=hasPermission('fire.devices.write');modalTitle.textContent=d.name;modalBody.innerHTML='<div class="form-grid"><div class="field"><label>Inventarnummer</label><input value="'+esc(d.inventoryNumber||'')+'" readonly></div><div class="field"><label>Kategorie</label><input value="'+esc(d.category||'')+'" readonly></div><div class="field"><label>Hersteller / Modell</label><input value="'+esc([d.manufacturer,d.model].filter(Boolean).join(' '))+'" readonly></div><div class="field"><label>Seriennummer</label><input value="'+esc(d.serialNumber||'')+'" readonly></div><div class="field"><label>Fahrzeug</label><input value="'+esc(d.vehicleName||'–')+'" readonly></div><div class="field"><label>Fach / Standort</label><input value="'+esc(d.compartmentName||d.location||'–')+'" readonly></div><div class="field"><label>Status</label><div>'+(d.operationalStatus==='DEFECTIVE'?'<span class="badge off">Defekt</span>':d.operationalStatus==='IN_REPAIR'?'<span class="badge" style="background:#fff0d6;color:#8a5700">In Reparatur</span>':'<span class="badge ok">Einsatzbereit</span>')+'</div></div><div class="field"><label><input id="detailInspectionRequired" type="checkbox" style="width:auto" '+(d.inspectionRequired?'checked':'')+' '+(write?'':'disabled')+' onchange="toggleDeviceInspectionRequired('+d.id+',this.checked)"> Gerät ist prüfpflichtig</label><small class="sub">Nur markierte Geräte erscheinen in Prüflisten.</small></div><div class="field full"><label>Statushinweis</label><textarea readonly>'+esc(d.operationalStatusNote||'')+'</textarea></div><div class="field full"><label>Bemerkungen</label><textarea readonly>'+esc(d.notes||'')+'</textarea></div></div><div class="quick">'+(d.vehicleId?'<button class="btn primary" onclick="closeModal();vehiclesPage('+d.id+')">🚒 Im Fahrzeug anzeigen</button>':'')+(write&&hasPermission('fire.vehicles.write')?'<button class="btn secondary" onclick="assignExistingDevice('+d.id+')">📍 Fahrzeug/Fach zuordnen</button>':'')+(write?'<button class="btn secondary" onclick="deviceForm('+d.id+')">Bearbeiten</button>':'')+(hasPermission('fire.devices.delete')?'<button class="btn danger" onclick="deleteDevice('+d.id+')">Löschen</button>':'')+(write?'<button class="btn danger" onclick="setDeviceCondition('+d.id+',\'DEFECTIVE\')">🚨 Defekt melden</button><button class="btn secondary" onclick="setDeviceCondition('+d.id+',\'IN_REPAIR\')">🔧 In Reparatur</button><button class="btn secondary" onclick="setDeviceCondition('+d.id+',\'OK\')">✓ Einsatzbereit</button>':'')+'<button class="btn secondary" onclick="closeModal()">Schließen</button></div>';modal.classList.remove('hidden')}catch(e){alert(e.message)}};
async function setDeviceCondition(id,status){const note=status==='OK'?'Als repariert und einsatzbereit gemeldet':prompt(status==='DEFECTIVE'?'Defekt beschreiben:':'Bearbeitungsstand / Reparaturhinweis:','') ;if(status!=='OK'&&note===null)return;try{await api('/api/devices/'+id+'/condition',{method:'PATCH',body:JSON.stringify({status,note})});closeModal();if(document.getElementById('deviceRows'))await loadDevices();if(document.getElementById('vehicleHost'))await refreshVehicles(window.selectedVehicleId,id)}catch(e){alert(e.message)}}

function overviewRoomDevices(c){const groups=new Map(),plain=[];(c.devices||[]).forEach(d=>d.placementGroupId?(groups.has(d.placementGroupId)?groups.get(d.placementGroupId).push(d):groups.set(d.placementGroupId,[d])):plain.push(d));let out=plain.map(d=>overviewDeviceHtml(d)).join('');for(const [key,items] of groups){const expanded=window.expandedVehicleGroups.has(key);out+=expanded?items.map((d,i)=>overviewDeviceHtml(d,1,i)).join(''):overviewDeviceHtml(items[0],items.length)}return out}

async function endRoomPointer(event){window.removeEventListener('pointermove',moveRoomPointer);const s=window.roomPointer;window.roomPointer=null;if(!s)return;const c=currentCompartment(window.roomCompartmentId),obj=s.kind==='device'?c.devices.find(x=>x.id===s.id):c.elements.find(x=>x.id===s.id);if(!obj)return;if(s.kind==='device'){obj.placementX=s.newX??obj.placementX;obj.placementY=s.newY??obj.placementY;obj.placementWidth=s.newW??obj.placementWidth;obj.placementHeight=s.newH??obj.placementHeight;obj.placementRotation=s.newR??obj.placementRotation;try{await saveDevicePlacement(c.id,obj)}catch(e){alert(e.message)}}else{obj.x=s.newX??obj.x;obj.y=s.newY??obj.y;obj.width=s.newW??obj.width;obj.height=s.newH??obj.height;obj.rotation=s.newR??obj.rotation;try{await saveRoomElement(obj)}catch(e){alert(e.message)}}}
function saveDevicePlacement(compartmentId,d){return api('/api/vehicles/compartments/'+compartmentId+'/device/'+d.id+'/placement',{method:'PUT',body:JSON.stringify({x:d.placementX??5,y:d.placementY??8,width:d.placementWidth??24,height:d.placementHeight??16,rotation:d.placementRotation??0,layer:d.placementLayer??10,groupId:d.placementGroupId||'',elementId:d.compartmentElementId||null,clearElement:!d.compartmentElementId})})}
function saveRoomElement(e){return api('/api/vehicles/elements/'+e.id,{method:'PUT',body:JSON.stringify({type:e.type,name:e.name,x:e.x,y:e.y,width:e.width,height:e.height,rotation:e.rotation,layer:e.layer})})}
async function addRoomElement(type){const labels={SHELF:'Regalboden',DRAWER:'Schublade',PULL_OUT:'Auszug',HOLDER:'Halterung',DIVIDER:'Trennwand',BOX:'Gerätekasten',FREE_SPACE:'Freie Ablage'},name=prompt('Bezeichnung:',labels[type]||'Element');if(name===null)return;const vertical=type==='DIVIDER';try{await api('/api/vehicles/compartments/'+window.roomCompartmentId+'/elements',{method:'POST',body:JSON.stringify({type,name,x:vertical?48:8,y:vertical?8:45,width:vertical?4:84,height:vertical?84:12,rotation:0,layer:2})});await reloadRoomData(window.roomCompartmentId)}catch(e){alert(e.message)}}
function showMoreRoomElements(){modalTitle.textContent='Element auswählen';modalBody.innerHTML='<div class="select-tiles"><button class="select-tile" onclick="addRoomElementFromPicker(\'HOLDER\')">Halterung</button><button class="select-tile" onclick="addRoomElementFromPicker(\'DIVIDER\')">Trennwand</button><button class="select-tile" onclick="addRoomElementFromPicker(\'BOX\')">Gerätekasten</button><button class="select-tile" onclick="addRoomElementFromPicker(\'FREE_SPACE\')">Freie Ablage</button></div>';document.querySelector('.modal-card')?.classList.add('vehicle-detail-modal')}
async function addRoomElementFromPicker(type){await addRoomElement(type)}
async function deleteSelectedRoomElement(){if(!window.roomSelectedElement){alert('Bitte zuerst ein Element auswählen.');return}if(!confirm('Element löschen? Zugeordnete Geräte bleiben im Geräteraum.'))return;try{await api('/api/vehicles/elements/'+window.roomSelectedElement,{method:'DELETE'});window.roomSelectedElement=null;await reloadRoomData(window.roomCompartmentId)}catch(e){alert(e.message)}}
async function groupSelectedDevices(){const ids=[...window.roomSelectedDevices];if(ids.length<2){alert('Bitte mindestens zwei Geräte auswählen.');return}const c=currentCompartment(window.roomCompartmentId),group='grp-'+Date.now();try{await Promise.all(ids.map(id=>{const d=c.devices.find(x=>x.id===id);d.placementGroupId=group;return saveDevicePlacement(c.id,d)}));window.roomSelectedDevices.clear();await reloadRoomData(c.id)}catch(e){alert(e.message)}}
async function ungroupSelectedDevices(){const ids=[...window.roomSelectedDevices],c=currentCompartment(window.roomCompartmentId);if(!ids.length){alert('Bitte Geräte auswählen.');return}try{await Promise.all(ids.map(id=>{const d=c.devices.find(x=>x.id===id);d.placementGroupId=null;return saveDevicePlacement(c.id,d)}));window.roomSelectedDevices.clear();await reloadRoomData(c.id)}catch(e){alert(e.message)}}
async function assignSelectedToElement(){const ids=[...window.roomSelectedDevices],c=currentCompartment(window.roomCompartmentId),elementId=roomElementAssignment.value?Number(roomElementAssignment.value):null;if(!ids.length){alert('Bitte Geräte auswählen.');return}try{await Promise.all(ids.map(id=>{const d=c.devices.find(x=>x.id===id);d.compartmentElementId=elementId;return saveDevicePlacement(c.id,d)}));await reloadRoomData(c.id)}catch(e){alert(e.message)}}
async function changeSelectedLayer(direction){const ids=[...window.roomSelectedDevices],c=currentCompartment(window.roomCompartmentId);if(!ids.length){alert('Bitte Geräte auswählen.');return}try{await Promise.all(ids.map(id=>{const d=c.devices.find(x=>x.id===id);d.placementLayer=Math.max(1,(d.placementLayer||10)+direction);return saveDevicePlacement(c.id,d)}));await reloadRoomData(c.id)}catch(e){alert(e.message)}}
async function reloadRoomData(compartmentId){window.vehicleData=await api('/api/vehicles');window.vehicleDevices=await api('/api/devices');window.roomCompartmentId=compartmentId;renderRoomDetail()}
async function confirmRoomSaved(){try{await reloadRoomData(window.roomCompartmentId);alert('Geräteraum und Beladung wurden gespeichert.')}catch(e){alert(e.message)}}

const closeModalV2Base=closeModal;closeModal=function(){document.querySelector('.modal-card')?.classList.remove('vehicle-detail-modal');window.roomPointer=null;window.removeEventListener('pointermove',moveRoomPointer);closeModalV2Base()};
loadDeviceAlerts=async function(){if(!document.getElementById('dashboardMessages'))return;try{const alerts=await api('/api/device-planning/alerts');if(!alerts.length)return;dashboardMessages.insertAdjacentHTML('afterbegin',alerts.map(a=>'<div class="notice-item unread device-defective" role="button" tabindex="0" onclick="openDevice('+a.deviceId+')"><div class="notice-title"><strong>'+(a.status==='IN_REPAIR'?'🔧 Gerät in Reparatur: ':'🚨 Gerät defekt: ')+esc(a.deviceName)+'</strong><span class="unread-label">Feuerwehrrelevant</span></div><div>Standort: '+esc(a.location)+(a.note?' · '+esc(a.note):'')+'</div><small>Bleibt bis zur Meldung „Einsatzbereit“ sichtbar.</small></div>').join(''))}catch(e){}}
loadDevices=async function(){const host=document.getElementById('deviceRows');if(!host)return;try{const list=await api('/api/devices');const categories=[...new Set(list.map(d=>d.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de')),vehicles=[...new Set(list.map(d=>d.vehicleName).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));const category=document.getElementById('deviceCategoryFilter'),vehicle=document.getElementById('deviceVehicleFilter');if(category){const value=category.value;category.innerHTML='<option value="">Alle Kategorien</option>'+categories.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');category.value=categories.includes(value)?value:''}if(vehicle){const value=vehicle.value;vehicle.innerHTML='<option value="">Alle Fahrzeuge</option>'+vehicles.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');vehicle.value=vehicles.includes(value)?value:''}const q=(document.getElementById('deviceSearch')?.value||'').toLocaleLowerCase('de').trim(),status=document.getElementById('deviceStatusFilter')?.value||'',required=document.getElementById('deviceInspectionFilter')?.checked||false,filtered=list.filter(d=>(!q||[d.name,d.inventoryNumber,d.barcode,d.serialNumber,d.category,d.location,d.vehicleName,d.compartmentName].some(v=>String(v||'').toLocaleLowerCase('de').includes(q)))&&(!category?.value||d.category===category.value)&&(!vehicle?.value||d.vehicleName===vehicle.value)&&(!status||(d.operationalStatus||'OK')===status)&&(!required||d.inspectionRequired));const priority=d=>({DEFECTIVE:0,IN_REPAIR:1,NOT_INSPECTABLE:2,OK:3})[d.operationalStatus||'OK']??3;filtered.sort((a,b)=>priority(a)-priority(b)||a.name.localeCompare(b.name,'de'));const count=document.getElementById('deviceFilterCount');if(count)count.textContent=filtered.length+' von '+list.length+' Geräten';host.innerHTML=filtered.map(d=>'<tr class="'+(d.operationalStatus==='DEFECTIVE'?'device-defective':'')+'" onclick="openDevice('+d.id+')" style="cursor:pointer"><td><strong>'+esc(d.name)+'</strong><br><small class="sub">'+esc([d.manufacturer,d.model].filter(Boolean).join(' '))+'</small></td><td>'+esc(d.inventoryNumber||'–')+'</td><td>'+esc(d.category||'–')+'</td><td>'+esc(d.vehicleName||'–')+'</td><td>'+esc(d.compartmentName||d.location||'–')+'</td><td>'+(d.operationalStatus==='DEFECTIVE'?'<span class="badge off">Defekt</span>':d.operationalStatus==='IN_REPAIR'?'<span class="badge" style="background:#fff0d6;color:#8a5700">In Reparatur</span>':d.operationalStatus==='NOT_INSPECTABLE'?'<span class="badge">Nicht prüfbar</span>':'<span class="badge ok">Einsatzbereit</span>')+(d.inspectionRequired?' <span class="badge">Prüfpflichtig</span>':'')+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">Keine passenden Geräte gefunden.</td></tr>'}catch(e){host.innerHTML='<tr><td colspan="6" class="empty">'+esc(e.message)+'</td></tr>'}};
function stopDeviceScanner(){if(deviceScannerTimer){clearTimeout(deviceScannerTimer);deviceScannerTimer=null}if(deviceScannerStream){deviceScannerStream.getTracks().forEach(t=>t.stop());deviceScannerStream=null}deviceScannerDetector=null}



async function deleteDeviceLocation(id){if(!confirm('Standort entfernen? Geräte an diesem Standort müssen zuvor umgeordnet werden.'))return;try{await api('/api/device-planning/locations/'+id,{method:'DELETE'});await loadDeviceLocations()}catch(e){alert(e.message)}}

function editTrainingDocument(id){const d=(window.trainingDocuments||[]).find(x=>x.id===id);if(!d)return;modalTitle.textContent='Unterlage bearbeiten';modalBody.innerHTML='<div class="field"><label>Titel *</label><input id="docEditTitle" value="'+esc(d.title)+'"></div><div class="field"><label>Beschreibung</label><textarea id="docEditDescription">'+esc(d.description||'')+'</textarea></div><button class="btn primary" onclick="saveTrainingDocument('+id+')">Änderungen speichern</button>';modal.classList.remove('hidden')}
async function saveTrainingDocument(id){try{await api('/api/training/'+id,{method:'PUT',body:JSON.stringify({title:docEditTitle.value,description:docEditDescription.value})});closeModal();await trainingDocumentsPage()}catch(e){alert(e.message)}}

async function deleteVehicle(id){if(!confirm('Fahrzeug archivieren? Fahrzeuge mit zugeordneten Geräten können nicht archiviert werden.'))return;try{await api('/api/vehicles/'+id,{method:'DELETE'});await vehiclesPage()}catch(e){alert(e.message)}}
async function deleteCompartment(id){if(!confirm('Geräteraum löschen? Nur leere Geräteräume können gelöscht werden.'))return;try{await api('/api/vehicles/compartments/'+id,{method:'DELETE'});closeModal();await refreshVehicles(window.selectedVehicleId)}catch(e){alert(e.message)}}

async function deleteDevice(id){if(!confirm('Gerät archivieren? Prüfungen und Defekthistorie bleiben gespeichert.'))return;try{await api('/api/devices/'+id,{method:'DELETE'});closeModal();if(document.getElementById('deviceRows'))await loadDevices();if(document.getElementById('vehicleHost'))await refreshVehicles(window.selectedVehicleId)}catch(e){alert(e.message)}}


function openDeviceImport(){
 window.deviceImportPreviewFile=null;window.deviceImportPreview=null;
 modalTitle.textContent='Geräte aus Excel importieren';
 modalBody.innerHTML='<p>Vorlage herunterladen, Geräte eintragen und die Excel-Datei (.xlsx) auswählen. Bestehende Geräte werden anhand von Inventarnummer, Barcode oder Seriennummer erkannt und übersprungen.</p><div class="quick"><button class="btn secondary" onclick="downloadDeviceImportTemplate()">⬇ Excel-Vorlage</button></div><div class="field"><label>Excel-Datei auswählen</label><input id="deviceImportFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" onchange="window.deviceImportPreview=null;document.getElementById(\'deviceImportResult\').innerHTML=\'\';document.getElementById(\'deviceImportCommit\').disabled=true"></div><button class="btn secondary" onclick="previewDeviceImport()">Vorschau prüfen</button><div id="deviceImportResult" aria-live="polite"></div><button class="btn primary" id="deviceImportCommit" disabled onclick="commitDeviceImport()">Neue Geräte importieren</button>';
 modal.classList.remove('hidden');
}
async function deviceImportRequest(path,file){const form=new FormData();form.append('file',file);const r=await fetch('/api/devices/import/'+path,{method:'POST',headers:{Authorization:'Bearer '+token},body:form});if(!r.ok){let message='Import fehlgeschlagen';try{const j=await r.json();message=j.detail||j.message||message}catch{}throw Error(message)}return r.json()}
async function downloadDeviceImportTemplate(){try{const r=await fetch('/api/devices/import/template',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Vorlage konnte nicht geladen werden.');const url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download='FFH-Geraeteimport-Vorlage.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}catch(e){alert(e.message)}}
async function previewDeviceImport(){const file=document.getElementById('deviceImportFile')?.files?.[0],target=document.getElementById('deviceImportResult');if(!file){target.innerHTML='<div class="message error">Bitte zuerst eine .xlsx-Datei wählen.</div>';return}deviceImportCommit.disabled=true;target.innerHTML='<p class="sub">Datei wird geprüft …</p>';try{const data=await deviceImportRequest('preview',file);window.deviceImportPreviewFile=file;window.deviceImportPreview=data;target.innerHTML='<p><strong>'+data.ready+' neu · '+data.skipped+' bereits vorhanden · '+data.errors+' Fehler</strong></p><div class="table-wrap" style="max-height:340px;overflow:auto"><table class="table"><thead><tr><th>Zeile</th><th>Gerät</th><th>Inventar</th><th>Fahrzeug / Fach</th><th>Ergebnis</th></tr></thead><tbody>'+data.rows.map(x=>'<tr><td>'+x.row+'</td><td>'+esc(x.name||'–')+'</td><td>'+esc(x.inventoryNumber||'–')+'</td><td>'+esc([x.vehicle,x.compartment].filter(Boolean).join(' / ')||'–')+'</td><td><strong>'+esc(x.status==='NEU'?'Neu':x.status==='VORHANDEN'?'Vorhanden':'Fehler')+'</strong><br><small>'+esc(x.message)+'</small></td></tr>').join('')+'</tbody></table></div>'+(data.errors?'<p class="message error">Fehler bitte in Excel korrigieren und erneut prüfen. Es wurde nichts importiert.</p>':'');deviceImportCommit.disabled=!!data.errors||!data.ready}catch(e){window.deviceImportPreview=null;target.innerHTML='<div class="message error">'+esc(e.message)+'</div>'}}
async function commitDeviceImport(){const file=document.getElementById('deviceImportFile')?.files?.[0];if(!file||file!==window.deviceImportPreviewFile||!window.deviceImportPreview||window.deviceImportPreview.errors)return;deviceImportCommit.disabled=true;try{const x=await deviceImportRequest('commit',file);closeModal();await loadDevices();const msg=document.getElementById('deviceMsg');if(msg)msg.innerHTML='<div class="message success">'+x.imported+' Geräte importiert, '+x.skipped+' vorhandene übersprungen.</div>'}catch(e){const target=document.getElementById('deviceImportResult');if(target)target.insertAdjacentHTML('afterbegin','<div class="message error">'+esc(e.message)+'</div>');deviceImportCommit.disabled=false}}

function resetDeviceFilters(){['deviceSearch','deviceCategoryFilter','deviceVehicleFilter','deviceStatusFilter'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='' });const required=document.getElementById('deviceInspectionFilter');if(required)required.checked=false;loadDevices()}
</script></body></html>
