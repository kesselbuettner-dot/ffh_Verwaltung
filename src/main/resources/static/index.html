<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FFH Verwaltung</title>
<style>
:root{--bg:#f3f5f7;--panel:#fff;--ink:#18212b;--muted:#687582;--line:#dfe4e8;--accent:#b51f2b;--accent2:#8d1621;--nav:#18212b;--nav2:#24313e;--ok:#19713b;--warn:#a46600}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 12px 40px #0002}.logo{font-size:34px;font-weight:800}.sub{color:var(--muted)}
.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--nav);color:#fff}.btn:hover{background:#0e151c}.btn.primary{background:var(--accent)}.btn.secondary{background:#eef1f4;color:var(--ink)}.btn.danger{background:#a51f2b}.btn.small{padding:7px 10px;font-size:13px}
.layout{display:flex;min-height:100vh}.sidebar{width:280px;background:var(--nav);color:#fff;flex:none;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:8px 12px 20px;border-bottom:1px solid #ffffff1a;margin-bottom:12px}.brand strong{font-size:20px}.brand small{display:block;color:#aeb8c1;margin-top:3px}.nav-section{margin:16px 8px 6px;color:#8f9ca8;font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.08em}.nav-item{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;color:#dce3e8;text-align:left;padding:10px 12px;border-radius:9px;margin:2px 0}.nav-item:hover,.nav-item.active{background:var(--nav2);color:#fff}.nav-child{padding-left:42px;font-size:14px}.main{flex:1;min-width:0}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:5}.topbar .user{color:var(--muted);font-size:14px}.content{padding:26px;max-width:1500px;margin:auto}.title-row{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.title-row h1{margin:0;font-size:28px}.cards{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:29px;font-weight:800;margin-top:5px}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.panel h3{margin:0 0 14px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:12px;color:var(--muted);text-transform:uppercase}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf1f4;font-size:12px;font-weight:700}.badge.ok{background:#e6f5eb;color:var(--ok)}.badge.off{background:#f4e9ea;color:#a51f2b}.balance.pos{color:var(--accent);font-weight:800}.balance.zero{color:var(--ok);font-weight:800}.balance.neg{color:#9a6200;font-weight:800}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:15px}.toolbar input{max-width:360px;padding:10px;border:1px solid var(--line);border-radius:10px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 16px}.form-grid .full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px;z-index:20}.modal-card{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.message{padding:10px;border-radius:9px;margin:10px 0}.error{background:#fde9eb;color:#8e1c26}.success{background:#e7f6ec;color:#176b39}.empty{color:var(--muted);padding:18px;text-align:center}
@media(max-width:1000px){.sidebar{width:230px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:700px){.sidebar{position:fixed;z-index:10;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.content{padding:16px}.topbar{padding:0 16px}.form-grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.title-row{align-items:flex-start}.title-row h1{font-size:23px}}

.big{min-height:48px}.quick{display:flex;gap:12px;flex-wrap:wrap}.pos-layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;align-items:start}.pos-products,.cart{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.member-bar{display:flex;gap:12px;align-items:center;margin-bottom:14px}.member-selected{font-size:20px;font-weight:800;flex:1;padding:14px;border:2px solid var(--line);border-radius:12px;background:#f8fafb}.balance-pill{padding:13px 16px;background:#eef7f1;border-radius:12px;white-space:nowrap}.category-tabs{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.cat{border:0;border-radius:999px;background:#eef1f4;padding:12px 18px;white-space:nowrap;font-weight:800}.cat.active{background:var(--nav);color:#fff}.drink-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.drink-tile{position:relative;min-height:145px;border:1px solid var(--line);border-radius:15px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:14px;box-shadow:0 2px 5px #0000000a}.drink-tile:active{transform:scale(.97)}.drink-icon{font-size:38px}.drink-price{font-size:20px;font-weight:900}.tile-count{position:absolute;right:8px;top:8px;background:var(--accent);color:#fff;border-radius:999px;padding:5px 9px;font-weight:900}.cart{position:sticky;top:84px}.cart-head{display:flex;justify-content:space-between;align-items:center}.cart-head h2{margin:0}.cart-items{min-height:180px}.cart-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:13px 0}.cart-row small{display:block;color:var(--muted);margin-top:3px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:42px;height:42px;border:0;border-radius:10px;background:#eef1f4;font-size:25px;font-weight:800}.cart-total{display:flex;justify-content:space-between;font-size:23px;padding:18px 0;border-top:2px solid var(--ink);margin-top:10px}.checkout{width:100%;min-height:64px;font-size:21px;font-weight:900}.checkout:disabled{opacity:.45;cursor:not-allowed}.center{text-align:center;padding-top:10px}.history-panel{margin-top:18px}.history-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.history-toolbar input{padding:11px;border:1px solid var(--line);border-radius:10px}.order-history{display:grid;gap:8px}.order-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.order-main{display:flex;gap:12px;align-items:center;justify-content:space-between}.order-main .meta{min-width:0}.order-items{color:var(--muted);font-size:13px;margin-top:5px}.order-card.cancelled{background:#faf1f2;border-color:#e7c7ca}.status-cancelled{background:#f4dfe1;color:#8e1c26}.status-completed{background:#e6f5eb;color:var(--ok)}.history-date{font-weight:900}.history-total{font-size:18px;font-weight:900;white-space:nowrap}.storno-btn{min-height:44px}.member-choices{display:grid;gap:8px}.member-choice{min-height:58px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700}.member-choice:active{background:#eef1f4}
@media(max-width:1050px){.pos-layout{grid-template-columns:1fr}.cart{position:static}.drink-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
@media(max-width:700px){.member-bar{align-items:stretch;flex-direction:column}.member-selected{font-size:18px}.drink-grid{grid-template-columns:repeat(2,1fr)}.drink-tile{min-height:135px}.cart-row{grid-template-columns:1fr auto}.cart-row>strong:last-child{grid-column:2}.pos-products,.cart{padding:12px}}
</style>
</head>
<body>
<div id="loginView" class="login"><div class="login-card"><div class="logo">🚒 FFH Verwaltung</div><p class="sub">Vereins- und Feuerwehrverwaltung</p><div class="field"><label>Benutzername</label><input id="loginUser" autocomplete="username"></div><div class="field"><label>Passwort</label><input id="loginPass" type="password" autocomplete="current-password"></div><button class="btn primary big" onclick="login()">Anmelden</button><div id="loginMsg"></div></div></div>
<div id="appView" class="layout hidden"><aside id="sidebar" class="sidebar"><div class="brand"><strong>🚒 FFH Verwaltung</strong><small>Vereins- & Feuerwehrportal</small></div><div class="nav-section">Übersicht</div><button class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">🏠 <span>Dashboard</span></button><div class="nav-section">Verein</div><button class="nav-item" data-page="members" onclick="navigate('members')">👥 <span>Mitglieder</span></button><div class="nav-section">Verkauf</div><button class="nav-item" data-page="theke" onclick="navigate('theke')">🍺 <span>Kasse / Theke</span></button><button class="nav-item nav-child" onclick="module('Getränke')">🥤 Getränke verwalten</button><button class="nav-item nav-child" onclick="module('Essen')">🍴 Essen</button><button class="nav-item nav-child" onclick="module('Lager')">📦 Lager</button><div class="nav-section">Weitere Bereiche</div><button class="nav-item" onclick="module('Veranstaltungen')">📅 Veranstaltungen</button><button class="nav-item" onclick="module('Feuerwehr')">🚒 Feuerwehr</button><button class="nav-item" onclick="module('Schulung / Dienst')">🎓 Schulung / Dienst</button><button class="nav-item" onclick="module('Finanzen')">💶 Finanzen</button><button class="nav-item" onclick="module('Dokumente')">📄 Dokumente</button><button class="nav-item" onclick="module('Kalender')">📆 Kalender</button><button class="nav-item" onclick="module('Spenden')">🤝 Spenden</button><div class="nav-section">System</div><button class="nav-item" onclick="module('Administration')">⚙️ Administration</button></aside><main class="main"><header class="topbar"><button class="btn secondary" onclick="toggleMenu()">☰</button><div class="user">Angemeldet als <strong id="currentUser"></strong> · <span id="currentRole"></span> <button class="btn small secondary" onclick="logout()">Abmelden</button></div></header><section id="content" class="content"></section></main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button class="btn secondary small" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
let token=localStorage.getItem('token')||null, role=localStorage.getItem('role')||null, username=localStorage.getItem('username')||'', memberId=localStorage.getItem('memberId')||null, memberName=localStorage.getItem('memberName')||'', members=[], drinks=[], cart=[];
const roles=['ADMIN','VORSTAND','KASSENWART','FEUERWEHRWART','THEKE','MEMBER'];
const roleLabels={ADMIN:'Administrator',VORSTAND:'Vorstand',KASSENWART:'Kassenwart',FEUERWEHRWART:'Feuerwehrwart',THEKE:'Theke',MEMBER:'Mitglied'};
function headers(){return {'Authorization':'Bearer '+token,'Content-Type':'application/json'}}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...headers()};const r=await fetch(url,opt);if(r.status===401){logout();throw Error('Nicht angemeldet');}if(!r.ok){let t='Fehler';try{const j=await r.json();t=j.message||j.error||t}catch{}throw Error(t)}return r.status===204?null:r.json()}
async function login(){const u=loginUser.value.trim(),p=loginPass.value;loginMsg.innerHTML='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});if(!r.ok)throw Error('Ungültige Zugangsdaten');const x=await r.json();token=x.token;role=x.role;username=x.username;memberId=x.memberId;memberName=x.memberName||'';localStorage.setItem('token',token);localStorage.setItem('role',role);localStorage.setItem('username',username);if(memberId)localStorage.setItem('memberId',memberId);else localStorage.removeItem('memberId');localStorage.setItem('memberName',memberName);showApp()}catch(e){loginMsg.innerHTML='<div class="message error">'+esc(e.message)+'</div>'}}
function showApp(){loginView.classList.add('hidden');appView.classList.remove('hidden');currentUser.textContent=username;currentRole.textContent=roleLabels[role]||role;navigate(role==='THEKE'?'theke':'dashboard')}
function logout(){localStorage.clear();location.reload()} function toggleMenu(){sidebar.classList.toggle('open')} function setActive(page){document.querySelectorAll('.nav-item[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}
function navigate(page){setActive(page);sidebar.classList.remove('open');if(page==='dashboard')dashboard();if(page==='members')membersPage();if(page==='theke')thekePage()}
function module(name){content.innerHTML='<div class="title-row"><h1>'+esc(name)+'</h1></div><div class="panel"><h3>Modul vorbereitet</h3><p>Die Navigation steht. Dieses Modul wird in einer nächsten Ausbaustufe fachlich verbunden.</p></div>'}
function money(v){return Number(v||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'} function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function dashboard(){content.innerHTML='<div class="title-row"><h1>Dashboard</h1><span class="sub">Aktuelle Übersicht</span></div><div class="cards"><div class="stat"><div class="label">Mitglieder</div><div class="value" id="sMembers">–</div></div><div class="stat"><div class="label">Aktive Mitglieder</div><div class="value" id="sActive">–</div></div><div class="stat"><div class="label">Kontostände gesamt</div><div class="value" id="sBalance">–</div></div><div class="stat"><div class="label">Getränke</div><div class="value" id="sDrinks">–</div></div></div><div class="grid2"><div class="panel"><h3>Schnellzugriff</h3><div class="quick"><button class="btn primary big" onclick="navigate('theke')">🍺 Kasse öffnen</button><button class="btn secondary big" onclick="navigate('members')">👥 Mitglieder</button></div></div><div class="panel"><h3>Angemeldet</h3><p><strong>'+esc(username)+'</strong></p><p class="sub">'+esc(roleLabels[role]||role)+(memberName?' · '+esc(memberName):'')+'</p></div></div>';try{members=await api('/api/members');sMembers.textContent=members.length;sActive.textContent=members.filter(m=>m.active).length;sBalance.textContent=money(members.reduce((a,m)=>a+Number(m.balance||0),0));drinks=await api('/api/drinks');sDrinks.textContent=drinks.filter(d=>d.active).length}catch{}}
async function membersPage(){if(!['ADMIN','VORSTAND','KASSENWART','THEKE'].includes(role)){content.innerHTML='<div class="panel"><h2>Keine Berechtigung</h2></div>';return}content.innerHTML='<div class="title-row"><h1>Mitglieder</h1></div><div class="panel"><div class="toolbar"><input id="memberSearch" placeholder="🔎 Name oder E-Mail suchen…" oninput="renderMembers()"><select id="memberFilter" onchange="renderMembers()"><option value="all">Alle Status</option><option value="active">Aktiv</option><option value="inactive">Inaktiv</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Mitglied</th><th>Login</th><th>Rolle</th><th>Status</th><th>Kontostand</th></tr></thead><tbody id="memberRows"></tbody></table></div></div>';try{members=await api('/api/members');renderMembers()}catch{memberRows.innerHTML='<tr><td colspan="5" class="empty">Mitglieder konnten nicht geladen werden.</td></tr>'}}
function renderMembers(){const q=(memberSearch?.value||'').toLowerCase(),f=memberFilter?.value||'all';const list=members.filter(m=>(!q||[m.name,m.email,m.phone].some(v=>(v||'').toLowerCase().includes(q)))&&(f==='all'||(f==='active'?m.active:!m.active)));memberRows.innerHTML=list.map(m=>'<tr><td><strong>'+esc(m.name)+'</strong><br><span class="sub">'+esc(m.email||'')+'</span></td><td>'+ (m.loginEnabled?'<span class="badge ok">● aktiv</span>':'<span class="badge">– kein Login</span>')+'</td><td>'+esc(m.role?roleLabels[m.role]||m.role:'–')+'</td><td><span class="badge '+(m.active?'ok':'off')+'">'+(m.active?'Aktiv':'Inaktiv')+'</span></td><td class="balance">'+money(m.balance)+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">Keine Mitglieder gefunden.</td></tr>'}
async function thekePage(){if(!['ADMIN','THEKE','MEMBER'].includes(role)){content.innerHTML='<div class="panel"><h2>Keine Berechtigung</h2><p>Die Kasse ist für diese Rolle nicht freigeschaltet.</p></div>';return}const canHistory=role==='ADMIN'||role==='THEKE';content.innerHTML='<div class="title-row"><div><h1>🍺 Kasse / Theke</h1><span class="sub">Touch-Kasse · zentrale Order-API</span></div><button class="btn secondary" onclick="loadTheke()">↻ Aktualisieren</button></div><div id="thekeError"></div><div class="pos-layout"><div class="pos-products"><div class="member-bar"><div class="member-selected" id="selectedMember">'+(role==='MEMBER'?(esc(memberName)||'Mein Konto'):'Kein Mitglied ausgewählt')+'</div>'+(role!=='MEMBER'?'<button class="btn primary big" onclick="chooseMember()">👤 Mitglied auswählen</button>':'<div class="balance-pill">Guthaben: <strong id="memberBalance">–</strong></div>')+'</div><div class="category-tabs" id="catTabs"></div><div class="drink-grid" id="drinkGrid"></div></div><aside class="cart"><div class="cart-head"><h2>Warenkorb</h2><button class="btn small secondary" onclick="clearCart()">Leeren</button></div><div id="cartItems" class="cart-items"></div><div class="cart-total"><span>Summe</span><strong id="cartTotal">0,00 €</strong></div><button id="orderBtn" class="btn primary checkout" onclick="submitOrder()">✓ Bestellung buchen</button><div id="cartHint" class="sub center">Mitglied auswählen und Getränke antippen.</div></aside></div>'+(canHistory?'<div class="panel history-panel"><div class="title-row" style="margin-bottom:12px"><div><h2 style="margin:0">📋 Bestellhistorie</h2><span class="sub">Bestellungen des gewählten Tages · Storno bucht das Guthaben exakt zurück.</span></div></div><div class="history-toolbar"><input id="historyDate" type="date" onchange="loadOrderHistory()"><button class="btn secondary" onclick="setHistoryToday()">Heute</button><button class="btn secondary" onclick="shiftHistoryDate(-1)">← Vorheriger Tag</button><button class="btn secondary" onclick="shiftHistoryDate(1)">Nächster Tag →</button></div><div id="orderHistory" class="order-history"><div class="empty">Bestellungen werden geladen …</div></div></div>':'');await loadTheke();if(canHistory)setHistoryToday()}
async function loadTheke(){try{drinks=await api('/api/theke/drinks');renderCategories();renderDrinks();if(role==='MEMBER'){const m=await api('/api/member/me');selectedMember.textContent=m.name;memberBalance.textContent=money(m.balance);window.selectedMemberId=m.id;window.selectedMemberBalance=Number(m.balance)}else if(window.selectedMemberId)await refreshSelectedMember();renderCart()}catch(e){thekeError.innerHTML='<div class="message error">'+esc(e.message)+'</div>'}}
function categories(){return ['Alle',...new Set(drinks.map(d=>d.category).filter(Boolean))]}
let activeCategory='Alle';function renderCategories(){catTabs.innerHTML=categories().map(c=>'<button class="cat '+(c===activeCategory?'active':'')+'" onclick="activeCategory='+JSON.stringify(c)+';renderCategories();renderDrinks()">'+esc(c)+'</button>').join('')}
function renderDrinks(){const list=activeCategory==='Alle'?drinks:drinks.filter(d=>d.category===activeCategory);drinkGrid.innerHTML=list.map(d=>{const inCart=cart.find(x=>x.drinkId===d.id);return '<button class="drink-tile" onclick="addToCart('+d.id+')"><span class="drink-icon">'+iconFor(d.category)+'</span><strong>'+esc(d.name)+'</strong><span class="drink-price">'+money(d.price)+'</span>'+(inCart?'<span class="tile-count">'+inCart.quantity+'×</span>':'')+'</button>'}).join('')||'<div class="empty">Keine aktiven Getränke vorhanden.</div>'}
function iconFor(c){c=(c||'').toLowerCase();if(c.includes('bier'))return'🍺';if(c.includes('wein'))return'🍷';if(c.includes('spirit'))return'🥃';if(c.includes('wasser'))return'💧';if(c.includes('cola')||c.includes('limo'))return'🥤';return'🍹'}
function addToCart(id){const d=drinks.find(x=>x.id===id);if(!d)return;let x=cart.find(x=>x.drinkId===id);if(x)x.quantity++;else cart.push({drinkId:id,name:d.name,price:Number(d.price),quantity:1});renderCart();renderDrinks()}
function changeQty(id,delta){const x=cart.find(x=>x.drinkId===id);if(!x)return;x.quantity+=delta;if(x.quantity<=0)cart=cart.filter(y=>y!==x);renderCart();renderDrinks()}
function clearCart(){cart=[];renderCart();renderDrinks()}
function renderCart(){cartItems.innerHTML=cart.map(x=>'<div class="cart-row"><div><strong>'+esc(x.name)+'</strong><small>'+money(x.price)+' / Stück</small></div><div class="qty"><button onclick="changeQty('+x.drinkId+',-1)">−</button><strong>'+x.quantity+'</strong><button onclick="changeQty('+x.drinkId+',1)">+</button></div><strong>'+money(x.price*x.quantity)+'</strong></div>').join('')||'<div class="empty">Noch keine Getränke im Warenkorb.</div>';const total=cart.reduce((a,x)=>a+x.price*x.quantity,0);cartTotal.textContent=money(total);orderBtn.disabled=!cart.length||!window.selectedMemberId;cartHint.textContent=!window.selectedMemberId?'Mitglied auswählen und Getränke antippen.':('Guthaben: '+money(window.selectedMemberBalance||0));}
async function chooseMember(){const all=await api('/api/theke/members?q=');document.getElementById('modalTitle').textContent='Mitglied auswählen';document.getElementById('modalBody').innerHTML='<div class="field"><label>Suche</label><input id="memberLookup" autofocus placeholder="Name oder E-Mail" oninput="filterMemberChoices()"></div><div id="memberChoices" class="member-choices"></div>';window.memberChoices=all;renderMemberChoices();document.getElementById('modal').classList.remove('hidden')}
function filterMemberChoices(){const q=memberLookup.value.toLowerCase();const base=window.allMemberChoices||[];document.getElementById('memberChoices').innerHTML=base.filter(m=>m.name.toLowerCase().includes(q)||(m.email||'').toLowerCase().includes(q)).map(m=>'<button class="member-choice" onclick="selectMember('+m.id+')"><span>👤 '+esc(m.name)+'</span><strong>'+money(m.balance)+'</strong></button>').join('')||'<div class="empty">Kein Mitglied gefunden.</div>'}
function renderMemberChoices(){window.allMemberChoices=window.memberChoices;filterMemberChoices()}
async function selectMember(id){window.selectedMemberId=id;await refreshSelectedMember();closeModal();renderCart()}
async function refreshSelectedMember(){const m=await api('/api/members/'+window.selectedMemberId);selectedMember.textContent=m.name;window.selectedMemberBalance=Number(m.balance);if(document.getElementById('memberBalance'))memberBalance.textContent=money(m.balance)}
async function submitOrder(){if(!cart.length||!window.selectedMemberId)return;const total=cart.reduce((a,x)=>a+x.price*x.quantity,0);if(Number(window.selectedMemberBalance)<total){thekeError.innerHTML='<div class="message error">Guthaben reicht nicht aus. Verfügbar: '+money(window.selectedMemberBalance)+'</div>';return}orderBtn.disabled=true;try{const r=await api('/api/theke/orders',{method:'POST',body:JSON.stringify({memberId:window.selectedMemberId,items:cart.map(x=>({drinkId:x.drinkId,quantity:x.quantity}))})});cart=[];await refreshSelectedMember();renderCart();renderDrinks();thekeError.innerHTML='<div class="message success">✓ Bestellung #'+r.id+' über '+money(r.total)+' wurde gebucht.</div>';if(role==='ADMIN'||role==='THEKE')loadOrderHistory()}catch(e){thekeError.innerHTML='<div class="message error">'+esc(e.message)+'</div>'}finally{orderBtn.disabled=!cart.length||!window.selectedMemberId}}
function setHistoryToday(){const el=document.getElementById('historyDate');if(!el)return;const d=new Date();el.value=d.toLocaleDateString('en-CA');loadOrderHistory()}
function shiftHistoryDate(delta){const el=document.getElementById('historyDate');if(!el||!el.value)return;const d=new Date(el.value+'T12:00:00');d.setDate(d.getDate()+delta);el.value=d.toLocaleDateString('en-CA');loadOrderHistory()}
async function loadOrderHistory(){const el=document.getElementById('orderHistory');if(!el)return;const date=historyDate.value;el.innerHTML='<div class="empty">Lade Bestellungen …</div>';try{const list=await api('/api/theke/orders?date='+encodeURIComponent(date));renderOrderHistory(list)}catch(e){el.innerHTML='<div class="message error">'+esc(e.message)+'</div>'}}
function renderOrderHistory(list){orderHistory.innerHTML=list.map(o=>{const time=new Date(o.createdAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});const items=o.items.map(i=>i.quantity+'× '+esc(i.drinkName)).join(' · ');const cancelled=o.status==='CANCELLED';return '<div class="order-card '+(cancelled?'cancelled':'')+'"><div class="order-main"><div class="meta"><strong>#'+o.id+' · '+esc(o.memberName)+'</strong><div class="sub">'+time+' · '+esc(o.createdBy)+'</div><div class="order-items">'+items+'</div>'+(cancelled?'<div class="order-items">Storniert von '+esc(o.cancelledBy||'–')+' · '+(o.cancelledAt?new Date(o.cancelledAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'–')+' · Grund: '+esc(o.cancellationReason||'–')+'</div>':'')+'</div><div style="display:flex;align-items:center;gap:10px"><div><div class="history-total">'+money(o.total)+'</div><span class="badge '+(cancelled?'status-cancelled':'status-completed')+'">'+(cancelled?'Storniert':'Gebucht')+'</span></div>'+(cancelled?'':'<button class="btn danger storno-btn" onclick="requestCancel('+o.id+','+JSON.stringify(o.memberName)+','+JSON.stringify(o.total)+')">↩ Storno</button>')+'</div></div></div>'}).join('')||'<div class="empty">Keine Bestellungen für diesen Tag.</div>'}
function requestCancel(id,name,total){document.getElementById('modalTitle').textContent='Bestellung #'+id+' stornieren';document.getElementById('modalBody').innerHTML='<div class="message error"><strong>'+esc(name)+'</strong><br>Das Guthaben wird um <strong>'+money(total)+'</strong> zurückgebucht.</div><div class="field"><label>Stornogrund *</label><textarea id="cancelReason" rows="4" maxlength="500" placeholder="z. B. Falschbuchung, Bestellung nicht ausgegeben …"></textarea></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn secondary" onclick="closeModal()">Abbrechen</button><button class="btn danger" onclick="confirmCancel('+id+')">↩ Verbindlich stornieren</button></div>';document.getElementById('modal').classList.remove('hidden')}
async function confirmCancel(id){const reason=(document.getElementById('cancelReason')?.value||'').trim();if(reason.length<3){document.getElementById('cancelReason').focus();return}const buttons=document.querySelectorAll('#modalBody button');buttons.forEach(b=>b.disabled=true);try{const r=await api('/api/theke/orders/'+id+'/cancel',{method:'POST',body:JSON.stringify({reason})});closeModal();await loadOrderHistory();if(window.selectedMemberId===r.memberId)await refreshSelectedMember();thekeError.innerHTML='<div class="message success">✓ Bestellung #'+r.id+' wurde storniert. '+money(r.total)+' wurden dem Mitglied zurückgebucht.</div>'}catch(e){document.getElementById('modalBody').insertAdjacentHTML('afterbegin','<div class="message error">'+esc(e.message)+'</div>');buttons.forEach(b=>b.disabled=false)}}
function closeModal(){modal.classList.add('hidden')}
window.addEventListener('load',()=>{if(token&&role)showApp()});
</script></body></html>
