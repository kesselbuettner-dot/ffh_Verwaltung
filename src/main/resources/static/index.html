function menuAllowed(item){return item.roles.includes('*')||item.roles.includes(role)}
function renderNavigation(){
 const host=document.getElementById('navContainer');if(!host)return;
 const hidden=new Set((appSettings?.hiddenMenuItems||[]));
 let order=appSettings?.menuOrder?.length?appSettings.menuOrder:[...menuDefinitions.map(x=>x.id)];
 const rank=new Map(order.map((id,i)=>[id,i]));
 const items=menuDefinitions.filter(menuAllowed).filter(x=>!hidden.has(x.id)).sort((a,b)=>(rank.get(a.id)??999)-(rank.get(b.id)??999));
 const groups=[];const bySection=new Map();
 items.forEach(item=>{if(!bySection.has(item.section)){const g={name:item.section,items:[]};bySection.set(item.section,g);groups.push(g)}bySection.get(item.section).items.push(item)});
 host.innerHTML=groups.map(g=>'<div class="nav-section">'+esc(g.name)+'</div>'+g.items.map(i=>'<button class="nav-item '+(i.id.includes('-')?'nav-child':'')+'" data-page="'+esc(i.id)+'" data-nav-id="'+esc(i.id)+'">'+i.icon+' <span>'+esc(i.label)+'</span></button>').join('')).join('');
 host.querySelectorAll('[data-nav-id]').forEach(button=>{button.addEventListener('click',()=>{const item=menuDefinitions.find(x=>x.id===button.dataset.navId);if(item)item.action()})});
 setActive(window.currentPage||'dashboard');
}

function adminMenuSettingsPage(){const defs=menuDefinitions.filter(x=>!x.id.startsWith('admin'));const hidden=new Set(appSettings?.hiddenMenuItems||[]);const order=appSettings?.menuOrder?.length?appSettings.menuOrder:defs.map(x=>x.id);const rank=new Map(order.map((id,i)=>[id,i]));defs.sort((a,b)=>(rank.get(a.id)??999)-(rank.get(b.id)??999));settingsContent.innerHTML='<div class="panel"><h3>☰ Menübalken</h3><p class="sub">Einträge mit den Pfeilen verschieben oder ausblenden. Die Berechtigungen der einzelnen Bereiche bleiben weiterhin aktiv.</p><div id="menuSettingsList" class="menu-list">'+defs.map((x,i)=>'<div class="menu-row '+(hidden.has(x.id)?'disabled':'')+'" data-menu-id="'+x.id+'"><span class="drag-handle">'+x.icon+'</span><div><strong>'+esc(x.label)+'</strong><small class="sub">'+esc(x.section)+'</small></div><button class="btn small secondary" onclick="moveMenuItem(\''+x.id+'\',-1)">↑</button><button class="btn small secondary" onclick="moveMenuItem(\''+x.id+'\',1)">↓</button><label style="display:flex;align-items:center;gap:6px"><input type="checkbox" '+(hidden.has(x.id)?'':'checked')+' onchange="toggleMenuItem(\''+x.id+'\',this.checked)"> sichtbar</label></div>').join('')+'</div><div class="quick" style="margin-top:15px"><button class="btn primary" onclick="saveMenuSettings()">Menü speichern</button><button class="btn secondary" onclick="adminSettingsPage(\'menu\')">Neu laden</button></div><div id="menuMsg"></div></div>'}

function moveMenuItem(id,delta){const rows=[...document.querySelectorAll('#menuSettingsList .menu-row')],i=rows.findIndex(x=>x.dataset.menuId===id),j=i+delta;if(i<0||j<0||j>=rows.length)return;const list=document.getElementById('menuSettingsList');if(delta<0)list.insertBefore(rows[i],rows[j]);else list.insertBefore(rows[j],rows[i]);}
function toggleMenuItem(id,visible){const row=document.querySelector('#menuSettingsList [data-menu-id="'+id+'"]');if(row)row.classList.toggle('disabled',!visible)}

async function topupPanel(){const host=document.getElementById('topupPanel');if(!host)return;try{const cfg=await api('/api/credit-topups/config');let html='<h2>Guthaben buchen</h2><div id="topupMsg"></div>';if(role==='MEMBER'&&memberId){const mine=await api('/api/credit-topups/mine');html+='<div class="field"><label>Mein Aufladebetrag (€)</label><input id="topupAmount" type="number" min="0.01" max="1000" step="0.01"></div><button class="btn primary" onclick="startTopup()">PayPal-Guthaben buchen</button><p class="sub">Zahlung wird erst nach Prüfung durch Admin oder Getränkewart gutgeschrieben.</p>'+mine.filter(t=>t.status==='PENDING').map(t=>'<p>'+esc(t.referenceCode)+' · '+money(t.amount)+' <button class="btn small" onclick="reportTopup('+t.id+')">Zahlung erledigt – zur Prüfung melden</button></p>').join('');}if(['ADMIN','GETRAENKEWART'].includes(role)){const pending=await api('/api/credit-topups/review');html+='<h3>Offene PayPal-Prüfungen</h3>'+pending.map(t=>'<p>'+esc(t.memberName)+' · '+money(t.amount)+' · '+esc(t.referenceCode)+' <button class="btn small" onclick="reviewTopup('+t.id+',true)">Zahlung geprüft: gutschreiben</button> <button class="btn small secondary" onclick="reviewTopup('+t.id+',false)">Ablehnen</button></p>').join('')+'<h3>Manuelle Buchung</h3><select id="topupMember"><option value="">Mitglied wählen</option></select><input id="manualAmount" type="number" min="0.01" step="0.01" placeholder="Betrag €"><select id="manualMethod"><option value="CASH">Bar</option><option value="TRANSFER">Überweisung</option><option value="PAYPAL">PayPal</option><option value="OTHER">Sonstiges</option></select><input id="manualNote" placeholder="Bemerkung"><button class="btn primary" onclick="manualTopup()">Guthaben buchen</button>';}host.innerHTML=html;if(document.getElementById('topupMember')){const ms=await api('/api/credit-topups/eligible-members');topupMember.innerHTML='<option value="">Mitglied wählen</option>'+ms.map(m=>'<option value="'+m.id+'">'+esc(m.name)+'</option>').join('');}}catch(e){host.innerHTML='<div class="message error">'+esc(e.message)+'</div>'}}
async function startTopup(){try{const t=await api('/api/credit-topups/mine',{method:'POST',body:JSON.stringify({amount:topupAmount.value})});const cfg=await api('/api/credit-topups/config');topupMsg.textContent='Anfrage '+t.referenceCode+' angelegt. Bitte Betrag '+money(t.amount)+' bei PayPal spenden und die Referenz im Verwendungszweck angeben, soweit möglich.';const paypalBase=String(cfg.paypalDonationUrl||'').replace(/\/+$/,'');const paypalAmount=Number(t.amount).toFixed(2);const paypalUrl=paypalBase+'/'+paypalAmount+'/';window.open(paypalUrl,'_blank','noopener,noreferrer');await topupPanel()}catch(e){alert(e.message)}}

async function thekePage(){if(!['ADMIN','THEKE','MEMBER','GETRAENKEWART'].includes(role)){content.innerHTML='<div class="panel"><h2>Keine Berechtigung</h2><p>Die Kasse ist für diese Rolle nicht freigeschaltet.</p></div>';return}const canHistory=role==='ADMIN'||role==='THEKE';content.innerHTML=`<div class="title-row"><div><h1>🍺 Kasse / Theke</h1><span class="sub">Touch-Kasse · zentrale Order-API</span></div><button class="btn secondary" onclick="loadTheke()">↻ Aktualisieren</button></div><div id="thekeError"></div><div class="pos-layout"><div class="pos-products"><div class="member-bar"><div class="member-selected" id="selectedMember">${role==='MEMBER'?(esc(memberName)||'Mein Konto'):'Kein Mitglied ausgewählt'}</div>${role!=='MEMBER'?'<button class="btn primary big" onclick="chooseMember()">👤 Mitglied auswählen</button>':''}<div class="balance-pill">Guthaben: <strong id="memberBalance">–</strong></div></div><div class="category-tabs" id="catTabs"></div><div class="drink-grid" id="drinkGrid"></div></div><aside class="cart"><div class="cart-head"><h2>Warenkorb</h2><button class="btn small secondary" onclick="clearCart()">Leeren</button></div><div id="cartItems" class="cart-items"></div><div class="cart-total"><span>Summe</span><strong id="cartTotal">0,00 €</strong></div><button id="orderBtn" class="btn primary checkout" onclick="submitOrder()">✓ Bestellung buchen</button><div id="cartHint" class="sub center">Mitglied auswählen und Getränke antippen.</div></aside></div><div class="panel" id="topupPanel">Guthaben wird geladen …</div>${canHistory?'<div class="panel history-panel"><div class="title-row" style="margin-bottom:12px"><div><h2 style="margin:0">📋 Bestellhistorie</h2><span class="sub">Bestellungen des gewählten Tages · Storno bucht das Guthaben exakt zurück.</span></div></div><div class="history-toolbar"><input id="historyDate" type="date" onchange="loadOrderHistory()"><button class="btn secondary" onclick="setHistoryToday()">Heute</button><button class="btn secondary" onclick="shiftHistoryDate(-1)">← Vorheriger Tag</button><button class="btn secondary" onclick="shiftHistoryDate(1)">Nächster Tag →</button></div><div id="orderHistory" class="order-history"><div class="empty">Bestellungen werden geladen …</div></div></div>':''}`;await loadTheke();await topupPanel();if(canHistory)setHistoryToday()}
async function loadTheke(){try{drinks=await api('/api/theke/drinks');renderCategories();renderDrinks();if(role==='MEMBER'){const m=await api('/api/members/me');selectedMember.textContent=m.name;memberBalance.textContent=money(m.balance);window.selectedMemberId=m.id;window.selectedMemberBalance=Number(m.balance);if(!document.getElementById('memberPaypalButton'))document.querySelector('.member-bar')?.insertAdjacentHTML('beforeend','<button id="memberPaypalButton" class="btn primary big" onclick="openMemberTopup()">PayPal-Guthaben buchen</button>')}else if(window.selectedMemberId)await refreshSelectedMember();renderCart()}catch(e){thekeError.innerHTML=`<div class="message error">${esc(e.message)}</div>`}}
function openMemberTopup(){const panel=document.getElementById('topupPanel');if(!panel)return;panel.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>document.getElementById('topupAmount')?.focus(),350)}
function categories(){return ['Alle',...new Set(drinks.map(d=>d.category).filter(Boolean))]}
function renderCategories(){catTabs.innerHTML=categories().map(c=>`<button class="cat ${c===activeCategory?'active':''}" onclick='activeCategory=${JSON.stringify(c)};renderCategories();renderDrinks()'>${esc(c)}</button>`).join('')}
function renderDrinks(){const list=activeCategory==='Alle'?drinks:drinks.filter(d=>d.category===activeCategory);drinkGrid.innerHTML=list.map(d=>{const inCart=cart.find(x=>x.drinkId===d.id);const stock=Math.max(0,Number(d.stock)||0);const soldOut=stock<=0;const reachedStock=!!inCart&&inCart.quantity>=stock;const disabled=soldOut||reachedStock;const visual=d.imageUrl?`<img class="drink-image" src="${esc(d.imageUrl)}" alt="" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="drink-icon" hidden>${iconFor(d.category)}</span>`:`<span class="drink-icon">${iconFor(d.category)}</span>`;return `<button class="drink-tile ${disabled?'sold-out':''}" ${disabled?'disabled':''} onclick="addToCart(${d.id})" title="${soldOut?'Alle – nicht mehr auf Lager':reachedStock?'Bestand ausgeschöpft':''}">${visual}<strong>${esc(d.name)}</strong>${d.sizeVolume!=null&&d.sizeUnitShortName?`<small class="drink-size">${esc(String(d.sizeVolume))} ${esc(d.sizeUnitShortName)}</small>`:''}<span class="drink-price">${money(d.price)}</span>${inCart?`<span class="tile-count">${inCart.quantity}×</span>`:''}${soldOut?`<span class="sold-out-label">Alle</span>`:reachedStock?`<span class="sold-out-label">Bestand ausgeschöpft</span>`:''}</button>`}).join('')||'<div class="empty">Keine aktiven Getränke vorhanden.</div>'}
function iconFor(c){c=(c||'').toLowerCase();if(c.includes('bier'))return'🍺';if(c.includes('wein'))return'🍷';if(c.includes('spirit'))return'🥃';if(c.includes('wasser'))return'💧';if(c.includes('cola')||c.includes('limo'))return'🥤';return'🍹'}
function addToCart(id){const d=drinks.find(x=>x.id===id);if(!d)return;const stock=Math.max(0,Number(d.stock)||0);let x=cart.find(x=>x.drinkId===id);if(stock<=0||(x&&x.quantity>=stock))return;if(x)x.quantity++;else cart.push({drinkId:id,name:d.name,sizeVolume:d.sizeVolume,sizeUnitShortName:d.sizeUnitShortName,price:Number(d.price),quantity:1});renderCart();renderDrinks()}
function changeQty(id,delta){const x=cart.find(x=>x.drinkId===id);if(!x)return;const d=drinks.find(d=>d.id===id);const stock=Math.max(0,Number(d?.stock)||0);if(delta>0&&x.quantity>=stock)return;x.quantity+=delta;if(x.quantity<=0)cart=cart.filter(y=>y!==x);renderCart();renderDrinks()}
function clearCart(){cart=[];renderCart();renderDrinks()}
function renderCart(){cartItems.innerHTML=cart.map(x=>`<div class="cart-row"><div><strong>${esc(x.name)}</strong>${x.sizeVolume!=null&&x.sizeUnitShortName?`<small>${esc(String(x.sizeVolume))} ${esc(x.sizeUnitShortName)}</small>`:''}<small>${money(x.price)} / Stück</small></div><div class="qty"><button onclick="changeQty(${x.drinkId},-1)">−</button><strong>${x.quantity}</strong><button onclick="changeQty(${x.drinkId},1)">+</button></div><strong>${money(x.price*x.quantity)}</strong></div>`).join('')||'<div class="empty">Noch keine Getränke im Warenkorb.</div>';const total=cart.reduce((a,x)=>a+x.price*x.quantity,0);cartTotal.textContent=money(total);orderBtn.disabled=!cart.length||!window.selectedMemberId;cartHint.textContent=!window.selectedMemberId?'Mitglied auswählen und Getränke antippen.':('Guthaben: '+money(window.selectedMemberBalance||0))}
async function chooseMember(){const all=await api('/api/theke/members?q=');modalTitle.textContent='Mitglied auswählen';modalBody.innerHTML='<div class="field"><label>Suche</label><input id="memberLookup" autofocus placeholder="Name oder E-Mail" oninput="filterMemberChoices()"></div><div id="memberChoices" class="member-choices"></div>';window.allMemberChoices=all;filterMemberChoices();modal.classList.remove('hidden')}
function filterMemberChoices(){const q=(memberLookup?.value||'').toLowerCase();const base=window.allMemberChoices||[];memberChoices.innerHTML=base.filter(m=>m.name.toLowerCase().includes(q)||(m.email||'').toLowerCase().includes(q)).map(m=>`<button class="member-choice" onclick="selectMember(${m.id})"><span>👤 ${esc(m.name)}</span><strong>${money(m.balance)}</strong></button>`).join('')||'<div class="empty">Kein Mitglied gefunden.</div>'}
async function selectMember(id){window.selectedMemberId=id;await refreshSelectedMember();closeModal();renderCart()}
async function refreshSelectedMember(){const m=role==='MEMBER'?await api('/api/members/me'):await api(`/api/members/${window.selectedMemberId}`);selectedMember.textContent=m.name;window.selectedMemberBalance=Number(m.balance);if(memberBalance)memberBalance.textContent=money(m.balance)}
async function submitOrder(){if(!cart.length||!window.selectedMemberId)return;const total=cart.reduce((a,x)=>a+x.price*x.quantity,0);if(Number(window.selectedMemberBalance)<total){thekeError.innerHTML=`<div class="message error">Guthaben reicht nicht aus. Verfügbar: ${money(window.selectedMemberBalance)}</div>`;return}orderBtn.disabled=true;try{const r=await api('/api/theke/orders',{method:'POST',body:JSON.stringify({memberId:window.selectedMemberId,items:cart.map(x=>({drinkId:x.drinkId,quantity:x.quantity}))})});cart=[];await refreshSelectedMember();renderCart();renderDrinks();thekeError.innerHTML=`<div class="message success">✓ Bestellung #${r.id} über ${money(r.total)} wurde gebucht.</div>`;if(role==='ADMIN'||role==='THEKE')loadOrderHistory()}catch(e){thekeError.innerHTML=`<div class="message error">${esc(e.message)}</div>`}finally{orderBtn.disabled=!cart.length||!window.selectedMemberId}}
function setHistoryToday(){if(!historyDate)return;const d=new Date();historyDate.value=d.toLocaleDateString('en-CA');loadOrderHistory()}
function shiftHistoryDate(delta){if(!historyDate?.value)return;const d=new Date(historyDate.value+'T12:00:00');d.setDate(d.getDate()+delta);historyDate.value=d.toLocaleDateString('en-CA');loadOrderHistory()}
async function loadOrderHistory(){if(!orderHistory)return;const date=historyDate.value;orderHistory.innerHTML='<div class="empty">Lade Bestellungen …</div>';try{const list=await api('/api/theke/orders?date='+encodeURIComponent(date));renderOrderHistory(list)}catch(e){orderHistory.innerHTML=`<div class="message error">${esc(e.message)}</div>`}}
function renderOrderHistory(list){orderHistory.innerHTML=list.map(o=>{const time=new Date(o.createdAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});const items=o.items.map(i=>`${i.quantity}× ${esc(i.drinkName)}`).join(' · ');const cancelled=o.status==='CANCELLED';return `<div class="order-card ${cancelled?'cancelled':''}"><div class="order-main"><div class="meta"><strong>#${o.id} · ${esc(o.memberName)}</strong><div class="sub">${time} · ${esc(o.createdBy)}</div><div class="order-items">${items}</div>${cancelled?`<div class="order-items">Storniert von ${esc(o.cancelledBy||'–')} · ${o.cancelledAt?new Date(o.cancelledAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'–'} · Grund: ${esc(o.cancellationReason||'–')}</div>`:''}</div><div style="display:flex;align-items:center;gap:10px"><div><div class="history-total">${money(o.total)}</div><span class="badge ${cancelled?'status-cancelled':'status-completed'}">${cancelled?'Storniert':'Gebucht'}</span></div>${cancelled?'':`<button class="btn danger storno-btn" onclick='requestCancel(${o.id},${JSON.stringify(o.memberName)},${JSON.stringify(o.total)})'>↩ Storno</button>`}</div></div></div>`}).join('')||'<div class="empty">Keine Bestellungen für diesen Tag.</div>'}
function requestCancel(id,name,total){modalTitle.textContent=`Bestellung #${id} stornieren`;modalBody.innerHTML=`<div class="message error"><strong>${esc(name)}</strong><br>Das Guthaben wird um <strong>${money(total)}</strong> zurückgebucht.</div><div class="field"><label>Stornogrund *</label><textarea id="cancelReason" rows="4" maxlength="500" placeholder="z. B. Falschbuchung, Bestellung nicht ausgegeben …"></textarea></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn secondary" onclick="closeModal()">Abbrechen</button><button class="btn danger" onclick="confirmCancel(${id})">↩ Verbindlich stornieren</button></div>`;modal.classList.remove('hidden')}
async function confirmCancel(id){const reason=(cancelReason?.value||'').trim();if(reason.length<3){cancelReason.focus();return}const buttons=modalBody.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);try{const r=await api(`/api/theke/orders/${id}/cancel`,{method:'POST',body:JSON.stringify({reason})});closeModal();await loadOrderHistory();if(window.selectedMemberId===r.memberId)await refreshSelectedMember();thekeError.innerHTML=`<div class="message success">✓ Bestellung #${r.id} wurde storniert. ${money(r.total)} wurden dem Mitglied zurückgebucht.</div>`}catch(e){modalBody.insertAdjacentHTML('afterbegin',`<div class="message error">${esc(e.message)}</div>`);buttons.forEach(b=>b.disabled=false)}}

async function loadArticles(){

        button.className = 'btn small primary';
        button.textContent = 'Update installieren';
        button.onclick = () => installServerUpdate(false);
        el.appendChild(button);
      }
    } else {
      el.className = 'update-status current';
      el.innerHTML = '<span class="update-icon">✓</span><div><strong>System ist aktuell</strong><small>Version ' + esc(x.currentVersion) + ' · GitHub ' + esc(x.remoteVersion) + '</small></div>';
      const button = document.createElement('button');
      button.className = 'btn small secondary';
      button.textContent = 'Erneut prüfen';
      button.onclick = () => checkForUpdate(false);
      el.appendChild(button);
    }
  } catch (e) {
    el.className = 'update-status error';
    el.innerHTML = '<span class="update-icon">⚠️</span><div><strong>Updateprüfung fehlgeschlagen</strong><small></small></div>';
    el.querySelector('small').textContent = e.message || 'GitHub konnte nicht erreicht werden';
    const button = document.createElement('button');
    button.className = 'btn small secondary';
    button.textContent = 'Erneut prüfen';
    button.onclick = () => checkForUpdate(false);
    el.appendChild(button);
  }
};
window.installServerUpdate = async function(autoInstall = false) {
  const el = document.getElementById('updateStatus');
  if (!el) return;
  if (!autoInstall && !confirm('Neues Release jetzt auf dem Server installieren? Die Anwendung wird dabei kurz neu gestartet.')) return;
  el.className = 'update-status';
  el.innerHTML = '<span class="update-icon">⏳</span><div><strong>Server-Update wird gestartet …</strong><small>Das neue GitHub-Release wird auf dem Server installiert.</small></div>';
  try {
    const response = await fetch('/api/admin/update-check/install', {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}
    });
    let data = {};
    try { data = await response.json(); } catch (_) {}
    if (!response.ok) throw new Error(data.message || data.detail || data.error || ('HTTP ' + response.status));
    el.className = 'update-status current';
    el.innerHTML = '<span class="update-icon">✓</span><div><strong>Update gestartet</strong><small>' + esc(data.message || 'Der Server wird aktualisiert.') + '</small></div>';
    setTimeout(() => window.location.reload(), 12000);
  } catch (e) {
    el.className = 'update-status error';
    el.innerHTML = '<span class="update-icon">⚠️</span><div><strong>Server-Update konnte nicht gestartet werden</strong><small></small></div>';
    el.querySelector('small').textContent = e.message || 'Update fehlgeschlagen';
    const button = document.createElement('button');
    button.className = 'btn small secondary';
    button.textContent = 'Erneut prüfen';
    button.onclick = () => checkForUpdate(false);
    el.appendChild(button);
  }
};
window.globalSearch=async function(){const q=gs?.value.trim();if(!q)return;try{const list=await api('/api/search?q='+encodeURIComponent(q));searchResults.classList.remove('hidden');searchResults.innerHTML=list.map(x=>'<div class="search-result" onclick="openSearchResult('+x.id+',\''+x.target+'\')"><div><strong>'+esc(x.type)+' · '+esc(x.title)+'</strong><small>'+esc(x.subtitle||'')+'</small></div></div>').join('')||'<div class="empty">Keine Treffer.</div>'}catch(e){searchResults.innerHTML='<div class="message error">'+esc(e.message)+'</div>'}};
window.openSearchResult=function(id,target){searchResults.classList.add('hidden');gs.value='';if(target==='members'){navigate('members');return}if(target==='articles'){inventoryPage('articles');return}if(target==='training'){trainingPage();return}};
</script>
<script>
if ("serviceWorker" in navigator) {
  let refreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });
  window.addEventListener("load", async () => {
    try {
      const registration = await navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" });
      await registration.update();
    } catch (e) {}
  });
}
let deviceScannerStream=null,deviceScannerTimer=null,deviceScannerDetector=null;
function deviceModule(name){content.innerHTML='<div class="title-row"><h1>'+esc(name)+'</h1></div><div class="panel"><h3>Modul vorbereitet</h3><p>Der Bereich ist für die Gerätewart-Funktionen vorbereitet und wird mit den jeweiligen Stammdaten verbunden.</p></div>';}
async function devicePage(){
 setActive('devices'); sidebar.classList.remove('open');
 content.innerHTML='<div class="title-row"><div><h1>Geräteprüfung</h1><span class="sub">Prüfungen, Fristen und Verantwortlichkeiten</span></div><div class="quick"><button class="btn primary" onclick="openDeviceScan()">📷 Gerät scannen</button><button class="btn secondary" onclick="deviceForm()">＋ Gerät</button></div></div><div class="panel"><div class="toolbar"><input id="deviceSearch" placeholder="Gerät, Inventarnummer, Barcode oder Seriennummer suchen" oninput="loadDevices()"><button class="btn secondary" onclick="loadDevices()">↻ Aktualisieren</button></div><div id="deviceMsg"></div><div class="table-wrap"><table class="table"><thead><tr><th>Gerät</th><th>Inventar</th><th>Standort</th><th>Letzte Prüfung</th><th>Nächste Prüfung</th><th>Verantwortlich</th><th>Status</th></tr></thead><tbody id="deviceRows"></tbody></table></div></div>';
 await loadDevices();
}
async function loadDevices(){
 const q=document.getElementById('deviceSearch')?.value||'';
 try{const list=await api('/api/devices?q='+encodeURIComponent(q));deviceRows.innerHTML=list.map(d=>'<tr onclick="openDevice('+d.id+')" style="cursor:pointer"><td><strong>'+esc(d.name)+'</strong><br><small class="sub">'+esc([d.manufacturer,d.model].filter(Boolean).join(' '))+'</small></td><td>'+esc(d.inventoryNumber||'–')+'</td><td>'+esc(d.location||'–')+'</td><td>'+esc(d.lastInspectionDate||'–')+'</td><td>'+esc(d.nextInspectionDate||'–')+'</td><td>'+esc(d.responsibleUsername||'–')+'</td><td>'+deviceBadge(d.status)+'</td></tr>').join('')||'<tr><td colspan="7" class="empty">Keine Geräte gefunden.</td></tr>'}catch(e){deviceRows.innerHTML='<tr><td colspan="7" class="empty">'+esc(e.message)+'</td></tr>'}
}
function deviceBadge(s){return s==='UEBERFAELLIG'?'<span class="badge off">Überfällig</span>':s==='BALD'?'<span class="badge" style="background:#fff1cf;color:#8a5a00">Bald fällig</span>':s==='GUELTIG'?'<span class="badge ok">Gültig</span>':'<span class="badge">Unbekannt</span>'}
async function openDevice(id){
 try{const x=await api('/api/devices/'+id),d=x.device;modalTitle.textContent=d.name;modalBody.innerHTML='<div class="form-grid"><div class="field"><label>Inventarnummer</label><input value="'+esc(d.inventoryNumber||'')+'" readonly></div><div class="field"><label>Barcode</label><input value="'+esc(d.barcode||'')+'" readonly></div><div class="field"><label>Seriennummer</label><input value="'+esc(d.serialNumber||'')+'" readonly></div><div class="field"><label>Standort</label><input value="'+esc(d.location||'')+'" readonly></div><div class="field"><label>Letzte Prüfung</label><input value="'+esc(d.lastInspectionDate||'')+'" readonly></div><div class="field"><label>Nächste Prüfung</label><input value="'+esc(d.nextInspectionDate||'')+'" readonly></div><div class="field full"><label>Bemerkungen</label><textarea readonly>'+esc(d.notes||'')+'</textarea></div></div><hr><h3>Prüfung erfassen</h3><div class="form-grid"><div class="field"><label>Prüfdatum *</label><input id="inspDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Nächste Prüfung</label><input id="inspNext" type="date" value="'+esc(d.nextInspectionDate||'')+'"></div><div class="field"><label>Prüfart</label><input id="inspType" placeholder="z. B. wiederkehrende Prüfung"></div><div class="field"><label>Ergebnis</label><select id="inspResult"><option>BESTANDEN</option><option>MIT_MANGEL</option><option>NICHT_BESTANDEN</option></select></div><div class="field"><label>Prüfer</label><input id="inspInspector" value="'+esc(username)+'"></div><div class="field full"><label>Festgestellte Mängel</label><textarea id="inspDefects"></textarea></div><div class="field full"><label>Maßnahmen</label><textarea id="inspMeasures"></textarea></div><div class="field full"><label>Notizen</label><textarea id="inspNotes"></textarea></div></div><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn secondary" onclick="closeModal()">Abbrechen</button><button class="btn primary" onclick="saveInspection('+id+')">Prüfung speichern</button></div><hr><h3>Prüfhistorie</h3><div class="table-wrap"><table class="table"><thead><tr><th>Datum</th><th>Prüfart</th><th>Ergebnis</th><th>Prüfer</th><th>Nächste Prüfung</th></tr></thead><tbody>'+x.inspections.map(i=>'<tr><td>'+esc(i.inspectionDate)+'</td><td>'+esc(i.inspectionType||'–')+'</td><td>'+esc(i.result||'–')+'</td><td>'+esc(i.inspector||'–')+'</td><td>'+esc(i.nextInspectionDate||'–')+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">Noch keine Prüfungen.</td></tr>'+'</tbody></table></div>';modal.classList.remove('hidden')}catch(e){alert(e.message)}
}
async function saveInspection(id){
 const body={inspectionDate:inspDate.value,nextInspectionDate:inspNext.value||null,inspectionType:inspType.value,result:inspResult.value,inspector:inspInspector.value,defects:inspDefects.value,measures:inspMeasures.value,notes:inspNotes.value};
 try{await api('/api/devices/'+id+'/inspections',{method:'POST',body:JSON.stringify(body)});closeModal();loadDevices()}catch(e){alert(e.message)}
}
function deviceForm(){
 modalTitle.textContent='Gerät anlegen';modalBody.innerHTML='<div class="form-grid"><div class="field full"><label>Bezeichnung *</label><input id="devName"></div><div class="field"><label>Inventarnummer</label><input id="devInv"></div><div class="field"><label>Barcode</label><input id="devBarcode"><button class="btn secondary small" onclick="openDeviceScanForInput(\'devBarcode\')">📷 scannen</button></div><div class="field"><label>Seriennummer</label><input id="devSerial"></div><div class="field"><label>Hersteller</label><input id="devManufacturer"></div><div class="field"><label>Modell</label><input id="devModel"></div><div class="field"><label>Kategorie</label><input id="devCategory"></div><div class="field"><label>Standort</label><input id="devLocation"></div><div class="field"><label>Nächste Prüfung</label><input id="devNext" type="date"></div><div class="field"><label>Intervall (Monate)</label><input id="devInterval" type="number" min="1"></div><div class="field"><label>Verantwortlicher Kamerad</label><input id="devResponsible"></div><div class="field full"><label>Bemerkungen</label><textarea id="devNotes"></textarea></div></div><div style="display:flex;justify-content:flex-end"><button class="btn primary" onclick="saveDevice()">Speichern</button></div>';modal.classList.remove('hidden')
}
async function saveDevice(){const body={name:devName.value,inventoryNumber:devInv.value,barcode:devBarcode.value,serialNumber:devSerial.value,manufacturer:devManufacturer.value,model:devModel.value,category:devCategory.value,location:devLocation.value,purchaseDate:null,nextInspectionDate:devNext.value||null,inspectionIntervalMonths:devInterval.value?Number(devInterval.value):null,responsibleUsername:devResponsible.value,notes:devNotes.value,active:true};try{await api('/api/devices',{method:'POST',body:JSON.stringify(body)});closeModal();loadDevices()}catch(e){alert(e.message)}}
async function openDeviceScanForInput(target){openDeviceScan(target)}
async function openDeviceScan(target){
 modalTitle.textContent='Gerät scannen';modalBody.innerHTML='<p class="sub">Barcode/QR-Code scannen. Für eine aufgedruckte Seriennummer kann der erkannte Text anschließend manuell übernommen werden.</p><video id="deviceScanVideo" playsinline autoplay style="width:100%;max-height:48vh;background:#111;border-radius:12px"></video><div class="field"><label>Scanwert / Seriennummer</label><input id="deviceScanValue" autocomplete="off"><div style="display:flex;gap:8px;margin-top:8px"><button class="btn primary" onclick="useDeviceScan(\''+esc(target||'')+'\')">Übernehmen</button><button class="btn secondary" onclick="findDeviceByScan()">Gerät suchen</button></div></div><div id="deviceScanStatus" class="message">Kamera wird gestartet …</div>';modal.classList.remove('hidden');
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw Error('Kamera wird von diesem Browser nicht unterstützt.');
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});deviceScannerStream=stream;deviceScanVideo.srcObject=stream;
  if('BarcodeDetector' in window){deviceScannerDetector=new BarcodeDetector();const loop=async()=>{if(!deviceScannerStream)return;try{const codes=await deviceScannerDetector.detect(deviceScanVideo);if(codes.length){deviceScanValue.value=codes[0].rawValue;deviceScanStatus.textContent='Barcode erkannt: '+codes[0].rawValue;return}}catch(e){}deviceScannerTimer=setTimeout(loop,250)};loop();deviceScanStatus.textContent='Barcode-Erkennung aktiv. Für reine Seriennummern bitte den Text unten eingeben.'}else deviceScanStatus.textContent='Barcode-Erkennung in diesem Browser nicht verfügbar. Wert unten eingeben.';
 }catch(e){deviceScanStatus.textContent=e.message+' Bitte Wert unten eingeben.'}
}
async function findDeviceByScan(){const v=deviceScanValue.value.trim();if(!v)return;try{const d=await api('/api/devices/scan?value='+encodeURIComponent(v));stopDeviceScanner();closeModal();openDevice(d.id)}catch(e){deviceScanStatus.textContent=e.message}}
function useDeviceScan(target){const v=deviceScanValue.value.trim();if(!v)return;if(target){document.getElementById(target).value=v;stopDeviceScanner();closeModal()}else findDeviceByScan()}
function stopDeviceScanner(){if(deviceScannerTimer){clearTimeout(deviceScannerTimer);deviceScannerTimer=null}if(deviceScannerStream){deviceScannerStream.getTracks().forEach(t=>t.stop());deviceScannerStream=null}deviceScannerDetector=null}
</script></body></html>
