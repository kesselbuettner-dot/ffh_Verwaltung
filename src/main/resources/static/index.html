<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FFH Verwaltung Login</title><style>
body{font-family:system-ui;margin:0;background:#f4f4f4;color:#222}header{background:#222;color:#fff;padding:18px}
main{max-width:900px;margin:auto;padding:18px}.card{background:#fff;padding:20px;border-radius:14px;margin:14px 0;box-shadow:0 2px 10px #0001}
input,select,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border-radius:9px;border:1px solid #ccc}button{background:#222;color:#fff;border:0;cursor:pointer}
.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.ok{padding:10px;border-radius:8px;background:#e8f5e9}
</style></head><body><header>🍺 <strong>FFH Verwaltung App</strong></header><main>
<div id="login" class="card"><h2>Anmelden</h2><input id="username" placeholder="Benutzername"><input id="password" type="password" placeholder="Passwort"><button onclick="login()">Anmelden</button><p id="err"></p></div>
<div id="app" class="hidden"><div class="card"><h2 id="welcome"></h2><button onclick="logout()">Abmelden</button></div>
<div id="memberArea" class="card hidden"><h3>Mitgliederbereich</h3><p>Dein persönlicher Bereich kann hier als nächstes mit dem digitalen Deckel verbunden werden.</p></div>
<div id="counterArea" class="card hidden"><h3>Thekenbereich</h3><div class="grid"><select id="member"></select><select id="drink"></select><input id="qty" type="number" min="1" value="1"><button onclick="book()">Getränk buchen</button></div><div id="result"></div></div>
<div id="adminArea" class="card hidden"><h3>Adminbereich</h3><p>Benutzer und Rollen verwalten.</p><a href="/swagger-ui.html">API / Swagger öffnen</a></div>
</div></main>
<script>
let token=null, role=null;
function auth(){return {Authorization:'Bearer '+token,'Content-Type':'application/json'}}
async function login(){
 const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});
 if(!r.ok){err.textContent='Anmeldung fehlgeschlagen';return}
 const x=await r.json(); token=x.token;role=x.role;localStorage.setItem('token',token);localStorage.setItem('role',role);show();
}
function show(){loginBox=false;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');welcome.textContent='Angemeldet: '+role;
 if(role==='MEMBER') memberArea.classList.remove('hidden'); else {counterArea.classList.remove('hidden');loadCounter()}
 if(role==='ADMIN') adminArea.classList.remove('hidden')}
function logout(){localStorage.clear();location.reload()}
async function loadCounter(){
 const [m,d]=await Promise.all([fetch('/api/members',{headers:auth()}).then(r=>r.json()),fetch('/api/drinks',{headers:auth()}).then(r=>r.json())]);
 member.innerHTML=m.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
 drink.innerHTML=d.map(x=>`<option value="${x.id}">${x.name} – ${Number(x.price).toFixed(2)} €</option>`).join('');
}
async function book(){
 const r=await fetch('/api/bookings',{method:'POST',headers:auth(),body:JSON.stringify({memberId:Number(member.value),drinkId:Number(drink.value),quantity:Number(qty.value)})});
 result.textContent=r.ok?'Buchung gespeichert.':'Buchung fehlgeschlagen.';
}
window.addEventListener('load',()=>{token=localStorage.getItem('token');role=localStorage.getItem('role');if(token&&role)show()})
</script></body></html>
