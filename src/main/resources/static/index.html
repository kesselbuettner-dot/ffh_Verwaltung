<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FFH Verwaltung</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#b51f2b">
<link rel="icon" type="image/svg+xml" href="/icons/wache48-logo.svg">
<style>
:root{--bg:#f3f5f7;--panel:#fff;--ink:#18212b;--muted:#687582;--line:#dfe4e8;--accent:#b51f2b;--accent2:#8d1621;--nav:#18212b;--nav2:#24313e;--ok:#19713b;--warn:#a46600}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 12px 40px #0002}.logo{font-size:34px;font-weight:800}.sub{color:var(--muted)}
.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--nav);color:#fff}.btn:hover{background:#0e151c}.btn.primary{background:var(--accent)}.btn.secondary{background:#eef1f4;color:var(--ink)}.btn.danger{background:#a51f2b}.btn.small{padding:7px 10px;font-size:13px}
.layout{display:flex;min-height:100vh}.sidebar{width:280px;background:var(--nav);color:#fff;flex:none;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:8px 12px 20px;border-bottom:1px solid #ffffff1a;margin-bottom:12px}.brand strong{font-size:20px}.brand small{display:block;color:#aeb8c1;margin-top:3px}.nav-section{margin:16px 8px 6px;color:#8f9ca8;font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.08em}.nav-item{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;color:#dce3e8;text-align:left;padding:10px 12px;border-radius:9px;margin:2px 0}.nav-item:hover,.nav-item.active{background:var(--nav2);color:#fff}.nav-child{padding-left:42px;font-size:14px}.main{flex:1;min-width:0}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:5}.topbar .user{color:var(--muted);font-size:14px}.content{padding:26px;max-width:1500px;margin:auto}.title-row{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.title-row h1{margin:0;font-size:28px}.cards{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:29px;font-weight:800;margin-top:5px}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.panel h3{margin:0 0 14px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:12px;color:var(--muted);text-transform:uppercase}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf1f4;font-size:12px;font-weight:700}.badge.ok{background:#e6f5eb;color:var(--ok)}.badge.off{background:#f4e9ea;color:#a51f2b}.balance.pos{color:var(--accent);font-weight:800}.balance.zero{color:var(--ok);font-weight:800}.balance.neg{color:#9a6200;font-weight:800}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:15px}.toolbar input{max-width:360px;padding:10px;border:1px solid var(--line);border-radius:10px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 16px}.form-grid .full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px;z-index:20}.modal-card{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.message{padding:10px;border-radius:9px;margin:10px 0}.error{background:#fde9eb;color:#8e1c26}.success{background:#e7f6ec;color:#176b39}.empty{color:var(--muted);padding:18px;text-align:center}
@media(max-width:1000px){.sidebar{width:230px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:700px){.sidebar{position:fixed;z-index:10;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.content{padding:16px}.topbar{padding:0 16px}.form-grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.title-row{align-items:flex-start}.title-row h1{font-size:23px}}

.big{min-height:48px}.quick{display:flex;gap:12px;flex-wrap:wrap}.pos-layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;align-items:start}.pos-products,.cart{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.member-bar{display:flex;gap:12px;align-items:center;margin-bottom:14px}.member-selected{font-size:20px;font-weight:800;flex:1;padding:14px;border:2px solid var(--line);border-radius:12px;background:#f8fafb}.balance-pill{padding:13px 16px;background:#eef7f1;border-radius:12px;white-space:nowrap}.category-tabs{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.cat{border:0;border-radius:999px;background:#eef1f4;padding:12px 18px;white-space:nowrap;font-weight:800}.cat.active{background:var(--nav);color:#fff}.drink-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.drink-tile{position:relative;min-height:145px;border:1px solid var(--line);border-radius:15px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:14px;box-shadow:0 2px 5px #0000000a}.drink-tile:active{transform:scale(.97)}.drink-tile.sold-out{background:#e5e7eb;border-color:#d1d5db;color:#6b7280;opacity:.72;cursor:not-allowed;box-shadow:none}.drink-tile.sold-out:active{transform:none}.sold-out-label{margin-top:4px;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}.drink-icon{font-size:38px}.drink-price{font-size:20px;font-weight:900}.tile-count{position:absolute;right:8px;top:8px;background:var(--accent);color:#fff;border-radius:999px;padding:5px 9px;font-weight:900}.cart{position:sticky;top:84px}.cart-head{display:flex;justify-content:space-between;align-items:center}.cart-head h2{margin:0}.cart-items{min-height:180px}.cart-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:13px 0}.cart-row small{display:block;color:var(--muted);margin-top:3px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:42px;height:42px;border:0;border-radius:10px;background:#eef1f4;font-size:25px;font-weight:800}.cart-total{display:flex;justify-content:space-between;font-size:23px;padding:18px 0;border-top:2px solid var(--ink);margin-top:10px}.checkout{width:100%;min-height:64px;font-size:21px;font-weight:900}.checkout:disabled{opacity:.45;cursor:not-allowed}.center{text-align:center;padding-top:10px}.history-panel{margin-top:18px}.history-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.history-toolbar input{padding:11px;border:1px solid var(--line);border-radius:10px}.order-history{display:grid;gap:8px}.order-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.order-main{display:flex;gap:12px;align-items:center;justify-content:space-between}.order-main .meta{min-width:0}.order-items{color:var(--muted);font-size:13px;margin-top:5px}.order-card.cancelled{background:#faf1f2;border-color:#e7c7ca}.status-cancelled{background:#f4dfe1;color:#8e1c26}.status-completed{background:#e6f5eb;color:var(--ok)}.history-date{font-weight:900}.history-total{font-size:18px;font-weight:900;white-space:nowrap}.storno-btn{min-height:44px}.member-choices{display:grid;gap:8px}.member-choice{min-height:58px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700}.member-choice:active{background:#eef1f4}
@media(max-width:1050px){.pos-layout{grid-template-columns:1fr}.cart{position:static}.drink-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
@media(max-width:700px){.member-bar{align-items:stretch;flex-direction:column}.member-selected{font-size:18px}.drink-grid{grid-template-columns:repeat(2,1fr)}.drink-tile{min-height:135px}.cart-row{grid-template-columns:1fr auto}.cart-row>strong:last-child{grid-column:2}.pos-products,.cart{padding:12px}}

.drink-size{display:block;font-size:.95rem;color:#64748b;font-weight:600;margin-top:3px}.finance-chart{display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap}.pie{width:220px;height:220px;border-radius:50%;position:relative;display:grid;place-items:center}.pie::after{content:"";position:absolute;width:125px;height:125px;border-radius:50%;background:#fff}.pie-center{position:relative;z-index:1;text-align:center;font-weight:900;font-size:18px}.pie-center small{display:block;color:var(--muted);font-weight:700;font-size:12px}.finance-legend{display:grid;gap:12px;min-width:200px}.legend-row{display:flex;align-items:center;justify-content:space-between;gap:18px}.legend-dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:7px}.dot-income{background:#198754}.dot-expense{background:#dc3545}.registration-link{text-align:center;margin-top:12px}
</style>
</head>
<body>
<div id="loginView" class="login"><div class="login-card"><div class="logo">🚒 FFH Verwaltung</div><p class="sub">Vereins- und Feuerwehrverwaltung</p><div class="field"><label>Benutzername / E-Mail</label><input id="loginUser" autocomplete="username"></div><div class="field"><label>Passwort</label><input id="loginPass" type="password" autocomplete="current-password"></div><button class="btn primary big" onclick="login()">Anmelden</button><div id="loginMsg"></div><div class="registration-link"><button class="btn secondary" onclick="openRegistration()">Noch kein Zugang? Jetzt registrieren</button></div></div></div>
<div id="appView" class="layout hidden"><aside id="sidebar" class="sidebar"><div class="brand"><strong>🚒 FFH Verwaltung</strong><small>Vereins- & Feuerwehrportal</small></div><div class="nav-section">Übersicht</div><button class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">🏠 <span>Dashboard</span></button><div class="nav-section">Verein</div><button class="nav-item" data-page="members" onclick="navigate('members')">👥 <span>Mitglieder</span></button><div class="nav-section">Verkauf</div><button class="nav-item" data-page="theke" onclick="navigate('theke')">🍺 <span>Kasse / Theke</span></button>
<div id="inventoryNav" class="hidden">
<button class="nav-item nav-child" data-page="shopping" onclick="inventoryPage('shopping')">🛒 Einkaufsliste</button>
<button class="nav-item nav-child" data-page="purchase" onclick="inventoryPage('purchase')">📥 Wareneingang</button><button class="nav-item nav-child" data-page="inventory" onclick="inventoryPage('inventory')">📋 Inventur</button>
<button class="nav-item nav-child" data-page="articles" onclick="inventoryPage('articles')">🥤 Artikel verwalten</button>
</div>
<button class="nav-item nav-child" onclick="module('Essen')">🍴 Essen</button><button class="nav-item nav-child" onclick="module('Lager')">📦 Lager</button><div class="nav-section">Weitere Bereiche</div><button class="nav-item" onclick="module('Veranstaltungen')">📅 Veranstaltungen</button><button class="nav-item" onclick="module('Feuerwehr')">🚒 Feuerwehr</button><button class="nav-item" onclick="module('Schulung / Dienst')">🎓 Schulung / Dienst</button><button class="nav-item" onclick="module('Finanzen')">💶 Finanzen</button><button class="nav-item" onclick="module('Dokumente')">📄 Dokumente</button><button class="nav-item" onclick="module('Kalender')">📆 Kalender</button><button class="nav-item" onclick="module('Spenden')">🤝 Spenden</button><div class="nav-section">System</div><button class="nav-item" data-page="admin" onclick="navigate('admin')">⚙️ <span>Administration</span></button></aside><main class="main"><header class="topbar"><button class="btn secondary" onclick="toggleMenu()">☰</button><div class="user">Angemeldet als <strong id="currentUser"></strong> · <span id="currentRole"></span> <button class="btn small secondary" onclick="logout()">Abmelden</button></div></header><section id="content" class="content"></section></main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button class="btn secondary small" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>let token=localStorage.getItem('token')||null;
let role=localStorage.getItem('role')||null;
let username=localStorage.getItem('username')||'';
let memberId=localStorage.getItem('memberId')||null;
let memberName=localStorage.getItem('memberName')||'';
let members=[];
let drinks=[];
let cart=[];
// Kassenkategorie bewusst vor allen Funktionen initialisieren.
// Verhindert TDZ-Fehler bei PWA/Browser-Wiederherstellung.
let activeCategory='Alle';
const roles=['ADMIN','VORSTAND','KASSENWART','FEUERWEHRWART','THEKE','MEMBER'];
const roleLabels={ADMIN:'Administrator',VORSTAND:'Vorstand',KASSENWART:'Kassenwart',FEUERWEHRWART:'Feuerwehrwart',THEKE:'Theke',MEMBER:'Mitglied'};
function headers(){return {'Authorization':'Bearer '+token,'Content-Type':'application/json'}}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...headers()};const r=await fetch(url,opt);if(r.status===401){logout();throw Error('Nicht angemeldet');}if(!r.ok){let t='Fehler';try{const j=await r.json();t=j.message||j.detail||(typeof j.error==='string'&&j.error!=='Conflict'?j.error:null)||t}catch{}throw Error(t)}return r.status===204?null:r.json()}
function openRegistration(){modalTitle.textContent='Mitglied registrieren';modalBody.innerHTML=`<div id="regMsg"></div><p class="sub">Die Registrierung wird erst nach Prüfung durch einen Administrator freigeschaltet.</p><div class="form-grid"><div class="field"><label>Vorname *</label><input id="regFirst" autocomplete="given-name"></div><div class="field"><label>Nachname *</label><input id="regLast" autocomplete="family-name"></div><div class="field full"><label>E-Mail *</label><input id="regEmail" type="email" autocomplete="email"></div><div class="field full"><label>Passwort *</label><input id="regPass" type="password" minlength="8" autocomplete="new-password"><small class="sub">Mindestens 8 Zeichen</small></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px"><button class="btn secondary" onclick="closeModal()">Abbrechen</button><button class="btn primary" onclick="registerMember()">Registrieren</button></div>`;modal.classList.remove('hidden')}
async function registerMember(){const first=regFirst.value.trim(),last=regLast.value.trim(),email=regEmail.value.trim(),password=regPass.value;if(!first||!last||!email||password.length<8){regMsg.innerHTML='<div class="message error">Bitte Vorname, Nachname, E-Mail und ein Passwort mit mindestens 8 Zeichen eingeben.</div>';return}try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({firstName:first,lastName:last,email,password})});if(!r.ok){let t='Registrierung fehlgeschlagen';try{const j=await r.json();t=j.message||j.error||t}catch{}throw Error(t)}const x=await r.json();closeModal();loginMsg.innerHTML='<div class="message success">✓ '+esc(x.message)+'</div>'}catch(e){regMsg.innerHTML='<div class="message error">'+esc(e.message)+'</div>'}}
async function login(){const u=loginUser.value.trim(),p=loginPass.value;loginMsg.innerHTML='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});if(!r.ok){let t='Ungültige Zugangsdaten';try{const j=await r.json();t=j.message||j.error||t}catch{}throw Error(t)}const x=await r.json();token=x.token;role=x.role;username=x.username;memberId=x.memberId;memberName=x.memberName||'';localStorage.setItem('token',token);localStorage.setItem('role',role);localStorage.setItem('username',username);if(memberId)localStorage.setItem('memberId',memberId);else localStorage.removeItem('memberId');localStorage.setItem('memberName',memberName);showApp()}catch(e){loginMsg.innerHTML=`<div class="message error">${esc(e.message)}</div>`}}
function showApp(){loginView.classList.add('hidden');appView.classList.remove('hidden');currentUser.textContent=username;currentRole.textContent=roleLabels[role]||role;document.getElementById('inventoryNav')?.classList.toggle('hidden',role!=='ADMIN');navigate(role==='THEKE'?'theke':'dashboard')}
function logout(){localStorage.clear();location.reload()}
function toggleMenu(){sidebar.classList.toggle('open')}
function setActive(page){document.querySelectorAll('.nav-item[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}
function navigate(page){setActive(page);sidebar.classList.remove('open');if(page==='dashboard')dashboard();else if(page==='members')membersPage();else if(page==='theke')thekePage();else if(page==='admin')adminPage();else if(['shopping','purchase','articles','inventory'].includes(page))inventoryPage(page)}
function module(name){content.innerHTML=`<div class="title-row"><h1>${esc(name)}</h1></div><div class="panel"><h3>Modul vorbereitet</h3><p>Die Navigation steht. Dieses Modul wird in einer nächsten Ausbaustufe fachlich verbunden.</p></div>`}
function money(v){return Number(v||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function dashboard(){content.innerHTML=`<div class="title-row"><h1>Dashboard</h1><span class="sub">Aktuelle Übersicht</span></div><div class="cards"><div class="stat"><div class="label">Mitglieder</div><div class="value" id="sMembers">–</div></div><div class="stat"><div class="label">Aktive Mitglieder</div><div class="value" id="sActive">–</div></div><div class="stat"><div class="label">Kontostände gesamt</div><div class="value" id="sBalance">–</div></div><div class="stat"><div class="label">Getränke</div><div class="value" id="sDrinks">–</div></div><div class="stat"><div class="label">Angebotsartikel</div><div class="value" id="sOffers">–</div></div><div class="stat"><div class="label">Einnahmen diesen Monat</div><div class="value" id="sIncome">–</div></div><div class="stat"><div class="label">Ausgaben diesen Monat</div><div class="value" id="sExpenses">–</div></div><div class="stat"><div class="label">Saldo diesen Monat</div><div class="value" id="sFinanceBalance">–</div></div></div><div class="grid2"><div class="panel"><h3>Schnellzugriff</h3><div class="quick"><button class="btn primary big" onclick="navigate('theke')">🍺 Kasse öffnen</button><button class="btn secondary big" onclick="navigate('members')">👥 Mitglieder</button>${role==='ADMIN'?'<button class="btn secondary big" onclick="navigate(\"inventory\")">📋 Inventur</button>':''}</div></div><div class="panel"><h3>Finanzen – aktueller Monat</h3><div class="finance-chart"><div id="financePie" class="pie"><div class="pie-center"><span id="pieBalance">0,00 €</span><small>Saldo</small></div></div><div class="finance-legend"><div class="legend-row"><span><span class="legend-dot dot-income"></span>Einnahmen</span><strong id="pieIncome">0,00 €</strong></div><div class="legend-row"><span><span class="legend-dot dot-expense"></span>Ausgaben</span><strong id="pieExpenses">0,00 €</strong></div><div class="sub" id="financePeriod">–</div></div></div></div></div>`;try{if(['ADMIN','VORSTAND','KASSENWART','THEKE'].includes(role)){members=await api('/api/members');sMembers.textContent=members.length;sActive.textContent=members.filter(m=>m.active).length;sBalance.textContent=money(members.reduce((a,m)=>a+Number(m.balance||0),0))}else{sMembers.textContent='–';sActive.textContent='–';sBalance.textContent='–'}drinks=await api('/api/drinks');sDrinks.textContent=drinks.filter(d=>d.active).length;if(role==='ADMIN'){const shopping=await api('/api/inventory/shopping-list');sOffers.textContent=shopping.filter(x=>x.marktguruOffer!=null).length}else{sOffers.textContent='–'}if(['ADMIN','VORSTAND','KASSENWART'].includes(role)){const f=await api('/api/dashboard/finance');sIncome.textContent=money(f.income);sExpenses.textContent=money(f.expenses);sFinanceBalance.textContent=money(f.balance);financePeriod.textContent=`${f.from} bis ${f.to}`;pieIncome.textContent=money(f.income);pieExpenses.textContent=money(f.expenses);pieBalance.textContent=money(f.balance);const income=Math.max(0,Number(f.income||0)),expenses=Math.max(0,Number(f.expenses||0)),total=income+expenses;financePie.style.background=total?`conic-gradient(#198754 0deg ${(income/total)*360}deg,#dc3545 ${(income/total)*360}deg 360deg)`:'conic-gradient(#dfe4e8 0deg 360deg)'}else{sIncome.textContent='–';sExpenses.textContent='–';sFinanceBalance.textContent='–'}}catch{}}
async function membersPage(){if(!['ADMIN','VORSTAND','KASSENWART','THEKE'].includes(role)){content.innerHTML='<div class="panel"><h2>Keine Berechtigung</h2></div>';return}const canEdit=['ADMIN','VORSTAND'].includes(role);const canBalance=['ADMIN','VORSTAND','KASSENWART'].includes(role);content.innerHTML=`<div class="title-row"><div><h1>Mitglieder</h1><span class="sub">Mitgliederdaten, persönlicher Login und Kontostand</span></div>${canEdit?'<button class="btn primary big" onclick="openMemberForm()">＋ Mitglied anlegen</button>':''}</div><div class="panel"><div class="toolbar"><input id="memberSearch" placeholder="🔎 Name, E-Mail oder Telefon suchen…" oninput="renderMembers()"><select id="memberFilter" onchange="renderMembers()"><option value="all">Alle Status</option><option value="active">Aktiv</option><option value="inactive">Inaktiv</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Mitglied</th><th>Login</th><th>Rolle</th><th>Status</th><th>Kontostand</th><th>Aktionen</th></tr></thead><tbody id="memberRows"></tbody></table></div></div>`;try{members=await api('/api/members');renderMembers()}catch(e){memberRows.innerHTML=`<tr><td colspan="6" class="empty">${esc(e.message)}</td></tr>`}}

async function loadArticles(){

  try{const q=encodeURIComponent(articleSearch?.value||'');const a=await api('/api/inventory/articles?q='+q);
    articleRows.innerHTML=a.map(x=>`<tr><td><strong>${esc(x.name)}</strong><br><span class="sub">${esc(x.category||'')}</span></td><td>${esc(x.ean||'–')}</td><td><strong class="${x.stock<x.warningThreshold?'balance neg':''}">${x.stock}</strong></td><td>${x.warningThreshold}</td><td>${money(x.price)}</td><td>${x.lastPurchasePrice==null?'–':money(x.lastPurchasePrice)}</td><td>${x.averagePurchasePrice==null?'–':money(x.averagePurchasePrice)}</td><td>${x.sizeVolume!=null&&x.sizeUnitShortName?esc(String(x.sizeVolume))+' '+esc(x.sizeUnitShortName):'–'}${x.packageQuantity!=null?'<br><small class="sub">Gebindegröße: '+esc(String(x.packageQuantity))+' Stück</small>':''}</td><td><button class="btn small secondary" onclick="openArticleForm(${x.id})">Bearbeiten</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">Keine Artikel gefunden.</td></tr>';
  }catch(e){articleRows.innerHTML=`<tr><td colspan="9" class="empty">${esc(e.message)}</td></tr>`}
}
async function openArticleForm(id){
  let a={name:'',category:'',price:'',ean:'',stock:0,warningThreshold:0,active:true,packageQuantity:'',sizeVolume:'',sizeUnitShortName:'l'};
  if(id) a=await api('/api/inventory/articles/'+id);
  modalTitle.textContent=id?'Artikel bearbeiten':'Artikel anlegen';
  modalBody.innerHTML=`<div class="form-grid"><div class="field"><label>Artikelname *</label><input id="afName" value="${esc(a.name)}"></div>
  <div class="field"><label>Kategorie</label><input id="afCategory" value="${esc(a.category||'')}"></div>
  <div class="field"><label>EAN / GTIN</label><div class="quick"><input id="afEan" style="flex:1" value="${esc(a.ean||'')}" inputmode="numeric" placeholder="EAN-13">${scannerButton('afEan')}</div></div>
  <div class="field"><label>Verkaufspreis *</label><input id="afPrice" type="number" step="0.01" min="0" value="${a.price??''}"></div>
  <div class="field"><label>Bestand</label><input value="${a.stock??0}" disabled><small class="sub">Bestand wird über Wareneingänge und Verkäufe verändert.</small></div>
  <div class="field"><label>Warnschwelle</label><input id="afThreshold" type="number" min="0" step="1" value="${a.warningThreshold??0}"></div>
   <div class="field"><label>Einzelgröße</label><input id="afSizeVolume" type="number" min="0.001" step="0.001" value="${a.sizeVolume??''}" placeholder="z. B. 0.5"></div>
   <div class="field"><label>Einheit Einzelgröße</label><input id="afSizeUnit" value="${esc(a.sizeUnitShortName||'l')}" placeholder="l, ml, cl, dl"></div>
   <div class="field"><label>Gebindegröße</label><input id="afPackQty" type="number" min="1" step="1" value="${a.packageQuantity??''}" placeholder="z. B. 20"><small class="sub">Anzahl Einzelstücke im Einkaufsgebinde, z. B. Kasten = 20.</small></div>
  <div class="field"><label>Status</label><select id="afActive"><option value="true" ${a.active?'selected':''}>Aktiv</option><option value="false" ${!a.active?'selected':''}>Inaktiv</option></select></div></div>
  <div id="articleMsg"></div><div class="quick" style="margin-top:16px"><button class="btn primary" onclick="saveArticle(${id||'null'})">Speichern</button><button class="btn secondary" onclick="closeModal()">Abbrechen</button></div>`;
  modal.classList.remove('hidden');
}
async function saveArticle(id){
  const body={name:afName.value.trim(),category:afCategory.value.trim(),ean:afEan.value.trim(),price:Number(afPrice.value),warningThreshold:Number(afThreshold.value),active:afActive.value==='true',packageQuantity:afPackQty.value?Number(afPackQty.value):null,sizeVolume:afSizeVolume.value?Number(afSizeVolume.value):null,sizeUnitShortName:afSizeUnit.value.trim()||null};
  try{await api(id?'/api/inventory/articles/'+id:'/api/inventory/articles',{method:id?'PUT':'POST',body:JSON.stringify(body)});closeModal();articlesPage()}catch(e){articleMsg.innerHTML=`<div class="message error">${esc(e.message)}</div>`}
}
async function inventoryPagePage(){
  content.innerHTML=`<div class="title-row"><div><h1>📋 Inventur</h1><span class="sub">Tatsächlichen Bestand zählen und mit einem Klick übernehmen. Die Inventur wird protokolliert.</span></div><button class="btn secondary" onclick="inventoryPagePage()">↻ Aktualisieren</button></div><div id="inventoryMsg"></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Artikel</th><th>Einzelgröße</th><th>Aktueller Bestand</th><th>Gezählter Bestand</th><th>Abweichung</th></tr></thead><tbody id="inventoryRows"></tbody></table></div><div class="quick" style="margin-top:16px"><button class="btn primary big" onclick="saveInventory()">📋 Inventur übernehmen</button></div></div>`;
  try{const list=await api('/api/inventory/inventory');inventoryRows.innerHTML=list.map(x=>`<tr><td><strong>${esc(x.name)}</strong><br><span class="sub">${esc(x.category||'')}</span></td><td>${x.sizeVolume!=null&&x.sizeUnitShortName?esc(String(x.sizeVolume))+' '+esc(x.sizeUnitShortName):'–'}</td><td>${x.stock}</td><td><input id="inv_${x.id}" data-stock="${x.stock}" type="number" min="0" step="1" value="${x.stock}" style="width:120px" oninput="updateInventoryDiff(${x.id},${x.stock})"></td><td id="diff_${x.id}">0</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Keine aktiven Artikel.</td></tr>'}catch(e){inventoryMsg.innerHTML=`<div class="message error">${esc(e.message)}</div>`}
}
function updateInventoryDiff(id,current){const el=document.getElementById('inv_'+id),out=document.getElementById('diff_'+id);if(el&&out){const d=Number(el.value||0)-Number(current||0);out.textContent=(d>0?'+':'')+d;out.className=d===0?'':(d>0?'balance pos':'balance neg')}}
async function saveInventory(){const inputs=[...document.querySelectorAll('input[id^="inv_"]')];if(!inputs.length)return;const items=inputs.map(i=>({drinkId:Number(i.id.substring(4)),countedStock:Math.max(0,Number(i.value||0))}));try{const r=await api('/api/inventory/inventory',{method:'POST',body:JSON.stringify({items})});await inventoryPagePage();inventoryMsg.innerHTML=`<div class="message success">✓ Inventur übernommen. ${r.changed} Artikel wurden im Bestand angepasst.</div>`}catch(e){inventoryMsg.innerHTML=`<div class="message error">${esc(e.message)}</div>`}}
async function purchasePage(){
  content.innerHTML=`<div class="title-row"><div><h1>Wareneingang</h1><span class="sub">Einkäufe erfassen und Bestand automatisch erhöhen</span></div></div>
  <div class="grid2"><div class="panel"><h3>Wareneingang buchen</h3><div class="field"><label>Artikel suchen / EAN</label><div class="quick"><input id="purchaseSearch" style="flex:1" placeholder="Name oder EAN" inputmode="numeric" oninput="findPurchaseArticles()">${scannerButton('purchaseSearch')}</div><div id="purchaseChoices"></div></div>
  <div id="selectedPurchase" class="message success hidden"></div><div class="form-grid"><div class="field"><label>Menge in Stück *</label><input id="purchaseQty" type="number" min="1" step="1" value="1"><small class="sub">Bestand und Einkauf werden in Einzelstücken geführt.</small></div><div class="field"><label>Einkaufspreis / Stück *</label><input id="purchasePrice" type="number" min="0" step="0.01"></div><div class="field"><label>Datum *</label><input id="purchaseDate" type="date"></div><div class="field"><label>Lieferant</label><input id="purchaseSupplier"></div><div class="field full"><label>Notiz</label><input id="purchaseNote"></div></div><button class="btn primary big" onclick="savePurchase()">📥 Wareneingang buchen</button><div id="purchaseMsg"></div></div>
  <div class="panel"><h3>Letzte Wareneingänge</h3><div class="table-wrap"><table class="table"><thead><tr><th>Datum</th><th>Artikel</th><th>Menge</th><th>EK</th><th>Lieferant</th></tr></thead><tbody id="purchaseRows"></tbody></table></div></div></div>`;
  purchaseDate.value=new Date().toLocaleDateString('en-CA');await loadPurchases();findPurchaseArticles();
}
let selectedPurchaseId=null;
async function findPurchaseArticles(){
  if(!purchaseChoices)return; const q=(purchaseSearch?.value||'').trim();
  if(!q){purchaseChoices.innerHTML='<div class="sub">Artikel eingeben oder Barcode scannen.</div>';return}
  try{const a=await api('/api/inventory/articles?q='+encodeURIComponent(q));purchaseChoices.innerHTML=a.slice(0,8).map(x=>`<button class="member-choice" style="width:100%" onclick="selectPurchaseArticle(${x.id},'${esc(x.name)}',${x.price})"><span>📦 ${esc(x.name)} <small>${esc(x.ean||'')}</small></span><strong>Bestand ${x.stock}</strong></button>`).join('')||'<div class="empty">Kein Artikel gefunden.</div>'}catch(e){purchaseChoices.innerHTML=`<div class="message error">${esc(e.message)}</div>`}
}
function selectPurchaseArticle(id,name,price){selectedPurchaseId=id;selectedPurchase.textContent='Ausgewählt: '+name;selectedPurchase.classList.remove('hidden');purchasePrice.value='';purchaseSearch.value=name;purchaseChoices.innerHTML=''}
async function savePurchase(){
  if(!selectedPurchaseId){purchaseMsg.innerHTML='<div class="message error">Bitte einen Artikel auswählen.</div>';return}
  try{await api('/api/inventory/purchases',{method:'POST',body:JSON.stringify({drinkId:selectedPurchaseId,quantity:Number(purchaseQty.value),unitPrice:Number(purchasePrice.value),purchaseDate:purchaseDate.value,supplier:purchaseSupplier.value,note:purchaseNote.value})});
  purchaseMsg.innerHTML='<div class="message success">✓ Wareneingang gebucht und Bestand erhöht.</div>';await loadPurchases();}catch(e){purchaseMsg.innerHTML=`<div class="message error">${esc(e.message)}</div>`}
}
async function loadPurchases(){
  if(!purchaseRows)return;try{const p=await api('/api/inventory/purchases');purchaseRows.innerHTML=p.slice(0,30).map(x=>`<tr><td>${esc(x.purchaseDate)}</td><td><strong>${esc(x.drinkName)}</strong></td><td>${x.quantity}</td><td>${money(x.unitPrice)}</td><td>${esc(x.supplier||'–')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Noch keine Wareneingänge.</td></tr>'}catch(e){purchaseRows.innerHTML=`<tr><td colspan="5" class="empty">${esc(e.message)}</td></tr>`}
}
async function shoppingListPage(){
  content.innerHTML=`<div class="title-row"><div><h1>Einkaufsliste</h1><span class="sub">Artikel unterhalb der Warnschwelle · Marktguru-Angebote passend zu Artikelname + Einzelgröße; Einkaufsgebinde wird dabei ignoriert</span></div><button class="btn secondary" onclick="shoppingListPage()">↻ Aktualisieren</button></div>
  <div class="panel"><div id="shoppingMsg" class="sub">Angebote werden geladen …</div><div class="table-wrap"><table class="table"><thead><tr><th>Artikel</th><th>Bestand</th><th>Warnschwelle</th><th>Vorschlag</th><th>Letzter EK</th><th>Ø EK</th><th>Marktguru</th><th>Angebot</th></tr></thead><tbody id="shoppingRows"></tbody></table></div></div>`;
  try{const list=await api('/api/inventory/shopping-list');shoppingRows.innerHTML=list.map(x=>{const o=x.marktguruOffer;const cheap=x.offerBelowLastPurchase;return `<tr><td><strong>${esc(x.name)}</strong><br><span class="sub">${esc(x.ean||'keine EAN')}</span></td><td class="${x.stock<x.warningThreshold?'balance neg':''}">${x.stock}</td><td>${x.warningThreshold}</td><td>${x.suggestedQuantity}</td><td>${x.lastPurchasePrice==null?'–':money(x.lastPurchasePrice)}</td><td>${x.averagePurchasePrice==null?'–':money(x.averagePurchasePrice)}</td><td>${o?.retailer?esc(o.retailer):'–'}${o?.productName?'<br><small>'+esc(o.productName)+'</small>':''}${o?.quantity!=null?'<br><small>Gebinde: '+esc(String(o.quantity))+(o.volume!=null?' × '+esc(String(o.volume)):'')+(o.unitShortName?' '+esc(o.unitShortName):'')+'</small>':''}${x.packageComparable?'<br><small class="sub">Einzelgröße passend</small>':'<br><small class="sub">Kein Preisvergleich – andere/fehlende Größe</small>'}${o?.referencePrice!=null?'<br><small>Grundpreis: '+money(o.referencePrice)+' / '+esc(o.unitShortName||'Einheit')+'</small>':''}${o?.description?'<br><small>'+esc(o.description)+'</small>':''}</td><td class="${cheap?'balance pos':''}">${o?.price==null?'–':money(o.price)}${o?.quantity>1?'<br><small>'+money(o.pricePerPiece)+' / Stück</small>':''} ${o?.oldPrice!=null?'<br><small>statt '+money(o.oldPrice)+'</small>':''}${cheap?'<span class="badge ok">unter letztem EK</span>':''}${x.offerBelowAveragePurchase?'<span class="badge ok">unter Ø EK</span>':''}${o?.loyaltyRequired?'<br><small>⚠ Kundenkarte</small>':''}${o?.validFrom||o?.validTo?'<br><small>Gültig: '+esc((o.validFrom||'').slice(0,10))+' – '+esc((o.validTo||'').slice(0,10))+'</small>':''}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Keine Artikel unterhalb der Warnschwelle.</td></tr>';shoppingMsg.textContent=list.length+' Artikel in der Einkaufsliste.'}catch(e){shoppingMsg.innerHTML='<div class="message error">'+esc(e.message)+'</div>'}
}
let barcodeStream=null,barcodeTimer=null;
async function openBarcodeScanner(targetId){
  modalTitle.textContent='Barcode scannen';
  modalBody.innerHTML=`<div><p class="sub">Kamera auf den EAN/GTIN-Code richten. Alternativ kann der Code unten manuell eingegeben werden.</p><video id="barcodeVideo" playsinline autoplay style="width:100%;max-height:55vh;background:#111;border-radius:12px"></video><div class="field"><label>Barcode</label><input id="manualBarcode" inputmode="numeric" placeholder="EAN-13"><button class="btn primary" style="margin-top:8px" onclick="useManualBarcode('${targetId}')">Übernehmen</button></div><div id="scannerStatus" class="message"></div></div>`;
  modal.classList.remove('hidden');
  try{
    if(!('BarcodeDetector' in window)){scannerStatus.textContent='Dieser Browser unterstützt die Barcode-Erkennung nicht. Bitte Barcode unten eingeben.';return}
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});barcodeStream=stream;barcodeVideo.srcObject=stream;
    const detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
    const loop=async()=>{if(!barcodeStream)return;try{const codes=await detector.detect(barcodeVideo);if(codes.length){useManualBarcode(targetId,codes[0].rawValue);return}}catch(e){}barcodeTimer=setTimeout(loop,250)};loop();
  }catch(e){scannerStatus.textContent='Kamerazugriff nicht möglich. Bitte Kamera-Berechtigung erteilen oder den Barcode manuell eingeben.'}
}
function useManualBarcode(targetId,value){const v=(value??manualBarcode?.value??'').replace(/\D/g,'');if(!v){scannerStatus.textContent='Bitte einen Barcode eingeben.';return}const el=document.getElementById(targetId);if(el){el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}))}closeModal();if(targetId==='purchaseSearch')findPurchaseArticles()}
const oldCloseModal=closeModal;
closeModal=function(){if(barcodeTimer){clearTimeout(barcodeTimer);barcodeTimer=null}if(barcodeStream){barcodeStream.getTracks().forEach(t=>t.stop());barcodeStream=null}oldCloseModal()}
</script>\n<script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {})); }</script></body></html>
