spring.application.name=ffh_verwaltung-app
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ffh_verwaltung}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ffh_verwaltung}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
springdoc.swagger-ui.path=/swagger-ui.html
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
app.jwt.expiration-minutes=480

# Marktguru integration. Leave endpoint empty until your licensed/approved
# marktguru API endpoint and API key are available.
app.marktguru.endpoint=${MARKTGURU_ENDPOINT:https://api.marktguru.de/api/v1/offers/search}
app.marktguru.api-key=${MARKTGURU_API_KEY:}
app.marktguru.client-key=${MARKTGURU_CLIENT_KEY:}
app.marktguru.zip=${MARKTGURU_ZIP:04109}
app.marktguru.limit=${MARKTGURU_LIMIT:24}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.storage.path=${APP_STORAGE_PATH:/app/data}
app.github.repository=${GITHUB_REPOSITORY:kesselbuettner-dot/ffh_Verwaltung}
app.version=${APP_VERSION:1.1.0}
app.git.commit=${APP_GIT_COMMIT:unknown}

app.updater.url=${APP_UPDATER_URL:http://updater:8091}
app.updater.token=${APP_UPDATER_TOKEN:}
