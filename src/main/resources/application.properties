spring.application.name=ffh_verwaltung-app
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ffh_verwaltung}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ffh_verwaltung}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
springdoc.swagger-ui.path=/swagger-ui.html
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
app.jwt.expiration-minutes=480
